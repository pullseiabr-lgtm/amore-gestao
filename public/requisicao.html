<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Requisição de Compra — Amore</title>
<style>
:root{--vinho:#8B1212;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--shadow:0 1px 2px rgba(80,20,25,.05),0 8px 24px -12px rgba(80,20,25,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
header.top{border-bottom:2px solid var(--vinho);padding-bottom:14px;margin-bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho);font-weight:700}
h1{font-size:23px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13.5px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;background:color-mix(in srgb,var(--vinho) 12%,var(--card));color:var(--vinho);border:1px solid var(--border);margin-top:6px}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .kn{font-size:22px;font-weight:800}.kpi .kl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.cat{margin:22px 0 8px;font-size:15.5px;font-weight:700;color:var(--vinho);display:flex;align-items:center;gap:8px}
.cat .cc{font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1px 9px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border)}tbody tr:last-child td{border-bottom:none}
.qt{text-align:right;white-space:nowrap;font-weight:700}.un{color:var(--muted);white-space:nowrap}.prod{font-weight:600}
.obs{font-size:11.5px;color:var(--warn)}
.foot{margin-top:26px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:640px){
  .tw{overflow:visible;border:none;box-shadow:none;background:transparent}table{min-width:0}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  tbody tr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:9px 13px;margin-bottom:8px}
  tbody td{padding:0;border:none}td.prod{flex:1}td.qt{font-size:15px}td.un{display:none}
  td.prod .obs{display:block}
}
@media print{.btn{display:none}body{background:#fff}.tw,.kpi{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Carregando requisição…</div></div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const q=new URLSearchParams(location.search);
const ID=(q.get('id')||'').trim();
const g=async p=>{try{return await (await fetch(SB+'/rest/v1/'+p,{headers:H})).json()}catch(e){return []}};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nf=v=>Number.isInteger(v)?String(v):(Math.round(v*100)/100).toLocaleString('pt-BR');
const un=u=>({'Unidade(s)':'un','Quilograma(s)':'kg','Caixa(s)':'cx','Pacote(s)':'pct','Litro(s)':'L','Grama(s)':'g'}[u]||u||'');
const STATUS={rascunho:'Rascunho',enviada:'Enviada',em_analise:'Em análise',em_cotacao:'Em cotação',parcialmente_aprovada:'Parc. aprovada',aprovada:'Aprovada',reprovada:'Reprovada',em_separacao:'Em separação',compra_realizada:'Compra realizada',concluida:'Concluída',cancelada:'Cancelada'};
const EMO={'Proteínas':'🥩','Pescados':'🐟','Laticínios':'🧀','Mercearia':'🥫','Legumes':'🥦','Frutas':'🍎','Embalagens':'📦','Descartáveis':'🍴','Limpeza':'🧴','Materiais':'🖨️','Bebidas':'🥤','Congelados':'🧊'};
const ORD=['Proteínas','Pescados','Laticínios','Mercearia','Legumes','Frutas','Bebidas','Congelados','Embalagens','Descartáveis','Limpeza','Materiais'];
const dDMY=s=>{if(!s)return '';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s};

async function run(){
  if(!ID){document.getElementById('app').innerHTML='<div class="msg">Requisição não informada.</div>';return;}
  // Busca requisição e itens em PARALELO — abre mais rápido.
  const [reqs, itens]=await Promise.all([
    g(`requisicoes?id=eq.${ID}&select=numero,loja,titulo,responsavel_nome,status,prioridade,data_necessidade,prazo_entrega,observacoes,created_at,created_by`),
    g(`requisicao_itens?requisicao_id=eq.${ID}&select=produto_nome,categoria,quantidade,unidade,observacoes&order=produto_nome.asc`),
  ]);
  const req=reqs&&reqs[0];
  if(!req){document.getElementById('app').innerHTML='<div class="msg">Requisição não encontrada.</div>';return;}
  const num='REQ-'+String(req.numero||0).padStart(4,'0');
  const lojaLabel={'Amore CD':'Amore Costa Dourada','Amore Paiva':'Amore Paiva','Flow CD':'Flow Costa Dourada'}[req.loja]||req.loja;
  const flow=/flow/i.test(req.loja||''); const MARCA=flow?'Flow':'Amore';
  const LOGO_FLOW='<svg viewBox="0 0 300 60" xmlns="http://www.w3.org/2000/svg" style="height:26px;width:auto" role="img" aria-label="Flow"><text x="0" y="46" font-family="system-ui,Segoe UI,sans-serif" font-weight="800" font-size="50" letter-spacing="-2" fill="#2E7D34">FLO</text><path d="M118 12 C142 12 134 46 158 46 C182 46 174 12 198 12 C222 12 214 46 238 46 C262 46 266 14 278 14" fill="none" stroke="#2E7D34" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(flow){ document.documentElement.style.setProperty('--vinho','#2E7D34'); }

  const byCat={}; itens.forEach(i=>{const c=i.categoria||'Outros';(byCat[c]=byCat[c]||[]).push(i);});
  const cats=Object.keys(byCat).sort((a,b)=>{const ia=ORD.indexOf(a),ib=ORD.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
  const nObs=itens.filter(i=>i.observacoes).length;

  const secoes=cats.map(c=>{
    const linhas=byCat[c].sort((a,b)=>a.produto_nome.localeCompare(b.produto_nome)).map(i=>
      `<tr><td class="qt">${nf(Number(i.quantidade)||0)}</td><td class="un">${esc(un(i.unidade))}</td>`+
      `<td class="prod">${esc(i.produto_nome)}${i.observacoes?`<span class="obs"> · ${esc(i.observacoes)}</span>`:''}</td></tr>`).join('');
    return `<div class="cat">${EMO[c]||'•'} ${esc(c)} <span class="cc">${byCat[c].length}</span></div>`+
      `<div class="tw"><table><thead><tr><th class="qt">Qtd</th><th>Un</th><th>Produto</th></tr></thead><tbody>${linhas}</tbody></table></div>`;
  }).join('');

  document.getElementById('app').innerHTML=
   `<header class="top"><div>`+
     (flow?`<div style="margin-bottom:6px">${LOGO_FLOW}</div>`:'')+
     `<div class="eyebrow">Painel ${MARCA} · Requisição de Compra</div>`+
     `<h1>${num}</h1>`+
     `<div class="sub">${esc(lojaLabel)} · Solicitante: <b>${esc(req.responsavel_nome||req.created_by||'—')}</b> · ${dDMY(req.created_at)}</div>`+
     `<span class="badge">${esc(STATUS[req.status]||req.status||'—')}</span>`+
   `</div><button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button></header>`+
   `<div class="kpis">`+
     `<div class="kpi"><div class="kn">${itens.length}</div><div class="kl">Itens</div></div>`+
     `<div class="kpi"><div class="kn">${cats.length}</div><div class="kl">Categorias</div></div>`+
     (req.prazo_entrega||req.data_necessidade?`<div class="kpi"><div class="kn" style="font-size:16px">${dDMY(req.prazo_entrega||req.data_necessidade)}</div><div class="kl">Necessidade</div></div>`:'')+
     (nObs?`<div class="kpi"><div class="kn" style="color:var(--warn)">${nObs}</div><div class="kl">Com observação</div></div>`:'')+
   `</div>`+
   (req.observacoes?`<div style="background:color-mix(in srgb,var(--vinho) 5%,var(--card));border:1px solid var(--border);border-left:4px solid var(--vinho);border-radius:12px;padding:12px 15px;font-size:13.5px;margin-bottom:6px">📝 ${esc(req.observacoes)}</div>`:'')+
   secoes+
   `<div class="foot">Requisição gerada no Painel ${MARCA} para cotação com os fornecedores. ${num} · ${esc(lojaLabel)} · ${new Date().toLocaleString('pt-BR')}</div>`;
  document.title=`${num} — ${lojaLabel} — Requisição`;
}
run().catch(function(e){document.getElementById('app').innerHTML='<div class="msg">Erro ao carregar: '+esc(e&&e.message||e)+'</div>';});
</script>
</body>
</html>
