<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Comparativo & Pedidos — Amore</title>
<style>
:root{--vinho:#8B1212;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;--ok:#15803D;--warn:#B45309;--shadow:0 1px 2px rgba(80,20,25,.05),0 8px 24px -12px rgba(80,20,25,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1060px;margin:0 auto;padding:26px 18px 60px}
header.top{border-bottom:2px solid var(--vinho);padding-bottom:14px;margin-bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho);font-weight:700}
h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
h2{font-size:17px;margin:26px 0 12px;color:var(--vinho)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi.eco{border-left:4px solid var(--ok)}.kpi.eco .kn{color:var(--ok)}
.kpi .kn{font-size:22px;font-weight:800}.kpi .kl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:740px}
thead th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border)}tbody tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap}.prod{font-weight:600}.un{color:var(--muted);font-size:11px}.mut{color:var(--muted)}
.win{color:var(--ok);font-weight:600}.pr b{color:var(--vinho);font-size:14px}.eco{color:var(--ok);font-weight:700}
.mc{display:block;font-size:10.5px;color:var(--muted);font-weight:400}.semq,.nocot .prod{color:var(--warn)}.semq{text-align:center;font-size:12px}
.ped{border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);background:var(--card);margin-bottom:14px;overflow:hidden}
.phd{padding:12px 16px;background:color-mix(in srgb,var(--vinho) 6%,var(--card));border-bottom:1px solid var(--border);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phd .pt{margin-left:auto;font-weight:800;color:var(--vinho);font-size:15px}.pt2 thead th{background:transparent}
.foot{margin-top:24px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
@media print{.btn{display:none}body{background:#fff}.tw,.kpi,.ped{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Carregando relatório…</div></div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const q=new URLSearchParams(location.search); const REQ=(q.get('r')||q.get('req')||'').trim();
const g=async p=>(await fetch(SB+'/rest/v1/'+p,{headers:H})).json();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const marca=o=>{try{return JSON.parse(o||'{}').marca||''}catch(e){return ''}};
const hoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

async function run(){
  if(!REQ){ document.getElementById('app').innerHTML='<div class="msg">Link inválido — falta o identificador da requisição.</div>'; return; }
  const req=(await g('requisicoes?select=numero,titulo,loja&id=eq.'+REQ))[0];
  if(!req){ document.getElementById('app').innerHTML='<div class="msg">Requisição não encontrada.</div>'; return; }
  const [itens,cots,forns]=await Promise.all([
    g('requisicao_itens?select=id,produto_nome,quantidade,unidade&requisicao_id=eq.'+REQ+'&order=produto_nome.asc'),
    g('requisicao_cotacoes?select=id,fornecedor_nome&requisicao_id=eq.'+REQ),
    g('fornecedores?select=nome,whatsapp,telefone,contato_nome&loja=eq.'+encodeURIComponent(req.loja)+'&limit=2000'),
  ]);
  const ids=cots.map(c=>c.id); const nomeCot={}; cots.forEach(c=>nomeCot[c.id]=c.fornecedor_nome);
  const ci=ids.length?await g('requisicao_cotacao_itens?select=cotacao_id,item_id,preco_unitario,disponivel,observacoes&cotacao_id=in.('+ids.join(',')+')'):[];
  const contato={}; forns.forEach(f=>{const k=(f.nome||'').toLowerCase(); if(!contato[k])contato[k]={zap:(f.whatsapp||f.telefone||'').replace(/\D/g,''),vend:f.contato_nome||''}});
  const of={}; itens.forEach(i=>of[i.id]=[]);
  ci.forEach(r=>{const pr=Number(r.preco_unitario)||0; if(r.disponivel!==false&&pr>0&&of[r.item_id])of[r.item_id].push({forn:nomeCot[r.cotacao_id],preco:pr,marca:marca(r.observacoes)});});
  const comp=itens.map(i=>{const o=of[i.id].slice().sort((a,b)=>a.preco-b.preco);const win=o[0]||null,seg=o[1]||null;
    const base=win&&seg&&seg.preco<=win.preco*3?seg.preco:0;
    const ecoPct=win&&base>0?((base-win.preco)/base)*100:0, ecoVal=win&&base>0?(base-win.preco)*i.quantidade:0;
    return {prod:i.produto_nome,qtd:i.quantidade,un:i.unidade,nQ:o.length,win,seg,ecoPct,ecoVal};});
  const pedidos={}; comp.forEach(c=>{if(!c.win)return;const f=c.win.forn;(pedidos[f]=pedidos[f]||{itens:[],total:0,contato:contato[f.toLowerCase()]||{}});const lt=c.win.preco*c.qtd;pedidos[f].itens.push({prod:c.prod,qtd:c.qtd,un:c.un,preco:c.win.preco,marca:c.win.marca,total:lt});pedidos[f].total+=lt;});
  const semCot=comp.filter(c=>!c.win);
  const totalGeral=comp.reduce((s,c)=>s+(c.win?c.win.preco*c.qtd:0),0);
  const economia=comp.reduce((s,c)=>s+c.ecoVal,0);
  const fornsPart=new Set(comp.flatMap(c=>(c.win?[c.win.forn]:[]).concat(c.seg?[c.seg.forn]:[]))).size;
  const cotados=comp.filter(c=>c.win).length;

  const compRows=comp.map(c=>{const w=c.win;const flag=w&&c.seg&&w.preco<c.seg.preco*0.4?'<span title="muito abaixo do 2º — conferir" style="color:var(--warn)">⚠ </span>':'';
    return '<tr class="'+(w?'':'nocot')+'"><td class="prod">'+esc(c.prod)+'</td><td class="num">'+c.qtd+' <span class="un">'+esc(c.un)+'</span></td><td class="num">'+(c.nQ||'—')+'</td>'+(w?'<td class="win">'+flag+'🏆 '+esc(w.forn)+(w.marca?'<span class="mc">'+esc(w.marca)+'</span>':'')+'</td><td class="num pr"><b>'+brl(w.preco)+'</b></td><td class="num">'+brl(w.preco*c.qtd)+'</td><td class="num eco">'+(c.ecoPct>0?'-'+c.ecoPct.toFixed(0)+'%':'—')+'</td><td class="num mut">'+(c.seg?brl(c.seg.preco):'—')+'</td>':'<td colspan="5" class="semq">Sem cotação válida</td>')+'</tr>';}).join('');
  const peds=Object.entries(pedidos).sort((a,b)=>b[1].total-a[1].total).map(function(e){const f=e[0],p=e[1];
    const rows=p.itens.map(i=>'<tr><td>'+esc(i.prod)+(i.marca?'<span class="mc">'+esc(i.marca)+'</span>':'')+'</td><td class="num">'+i.qtd+' '+esc(i.un)+'</td><td class="num">'+brl(i.preco)+'</td><td class="num">'+brl(i.total)+'</td></tr>').join('');
    return '<div class="ped"><div class="phd"><b>'+esc(f)+'</b>'+(p.contato.vend?' · '+esc(p.contato.vend):'')+(p.contato.zap?' · 📲 '+esc(p.contato.zap):'')+'<span class="pt">'+brl(p.total)+'</span></div><table class="pt2"><thead><tr><th>Produto</th><th class="num">Qtd</th><th class="num">Unit.</th><th class="num">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div>';}).join('');

  document.getElementById('app').innerHTML=
   '<header class="top"><div><div class="eyebrow">Compras Amore · Comparativo & Pedidos</div><h1>Melhor preço por item — '+esc(req.loja)+'</h1><div class="sub">REQ-'+String(req.numero||'').padStart(4,'0')+' '+esc(req.titulo||'')+' · '+fornsPart+' fornecedores · '+cotados+'/'+itens.length+' itens com vencedor · '+hoje+'</div></div><button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button></header>'
   +'<div class="kpis"><div class="kpi"><div class="kn">'+fornsPart+'</div><div class="kl">Fornecedores participantes</div></div><div class="kpi"><div class="kn">'+cotados+'/'+itens.length+'</div><div class="kl">Itens com vencedor</div></div><div class="kpi"><div class="kn">'+brl(totalGeral)+'</div><div class="kl">Total (menores preços)</div></div><div class="kpi eco"><div class="kn">'+brl(economia)+'</div><div class="kl">Economia vs 2º melhor preço</div></div></div>'
   +'<h2>🏆 Comparativo — vencedor por item</h2><div class="tw"><table><thead><tr><th>Produto</th><th class="num">Qtd</th><th class="num">Cot.</th><th>Vencedor (menor preço)</th><th class="num">Unit.</th><th class="num">Total</th><th class="num">Economia</th><th class="num">2º menor</th></tr></thead><tbody>'+compRows+'</tbody></table></div>'
   +'<h2>🧾 Pedidos por fornecedor (prontos para enviar)</h2>'+(peds||'<p class="mut">Nenhum item com vencedor ainda.</p>')
   +(semCot.length?'<h2>⚠ Itens sem cotação ('+semCot.length+')</h2><div class="tw"><table><tbody>'+semCot.map(c=>'<tr><td class="prod">'+esc(c.prod)+'</td><td class="num">'+c.qtd+' '+esc(c.un)+'</td></tr>').join('')+'</tbody></table></div>':'')
   +'<div class="foot">Vencedor = menor preço unitário válido. "Economia" = redução vs o 2º melhor preço (preços mais de 3× acima do menor são ignorados como possível erro). "⚠" = preço muito abaixo do 2º menor. <b>Confira os preços com os fornecedores antes de fechar o pedido.</b> Painel Amore · '+hoje+'</div>';
}
run().catch(function(e){document.getElementById('app').innerHTML='<div class="msg">Erro ao carregar o relatório. Tente novamente.</div>';});
</script>
</body>
</html>
