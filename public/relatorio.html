<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Gestão de Compras — Cotação × Pedidos — Amore</title>
<style>
:root{--vinho:#8B1212;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--shadow:0 1px 2px rgba(80,20,25,.05),0 8px 24px -12px rgba(80,20,25,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:26px 18px 60px}
header.top{border-bottom:2px solid var(--vinho);padding-bottom:14px;margin-bottom:8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho);font-weight:700}
h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
h2{font-size:17px;margin:28px 0 10px;color:var(--vinho)}h2 .h2s{font-size:12.5px;font-weight:500;color:var(--muted)}
.metabar{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 4px;font-size:12.5px;color:var(--muted)}.metabar b{color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi.eco{border-left:4px solid var(--ok)}.kpi.eco .kn{color:var(--ok)}
.kpi.bad{border-left:4px solid var(--bad)}.kpi.bad .kn{color:var(--bad)}
.kpi.hl{border-left:4px solid var(--vinho)}
.kpi .kn{font-size:22px;font-weight:800}.kpi .ks{font-size:12px;font-weight:600;color:var(--muted)}.kpi .kl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
thead th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border)}tbody tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap}.prod{font-weight:600}.un{color:var(--muted);font-size:11px}.mut{color:var(--muted)}
.win{color:var(--ok);font-weight:600}.pr b{color:var(--vinho);font-size:14px}.eco{color:var(--ok);font-weight:700}
.mc{display:block;font-size:10.5px;color:var(--muted);font-weight:400}.semq,.nocot .prod{color:var(--warn)}.semq{text-align:center;font-size:12px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.b-ok{background:#DCFCE7;color:#15803D}.b-no{background:#FEE2E2;color:#B91C1C}.b-warn{background:#FEF3C7;color:#B45309}
@media(prefers-color-scheme:dark){.b-ok{background:#0f2e1b;color:#4ade80}.b-no{background:#3a1414;color:#f87171}.b-warn{background:#33270a;color:#fbbf24}}
.medal{font-size:14px}
.cross-ok{color:var(--ok);font-weight:700}.cross-bad{color:var(--bad);font-weight:700}
.ped{border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);background:var(--card);margin-bottom:14px;overflow:hidden}
.phd{padding:12px 16px;background:color-mix(in srgb,var(--vinho) 6%,var(--card));border-bottom:1px solid var(--border);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phd .pt{margin-left:auto;font-weight:800;color:var(--vinho);font-size:15px}.pt2 thead th{background:transparent}
details.mtx{margin-top:8px;border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
details.mtx>summary{cursor:pointer;padding:13px 16px;font-weight:700;color:var(--vinho);list-style:none}
details.mtx>summary::-webkit-details-marker{display:none}
details.mtx>summary::before{content:"▸ ";font-size:12px}details.mtx[open]>summary::before{content:"▾ "}
.mx{padding:0 16px 12px}.mxitem{border-top:1px solid var(--border);padding:9px 0}.mxitem:first-child{border-top:none}
.mxitem .nm{font-weight:700;font-size:13.5px;margin-bottom:3px}.mxitem .nm .un{font-weight:400}
.mxof{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:2px 0;color:var(--muted)}
.mxof.w{color:var(--ok);font-weight:700}.mxof .df{font-size:11px}
.note{background:color-mix(in srgb,var(--vinho) 5%,var(--card));border:1px solid var(--border);border-left:3px solid var(--vinho);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--muted);margin:10px 0}
textarea.obs{width:100%;min-width:150px;min-height:36px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:11.5px;padding:6px 8px;resize:vertical;transition:border-color .2s}
textarea.obs:focus{outline:none;border-color:var(--vinho)}
.foot{margin-top:26px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
/* Mobile: cada linha vira um cartão empilhado — nada fica cortado */
@media(max-width:680px){
  .wrap{padding:18px 12px 50px}h1{font-size:19px}
  .tw{overflow:visible;border:none;box-shadow:none;background:transparent;border-radius:0}
  table{min-width:0;font-size:13.5px}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  tbody tr{display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:4px 14px;margin-bottom:12px}
  tbody td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px dashed var(--border);text-align:right;white-space:normal}
  tbody tr td:last-child{border-bottom:none}
  tbody td::before{content:attr(data-label);color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;text-align:left;flex:0 0 auto}
  tbody td:not([data-label])::before{content:""}
  td.prod{display:block;text-align:left;font-size:15.5px;font-weight:800;border-bottom:2px solid var(--vinho);padding:8px 0 7px}
  td.prod::before{display:none}
  td.semq{display:block;text-align:center}.num{white-space:normal}.win{align-items:baseline}
  .phd{font-size:13.5px}.phd .pt{font-size:15px}
  td[data-label="Observação"]{flex-direction:column;align-items:stretch;gap:4px}
  td[data-label="Observação"]::before{text-align:left}
  td[data-label="Situação"]{align-items:flex-start}
}
@media print{.btn{display:none}body{background:#fff}.tw,.kpi,.ped,details.mtx{box-shadow:none}details.mtx{border:1px solid #ddd}details.mtx[open] .mx{display:block}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Carregando relatório…</div></div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const q=new URLSearchParams(location.search); const REQ=(q.get('r')||q.get('req')||'').trim();
const g=async p=>(await fetch(SB+'/rest/v1/'+p,{headers:H})).json();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>(v>=0?'':'')+v.toFixed(0)+'%';
const parse=o=>{try{return JSON.parse(o||'{}')}catch(e){return {}}};
const marca=o=>parse(o).marca||'';
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const canon=l=>({'Amore Costa Dourada':'Amore CD','Flow Paiva':'Flow CD'})[l]||l;
const fmtDMY=s=>{if(!s)return '—';const d=new Date(String(s).length>10?s:s+'T12:00:00');return isNaN(d)?'—':d.toLocaleDateString('pt-BR');};
const hoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

async function run(){
  if(!REQ){ document.getElementById('app').innerHTML='<div class="msg">Link inválido — falta o identificador da requisição.</div>'; return; }
  const req=(await g('requisicoes?select=*&id=eq.'+REQ))[0];
  if(!req){ document.getElementById('app').innerHTML='<div class="msg">Requisição não encontrada.</div>'; return; }
  const [itens,cots,forns,pedRows]=await Promise.all([
    g('requisicao_itens?select=id,produto_nome,quantidade,unidade&requisicao_id=eq.'+REQ+'&order=produto_nome.asc'),
    g('requisicao_cotacoes?select=id,fornecedor_nome,status,total,prazo_entrega,observacoes,created_at&requisicao_id=eq.'+REQ),
    g('fornecedores?select=nome,whatsapp,telefone,contato_nome&limit=3000'),
    g('app_config?chave=like.pedido_*&select=chave,valor'),
  ]);
  const ids=cots.map(c=>c.id); const nomeCot={}; cots.forEach(c=>nomeCot[c.id]=c.fornecedor_nome);
  const ci=ids.length?await g('requisicao_cotacao_itens?select=cotacao_id,item_id,preco_unitario,disponivel,observacoes&cotacao_id=in.('+ids.join(',')+')'):[];
  const contato={}; forns.forEach(f=>{const k=(f.nome||'').toLowerCase(); if(!contato[k])contato[k]={zap:(f.whatsapp||f.telefone||'').replace(/\D/g,''),vend:f.contato_nome||''}});

  // preços por item
  const of={}; itens.forEach(i=>of[i.id]=[]);
  const precosPorCot={};
  ci.forEach(r=>{const pr=Number(r.preco_unitario)||0; (precosPorCot[r.cotacao_id]=precosPorCot[r.cotacao_id]||[]).push(pr);
    if(r.disponivel!==false&&pr>0&&of[r.item_id])of[r.item_id].push({forn:nomeCot[r.cotacao_id],preco:pr,marca:marca(r.observacoes)});});
  const respondeu=c=>(precosPorCot[c.id]||[]).some(p=>p>0);

  // comparativo por item
  const comp=itens.map(i=>{const o=of[i.id].slice().sort((a,b)=>a.preco-b.preco);const win=o[0]||null,seg=o[1]||null;
    const base=win&&seg&&seg.preco<=win.preco*3?seg.preco:0;
    const ecoPct=win&&base>0?((base-win.preco)/base)*100:0, ecoVal=win&&base>0?(base-win.preco)*i.quantidade:0;
    return {id:i.id,prod:i.produto_nome,qtd:i.quantidade,un:i.unidade,nQ:o.length,win,seg,ofs:o,ecoPct,ecoVal};});

  const totalGeral=comp.reduce((s,c)=>s+(c.win?c.win.preco*c.qtd:0),0);
  const economia=comp.reduce((s,c)=>s+c.ecoVal,0);
  const cotados=comp.filter(c=>c.win).length;
  const semCot=comp.filter(c=>!c.win);
  const enviados=cots.length, responderam=cots.filter(respondeu).length;
  const naoResp=cots.filter(c=>!respondeu(c)).map(c=>c.fornecedor_nome);

  // ranking de fornecedores
  const SF={}; cots.forEach(c=>{ if(!SF[c.fornecedor_nome])SF[c.fornecedor_nome]={nome:c.fornecedor_nome,respondeu:respondeu(c),itens:0,vit:0,seg:0,valor:0,cond:parse(c.observacoes)}; });
  Object.values(of).forEach(arr=>arr.forEach(o=>{ if(SF[o.forn])SF[o.forn].itens++; }));
  comp.forEach(c=>{ if(c.win&&SF[c.win.forn]){SF[c.win.forn].vit++;SF[c.win.forn].valor+=c.win.preco*c.qtd;} if(c.seg&&SF[c.seg.forn])SF[c.seg.forn].seg++; });
  const rank=Object.values(SF).sort((a,b)=>b.vit-a.vit||b.valor-a.valor||b.itens-a.itens);
  const campeao=rank.find(r=>r.vit>0);

  // ---- cruzamento cotação x pedidos (item a item, por pedido) ----
  const toks=s=>norm(s).split(' ').filter(t=>t.length>2);
  // classe de unidade — evita comparar preço por kg com preço por unidade/embalagem
  const uclass=u=>{const n=norm(u); if(/\bkg\b/.test(n)||/^(quilo|quilos|quilograma|quilogramas|kilo|kilos)$/.test(n))return 'kg'; if(/^(g|grama|gramas)$/.test(n))return 'g'; if(/^(l|litro|litros|lt)$/.test(n))return 'l'; if(/\bml\b/.test(n))return 'ml'; return 'un';};
  // índice da cotação (itens com vencedor) — casa pelo item MAIS ESPECÍFICO cujos termos estão contidos no item comprado
  const cotIdx=comp.filter(c=>c.win).map(c=>({toks:toks(c.prod),prod:c.prod,un:c.un,preco:c.win.preco,forn:c.win.forn}));
  const matchCot=nm=>{const set=new Set(toks(nm)); if(!set.size)return null; let best=null,bn=0;
    for(const c of cotIdx){ if(!c.toks.length)continue; if(c.toks.every(t=>set.has(t))){ if(c.toks.length>bn){bn=c.toks.length;best=c;} } } return best;};

  const pedidos=(pedRows||[]).map(r=>({chave:r.chave,...(r.valor||{})})).filter(p=>canon(p.loja)===canon(req.loja));

  // observações persistidas (por que não comprou do mais barato)
  const obsRow=await g('app_config?chave=eq.cross_obs_'+REQ+'&select=valor');
  window.OBS=(obsRow&&obsRow[0]&&obsRow[0].valor)||{};
  window.saveObs=async function(k,v,el){ window.OBS[k]=v; el.style.borderColor='#B45309';
    try{ const r=await fetch(SB+'/rest/v1/app_config?on_conflict=chave',{method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},H),body:JSON.stringify({chave:'cross_obs_'+REQ,valor:window.OBS})}); el.style.borderColor=r.ok?'#15803D':'#B91C1C'; }catch(e){ el.style.borderColor='#B91C1C'; } };
  const OBS=window.OBS;

  let cPago=0,cMelhor=0,cMatch=0,cAcima=0,cConf=0,cNaoCot=0;
  const pedCards=pedidos.map(function(p){
    const slug=p.chave.replace(/^pedido_/,'');
    const rows=(p.itens||[]).map(function(it){
      const pago=Number(it.preco)||0, qtd=Number(it.qtd)||0; const b=matchCot(it.produto||'');
      let cotHtml='<span class="mut">—</span>', sit, showObs=true;
      if(!b){ cNaoCot++; sit='<span class="mut">— fora desta cotação</span>'; }
      else {
        const sameForn=norm(p.fornecedor||'')===norm(b.forn);
        const compat=uclass(it.un)===uclass(b.un);
        const difU=pago-b.preco, difP=b.preco>0?difU/b.preco*100:0;
        cotHtml=brl(b.preco)+' <span class="un">'+esc(b.un)+'</span><span class="mc">🏆 '+esc(b.forn)+'</span>';
        const outlier=compat&&(difP>120||difP<-55); // diferença extrema = provável embalagem/quantidade diferente
        if(!compat||outlier){ cConf++; sit='<span class="badge b-warn">⚠ conferir</span><span class="mc">'+(!compat?('comprado por '+esc(it.un||'?')+', cotado por '+esc(b.un||'?')):('diferença de '+(difP>0?'+':'')+difP.toFixed(0)+'% — provável embalagem/quantidade diferente'))+'</span>'; }
        else { cPago+=pago*qtd; cMelhor+=b.preco*qtd; cMatch++;
          if(difU>0.005){ cAcima++; sit='<span class="badge b-warn">▲ pagou +'+difP.toFixed(0)+'%</span>'+(!sameForn?'<span class="mc">vencedor: '+esc(b.forn)+' a '+brl(b.preco)+'</span>':''); }
          else if(difU<-0.005){ sit='<span class="badge b-ok">✔ '+(sameForn?'abaixo do cotado':'comprou bem')+' ('+difP.toFixed(0)+'%)</span>'; showObs=false; }
          else { sit='<span class="badge b-ok">✔ '+(sameForn?'comprou do vencedor':'igual ao cotado')+'</span>'; showObs=false; }
        }
      }
      const key=slug+'|'+norm(it.produto||'');
      const obsVal=esc(OBS[key]||'');
      const obsCell=showObs
        ? '<textarea class="obs" data-k="'+esc(key)+'" onblur="saveObs(this.dataset.k,this.value,this)" placeholder="Por quê? (qualidade, prazo, pedido mínimo, frete, disponibilidade…)">'+obsVal+'</textarea>'
        : (obsVal?'<span class="mc">📝 '+obsVal+'</span>':'<span class="mut" style="font-size:11px">—</span>');
      return '<tr><td class="prod">'+esc(it.produto||'')+'</td>'
        +'<td class="num pr" data-label="Comprado"><b>'+brl(pago)+'</b> <span class="un">'+esc(it.un||'')+'</span></td>'
        +'<td class="num" data-label="Melhor cotado">'+cotHtml+'</td>'
        +'<td data-label="Situação">'+sit+'</td>'
        +'<td data-label="Observação">'+obsCell+'</td></tr>';
    }).join('');
    return '<div class="ped"><div class="phd"><b>'+esc(p.fornecedor||'Fornecedor')+'</b>'+(p.data?' · '+fmtDMY(p.data):'')+(p.recebimento_responsavel?' · recebe '+esc(p.recebimento_responsavel):'')+'<span class="pt">'+brl(p.total||0)+'</span></div>'
      +'<table class="pt2"><thead><tr><th>Item comprado</th><th class="num">Comprado</th><th class="num">Melhor cotado</th><th>Situação</th><th>Observação</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }).join('');
  const cDif=cPago-cMelhor; // >0 pagou acima do melhor cotado; <0 igual/abaixo

  // ---- render ----
  const meta='<div class="metabar"><span>📅 Cotação criada: <b>'+fmtDMY(req.created_at)+'</b></span>'
    +'<span>🎯 Necessidade/chegada: <b>'+fmtDMY(req.data_necessidade||req.prazo_entrega)+'</b></span>'
    +'<span>🏬 Loja: <b>'+esc(req.loja)+'</b></span>'+(req.setor?'<span>Setor: <b>'+esc(req.setor)+'</b></span>':'')+'</div>';

  const kpiPart='<div class="kpis">'
    +'<div class="kpi hl"><div class="kn">'+responderam+'<span class="ks"> / '+enviados+'</span></div><div class="kl">Fornecedores responderam</div></div>'
    +'<div class="kpi"><div class="kn">'+(enviados?Math.round(responderam/enviados*100):0)+'%</div><div class="kl">Taxa de resposta</div></div>'
    +'<div class="kpi"><div class="kn">'+cotados+'<span class="ks"> / '+itens.length+'</span></div><div class="kl">Itens com vencedor</div></div>'
    +'<div class="kpi"><div class="kn">'+brl(totalGeral)+'</div><div class="kl">Total pelos menores preços</div></div>'
    +'<div class="kpi eco"><div class="kn">'+brl(economia)+'</div><div class="kl">Economia vs 2º melhor</div></div>'
    +(campeao?'<div class="kpi hl"><div class="kn" style="font-size:16px">🥇 '+esc(campeao.nome)+'</div><div class="kl">'+campeao.vit+' itens vencidos · '+(cotados?Math.round(campeao.vit/cotados*100):0)+'%</div></div>':'')
    +'</div>'
    +(naoResp.length?'<div class="note">📮 <b>'+naoResp.length+' fornecedor(es) na cotação não retornaram preços:</b> '+esc(naoResp.slice(0,20).join(', '))+(naoResp.length>20?'…':'')+'</div>':'');

  const rankRows=rank.map(function(r){const p=cotados?r.vit/cotados*100:0;const c=r.cond||{};const cond=[c.condicao_pagamento,c.validade_proposta?('validade '+c.validade_proposta):'',(c.frete?'frete '+brl(c.frete):'')].filter(Boolean).join(' · ');
    return '<tr><td class="prod">'+(r===campeao&&r.vit>0?'<span class="medal">🥇</span> ':'')+esc(r.nome)+(cond?'<span class="mc">'+esc(cond)+'</span>':'')+'</td>'
      +'<td data-label="Respondeu">'+(r.respondeu?'<span class="badge b-ok">Respondeu</span>':'<span class="badge b-no">Não respondeu</span>')+'</td>'
      +'<td class="num" data-label="Itens cotados">'+r.itens+'</td>'
      +'<td class="num" data-label="Vitórias"><b>'+r.vit+'</b></td>'
      +'<td class="num eco" data-label="% do total">'+(r.vit?p.toFixed(0)+'%':'—')+'</td>'
      +'<td class="num" data-label="2º lugar">'+r.seg+'</td>'
      +'<td class="num pr" data-label="Valor vencido"><b>'+brl(r.valor)+'</b></td></tr>';}).join('');
  const rankTable='<h2>🏆 Ranking de fornecedores <span class="h2s">— quem cotou, quem respondeu e quem ganhou mais itens</span></h2>'
    +'<div class="tw"><table><thead><tr><th>Fornecedor</th><th>Status</th><th class="num">Itens cotados</th><th class="num">Vitórias</th><th class="num">% do total</th><th class="num">2º lugar</th><th class="num">Valor vencido</th></tr></thead><tbody>'+rankRows+'</tbody></table></div>';

  const compRows=comp.map(c=>{const w=c.win;const flag=w&&c.seg&&w.preco<c.seg.preco*0.4?'<span title="muito abaixo do 2º — conferir" style="color:var(--warn)">⚠ </span>':'';
    return '<tr class="'+(w?'':'nocot')+'"><td class="prod">'+esc(c.prod)+'</td><td class="num" data-label="Qtd">'+c.qtd+' <span class="un">'+esc(c.un)+'</span></td><td class="num" data-label="Cotações">'+(c.nQ||'—')+'</td>'+(w?'<td class="win" data-label="Vencedor">'+flag+'🏆 '+esc(w.forn)+(w.marca?'<span class="mc">'+esc(w.marca)+'</span>':'')+'</td><td class="num pr" data-label="Preço unit."><b>'+brl(w.preco)+'</b></td><td class="num" data-label="Total">'+brl(w.preco*c.qtd)+'</td><td class="num eco" data-label="Economia">'+(c.ecoPct>0?'-'+c.ecoPct.toFixed(0)+'%':'—')+'</td><td class="num mut" data-label="2º menor">'+(c.seg?brl(c.seg.preco):'—')+'</td>':'<td colspan="5" class="semq">Sem cotação válida</td>')+'</tr>';}).join('');
  const compTable='<h2>📊 Comparativo — vencedor por item</h2><div class="tw"><table><thead><tr><th>Produto</th><th class="num">Qtd</th><th class="num">Cot.</th><th>Vencedor (menor preço)</th><th class="num">Unit.</th><th class="num">Total</th><th class="num">Economia</th><th class="num">2º menor</th></tr></thead><tbody>'+compRows+'</tbody></table></div>';

  // matriz de preços entre fornecedores
  const mtxBody=comp.filter(c=>c.ofs.length>1).map(function(c){const w=c.ofs[0];
    const rows=c.ofs.map((o,ix)=>{const df=ix===0?'menor':('+'+((o.preco-w.preco)/w.preco*100).toFixed(0)+'%');
      return '<div class="mxof'+(ix===0?' w':'')+'"><span>'+(ix===0?'🏆 ':'')+esc(o.forn)+(o.marca?' · '+esc(o.marca):'')+'</span><span>'+brl(o.preco)+' <span class="df mut">'+df+'</span></span></div>';}).join('');
    return '<div class="mxitem"><div class="nm">'+esc(c.prod)+' <span class="un">('+c.ofs.length+' cotações)</span></div>'+rows+'</div>';}).join('');
  const mtx=mtxBody?'<details class="mtx"><summary>🔍 Comparação de preços entre fornecedores — todos os preços por item ('+comp.filter(c=>c.ofs.length>1).length+' itens com ≥2 cotações)</summary><div class="mx">'+mtxBody+'</div></details>':'';

  // render do cruzamento cotação × pedidos
  let crossSec='';
  if(pedidos.length){
    const margem=cMelhor>0?(cDif/cMelhor*100):0;
    crossSec='<h2>🔁 Cotação × Pedidos de compra — item a item <span class="h2s">— compramos bem? (loja '+esc(req.loja)+' · '+pedidos.length+' pedidos)</span></h2>'
     +'<div class="kpis">'
     +'<div class="kpi"><div class="kn">'+pedidos.length+'</div><div class="kl">Pedidos de compra</div></div>'
     +'<div class="kpi"><div class="kn">'+cMatch+'</div><div class="kl">Itens comparáveis</div></div>'
     +'<div class="kpi"><div class="kn">'+brl(cPago)+'</div><div class="kl">Pago (itens comparáveis)</div></div>'
     +'<div class="kpi"><div class="kn">'+brl(cMelhor)+'</div><div class="kl">Se comprasse pelo melhor cotado</div></div>'
     +(cDif>0.5?'<div class="kpi bad"><div class="kn">+'+brl(cDif)+'</div><div class="kl">Pago acima do cotado</div></div>'
        :'<div class="kpi eco"><div class="kn">'+brl(Math.abs(cDif))+'</div><div class="kl">Economia vs cotado</div></div>')
     +'<div class="kpi'+(cAcima?' bad':' eco')+'"><div class="kn">'+cAcima+'<span class="ks"> / '+cMatch+'</span></div><div class="kl">Itens acima do cotado</div></div>'
     +'</div>'
     +(cMatch?'<div class="note">📉 Margem da compra: <b>'+(cDif<=0?'+':'−')+Math.abs(margem).toFixed(1)+'%</b> '+(cDif<=0?'— nos itens comparáveis pagamos igual ou abaixo do melhor preço cotado (compra bem feita).':'— nos itens comparáveis pagamos acima do melhor cotado; use a coluna <b>Observação</b> para justificar (qualidade, prazo, pedido mínimo…) ou renegociar.')+(cConf?' · '+cConf+' item(ns) marcados “conferir embalagem”.':'')+(cNaoCot?' · '+cNaoCot+' item(ns) fora desta cotação.':'')+'</div>':'<div class="note">Os pedidos desta loja não têm itens que casem com a cotação. Verifique os nomes dos produtos.</div>')
     +'<div class="note" style="border-left-color:var(--muted)">💬 A coluna <b>Observação</b> é editável e fica salva: escreva por que comprou de outro fornecedor / mais caro (ex.: qualidade, prazo de entrega, pedido mínimo, frete). Salva sozinho ao sair do campo.</div>'
     +pedCards;
  } else {
    crossSec='<h2>🔁 Cotação × Pedidos de compra</h2><div class="note">Ainda não há pedidos de compra registrados para <b>'+esc(req.loja)+'</b>. Assim que os pedidos forem gerados nesta loja, este bloco cruza cada item comprado com o melhor preço cotado.</div>';
  }

  const peds=Object.entries((function(){const P={};comp.forEach(c=>{if(!c.win)return;const f=c.win.forn;(P[f]=P[f]||{itens:[],total:0,contato:contato[f.toLowerCase()]||{}});const lt=c.win.preco*c.qtd;P[f].itens.push({prod:c.prod,qtd:c.qtd,un:c.un,preco:c.win.preco,marca:c.win.marca,total:lt});P[f].total+=lt;});return P;})()).sort((a,b)=>b[1].total-a[1].total).map(function(e){const f=e[0],p=e[1];
    const rows=p.itens.map(i=>'<tr><td class="prod">'+esc(i.prod)+(i.marca?'<span class="mc">'+esc(i.marca)+'</span>':'')+'</td><td class="num" data-label="Qtd">'+i.qtd+' '+esc(i.un)+'</td><td class="num" data-label="Unit.">'+brl(i.preco)+'</td><td class="num" data-label="Total">'+brl(i.total)+'</td></tr>').join('');
    return '<div class="ped"><div class="phd"><b>'+esc(f)+'</b>'+(p.contato.vend?' · '+esc(p.contato.vend):'')+(p.contato.zap?' · 📲 '+esc(p.contato.zap):'')+'<span class="pt">'+brl(p.total)+'</span></div><table class="pt2"><thead><tr><th>Produto</th><th class="num">Qtd</th><th class="num">Unit.</th><th class="num">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div>';}).join('');

  document.getElementById('app').innerHTML=
   '<header class="top"><div><div class="eyebrow">Compras Amore · Gestão de Compras</div><h1>Cotação × Pedidos — '+esc(req.loja)+'</h1><div class="sub">REQ-'+String(req.numero||'').padStart(4,'0')+' '+esc(req.titulo||'')+' · '+hoje+'</div></div><button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button></header>'
   +meta
   +'<h2>📈 Participação & resultado da cotação</h2>'+kpiPart
   +rankTable
   +compTable
   +mtx
   +crossSec
   +'<h2>🧾 Pedidos por fornecedor (prontos para enviar)</h2>'+(peds||'<p class="mut">Nenhum item com vencedor ainda.</p>')
   +(semCot.length?'<h2>⚠ Itens sem cotação ('+semCot.length+')</h2><div class="tw"><table><tbody>'+semCot.map(c=>'<tr><td class="prod">'+esc(c.prod)+'</td><td class="num" data-label="Qtd">'+c.qtd+' '+esc(c.un)+'</td></tr>').join('')+'</tbody></table></div>':'')
   +'<div class="foot"><b>Metodologia:</b> "Responderam" = fornecedores com pelo menos 1 preço lançado. "Vitórias" = itens em que o fornecedor teve o menor preço. "Economia vs 2º" = redução do vencedor frente ao 2º melhor preço (preços 3× acima do menor são ignorados como possível erro). "Cotação × Pedidos" compara, item a item de cada pedido, o preço pago com o melhor preço cotado do mesmo produto (casado pelo nome mais específico da cotação). Itens com embalagem/unidade diferente entram como "conferir embalagem" e ficam fora do cálculo da margem, para não distorcer. A margem considera apenas itens comparáveis (mesma unidade). <b>Confira os preços com os fornecedores antes de fechar o pedido.</b> Painel Amore · '+hoje+'</div>';
}
run().catch(function(e){document.getElementById('app').innerHTML='<div class="msg">Erro ao carregar o relatório: '+esc(e&&e.message||e)+'</div>';});
</script>
</body>
</html>
