<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Ata de Reunião — Amore</title>
<style>
:root{--vinho:#8B1212;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--gold:#A9791F;--shadow:0 1px 2px rgba(80,20,25,.05),0 8px 24px -12px rgba(80,20,25,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c;--gold:#D8AE5A;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 60px}
header.top{border-bottom:2px solid var(--vinho);padding-bottom:16px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand img{height:30px;width:auto}
.brand b{font-size:22px;font-weight:800;color:var(--vinho)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho);font-weight:700}
h1{font-size:clamp(22px,4.5vw,30px);margin:6px 0 4px;line-height:1.12}
.sub{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:18px}
.meta div{background:var(--card);padding:12px 14px}
.meta dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.meta dd{margin:0;font-weight:700;font-size:14.5px}
.meta dd small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
section{margin-top:34px}
.snum{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--vinho);color:#fff;font-weight:800;font-size:15px;flex:none}
h2{display:flex;align-items:center;gap:11px;font-size:19px;margin:0 0 4px;color:var(--vinho)}
.lead{color:var(--muted);margin:2px 0 16px;padding-left:39px;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-top:14px}
.card h3{font-size:15.5px;margin:0 0 8px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-right:8px}
.card p{margin:0 0 10px;font-size:14.5px}
ul.clean{list-style:none;padding:0;margin:8px 0}
ul.clean li{position:relative;padding:6px 0 6px 22px;border-bottom:1px solid var(--border);font-size:14.5px}
ul.clean li:last-child{border-bottom:0}
ul.clean li::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--vinho)}
.brief{background:color-mix(in srgb,var(--gold) 9%,var(--card));border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:14px 16px;margin-top:12px}
.brief .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:10px 0 2px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.nota{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:8px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);background:var(--card);margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}tbody tr:last-child td{border-bottom:none}
.tnum{color:var(--vinho);font-weight:800;white-space:nowrap}
.prazo{font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.p-mkt{background:#FDE8E8;color:#B91C1C}.p-del{background:#DCFCE7;color:#15803D}
@media(prefers-color-scheme:dark){.p-mkt{background:#3a1414;color:#f87171}.p-del{background:#0f2e1b;color:#4ade80}}
.pend{background:color-mix(in srgb,var(--warn) 10%,var(--card));border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-top:14px}
.pend h3{margin:0 0 6px;color:var(--warn);font-size:15.5px}
.pend ul.clean li::before{background:var(--warn)}
.foot{margin-top:34px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:560px){.lead{padding-left:0}.tw{overflow-x:auto}}
@media print{.btn{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Carregando ata…</div></div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const q=new URLSearchParams(location.search);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich=s=>esc(s).replace(/\*(.+?)\*/g,'<strong>$1</strong>');
function render(d){
  const meta=`<dl class="meta">
    <div><dt>Data</dt><dd>${esc(d.data)}<small>${esc(d.diaSemana||'')}</small></dd></div>
    <div><dt>Horário</dt><dd>${esc(d.horario||'')}<small>${d.duracao?'duração '+esc(d.duracao):''}</small></dd></div>
    <div><dt>Formato</dt><dd>${esc(d.formato||'Call')}<small>${esc(d.formatoSub||'reunião remota')}</small></dd></div>
    <div><dt>Participantes</dt><dd>${(d.participantes||[]).map((p,i)=>i===0?esc(p):`<small>${esc(p)}</small>`).join('')}</dd></div>
  </dl>`;
  const secoes=(d.secoes||[]).map(s=>{
    const cards=(s.cards||[]).map(c=>{
      const paras=(c.paras||[]).map(p=>`<p>${rich(p)}</p>`).join('');
      const itens=c.itens&&c.itens.length?`<ul class="clean">${c.itens.map(i=>`<li>${rich(i)}</li>`).join('')}</ul>`:'';
      const brief=c.brief?`<div class="brief"><span class="lbl">Briefing para a agência</span><dl class="kv">${(c.brief.linhas||[]).map(l=>`<dt>${esc(l[0])}</dt><dd>${rich(l[1])}</dd>`).join('')}</dl>${c.brief.nota?`<p class="nota">${esc(c.brief.nota)}</p>`:''}</div>`:'';
      return `<div class="card"><h3>${c.tag?`<span class="tag">${esc(c.tag)}</span>`:''}${esc(c.titulo)}</h3>${paras}${itens}${brief}</div>`;
    }).join('');
    return `<section><h2><span class="snum">${s.n}</span><span>${esc(s.titulo)}</span></h2>${s.lead?`<p class="lead">${rich(s.lead)}</p>`:''}${cards}</section>`;
  }).join('');
  const tarefas=(d.tarefas||[]).length?`<section><h2><span class="snum">${(d.secoes||[]).length+1}</span><span>Encaminhamentos &amp; tarefas</span></h2>
    <p class="lead">Registradas na Central de Tarefas do painel — loja ${esc(d.loja)}.</p>
    <div class="tw"><table><thead><tr><th>Nº</th><th>Frente</th><th>Tarefa</th><th>Resp.</th><th>Prazo</th></tr></thead><tbody>
    ${d.tarefas.map(t=>`<tr><td class="tnum">${esc(t.num)}</td><td><span class="pill ${t.frente==='Delivery'?'p-del':'p-mkt'}">${esc(t.frente)}</span></td><td>${rich(t.texto)}</td><td>${esc(t.resp||'Esdras')}</td><td class="prazo">${esc(t.prazo)}</td></tr>`).join('')}
    </tbody></table></div>
    ${(d.pendencias||[]).length?`<div class="pend"><h3>Pendências para validação do Wagner</h3><ul class="clean">${d.pendencias.map(p=>`<li>${rich(p)}</li>`).join('')}</ul></div>`:''}
  </section>`:'';
  return `<header class="top"><div class="brand"><img src="/logo-amore-red.png" alt="Amore" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'amore'}))"></div>
    <div class="headrow"><div><div class="eyebrow">Amore · Ata de Reunião</div><h1>${esc(d.titulo)}</h1>${d.subtitulo?`<div class="sub">${esc(d.subtitulo)}</div>`:''}</div><button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button></div>
    ${meta}</header>${secoes}${tarefas}
    <div class="foot">Ata gerada pelo Painel Amore · ${esc(d.loja)} · ${esc(d.data)}. Registro interno.</div>`;
}
(async()=>{
  const a=(q.get('a')||'').trim();
  const app=document.getElementById('app');
  if(!a){app.innerHTML='<div class="msg">Ata não informada.</div>';return;}
  try{
    const row=(await (await fetch(SB+'/rest/v1/app_config?select=valor&chave=eq.'+encodeURIComponent('ata_'+a),{headers:H})).json())[0];
    if(!row||!row.valor){app.innerHTML='<div class="msg">Ata não encontrada.</div>';return;}
    document.title='Ata — '+(row.valor.loja||'Amore');
    app.innerHTML=render(row.valor);
  }catch(e){app.innerHTML='<div class="msg">Erro ao carregar a ata.</div>';}
})();
</script>
</body>
</html>
