<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Status das Requisições — Amore</title>
<style>
:root{--v:#8B1212;--v2:#B03A3A;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;
  --ok:#15803D;--okbg:#DCFCE7;--warn:#B45309;--warnbg:#FEF3C7;--bad:#B91C1C;--badbg:#FEE2E2;--info:#0369A1;--infobg:#E0F2FE;
  --purple:#7C3AED;--purplebg:#EDE9FE;--shadow:0 1px 2px rgba(80,20,25,.05),0 10px 30px -14px rgba(80,20,25,.16)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c;--v2:#D06A6A;
  --okbg:#14351f;--warnbg:#3a2c10;--badbg:#3a1616;--infobg:#0d2a3a;--purplebg:#241a3a;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:16px}
.wrap{max-width:920px;margin:0 auto}
.top{border-bottom:2px solid var(--v);padding-bottom:14px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:26px;width:auto}
.brand b{font-size:19px;font-weight:800;color:var(--v);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--v2);font-weight:800;margin-top:8px}
h1{font-size:clamp(20px,4vw,26px);margin-top:2px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
select,input{padding:9px 11px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:13.5px;background:var(--card);color:var(--text)}
input{flex:1;min-width:170px}
select:focus,input:focus{outline:none;border-color:var(--v)}
.btn{border:1px solid var(--v);background:var(--v);color:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn.g{background:var(--card);color:var(--text);border-color:var(--border)}
.count{color:var(--muted);font-size:12.5px;margin:12px 2px 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi .n{font-size:20px;font-weight:800;line-height:1.1}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:2px}
.kpi.v{border-left:3px solid var(--v)}.kpi.w{border-left:3px solid var(--warn)}.kpi.p{border-left:3px solid var(--purple)}
.kpi.o{border-left:3px solid var(--ok)}.kpi.i{border-left:3px solid var(--info)}

.rc{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.rc-h{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer}
.rc-h .num{font-weight:800;color:var(--v2);font-size:13px;white-space:nowrap}
.rc-h .ti{font-weight:700;font-size:15px}
.rc-h .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.chip.loja{background:var(--v);color:#fff}.chip.loja.flow{background:#2E7D34}
.st{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}

/* stepper do ciclo */
.steps{display:flex;align-items:center;gap:0;padding:2px 16px 14px;overflow-x:auto}
.step{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:74px;position:relative;flex:1}
.step .dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;
  background:var(--border);color:var(--muted);border:2px solid var(--border);z-index:1;font-weight:800}
.step .lb{font-size:10px;color:var(--muted);text-align:center;font-weight:600;letter-spacing:.01em}
.step::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
.step:first-child::before{display:none}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done .lb{color:var(--text)}
.step.done::before{background:var(--ok)}
.step.cur .dot{background:var(--v);border-color:var(--v);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--v) 20%,transparent)}
.step.cur .lb{color:var(--v);font-weight:800}
.step.bad .dot{background:var(--bad);border-color:var(--bad);color:#fff}
.step.bad::before{background:var(--bad)}

.tl{border-top:1px solid var(--border);padding:12px 16px 14px;background:color-mix(in srgb,var(--v) 3%,var(--card));display:none}
.tl.show{display:block}
.tl h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.ev:last-child{border-bottom:none}
.ev .ic{font-size:15px;line-height:1.3;width:22px;text-align:center;flex-shrink:0}
.ev .d{font-size:13px}
.ev .w{font-size:11.5px;color:var(--muted);margin-top:1px}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.acts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:0 16px 12px}
.toggle{font-size:12px;color:var(--v2);font-weight:700;cursor:pointer;user-select:none;display:inline-block}
.lnk{font-size:12px;color:var(--info);font-weight:700;text-decoration:none}
.lnk:hover,.toggle:hover{text-decoration:underline}
.esth{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.esth .tot{font-size:17px;font-weight:800;color:var(--v)}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:9px;padding:9px 11px;font-size:12.5px;margin-bottom:10px;font-weight:600}
.etbl{width:100%;border-collapse:collapse;font-size:12.5px}
.etbl td{padding:5px 6px;border-bottom:1px dashed var(--border)}
.etbl td.n{text-align:right;white-space:nowrap;font-weight:700}
.etbl td.pc{text-align:right;color:var(--muted);white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--v);margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="logo-amore-red.png" alt="Amore" onerror="this.style.display='none'"><b>Amore</b></div>
    <div class="eyebrow" id="eyebrow">Compras · Acompanhamento</div>
    <h1 id="titulo">Status das Requisições</h1>
    <div class="controls">
      <select id="floja">
        <option value="">🏪 Todas as lojas</option>
        <option>Amore CD</option><option>Amore Paiva</option><option>Flow CD</option>
      </select>
      <input id="busca" placeholder="Buscar por nº, solicitante ou título…">
      <button class="btn g" id="reload">↻ Atualizar</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="count" id="count">Carregando…</div>
  </div>
  <div id="lista"></div>
</div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function dt(s){ if(!s)return ''; const d=new Date(s); if(isNaN(d))return String(s).slice(0,16).replace('T',' ');
  return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
// Contexto do usuário (vem do painel): dono vê tudo; colaborador vê só as suas.
const Q=new URLSearchParams(location.search);
const MODE=Q.get('mode')||'owner';
const SOLIC=(Q.get('solic')||'').trim();
const LOJA=(Q.get('loja')||'').trim();   // quando setado, mostra SÓ as requisições dessa loja

// Etapas do ciclo e mapeamento do status → índice atingido
const STEPS=[
  {k:'enviada',   lb:'Enviada',   ic:'📤'},
  {k:'analise',   lb:'Análise',   ic:'🔎'},
  {k:'cotacao',   lb:'Cotação',   ic:'📊'},
  {k:'aprovada',  lb:'Aprovada',  ic:'✅'},
  {k:'pedido',    lb:'Pedido',    ic:'🛒'},
  {k:'concluida', lb:'Concluída', ic:'🏁'},
];
// status da tabela → índice (0..5); reprovada/cancelada = negativo
function stageOf(status){
  switch(status){
    case 'rascunho': return 0;
    case 'enviada': return 0;
    case 'em_analise': return 1;
    case 'em_cotacao': return 2;
    case 'parcialmente_aprovada':
    case 'aprovada': return 3;
    case 'compra_realizada':
    case 'em_separacao':
    case 'prestacao_pendente':
    case 'em_auditoria': return 4;
    case 'concluida': return 5;
    case 'reprovada': return -1;
    case 'cancelada': return -2;
    default: return 0;
  }
}
const PILL={
  enviada:{l:'Enviada',c:'var(--warn)',b:'var(--warnbg)'},
  em_analise:{l:'Em análise',c:'var(--warn)',b:'var(--warnbg)'},
  em_cotacao:{l:'Em cotação',c:'var(--purple)',b:'var(--purplebg)'},
  parcialmente_aprovada:{l:'Parc. aprovada',c:'var(--ok)',b:'var(--okbg)'},
  aprovada:{l:'Aprovada',c:'var(--ok)',b:'var(--okbg)'},
  compra_realizada:{l:'Pedido feito',c:'var(--info)',b:'var(--infobg)'},
  em_separacao:{l:'Em separação',c:'var(--info)',b:'var(--infobg)'},
  prestacao_pendente:{l:'Prestação pend.',c:'var(--info)',b:'var(--infobg)'},
  em_auditoria:{l:'Em auditoria',c:'var(--info)',b:'var(--infobg)'},
  concluida:{l:'Concluída',c:'var(--ok)',b:'var(--okbg)'},
  reprovada:{l:'Reprovada',c:'var(--bad)',b:'var(--badbg)'},
  cancelada:{l:'Cancelada',c:'var(--muted)',b:'var(--border)'},
  rascunho:{l:'Rascunho',c:'var(--muted)',b:'var(--border)'},
};
const EVIC={criacao:'📝',envio:'📤',edicao:'✏️',aprovacao:'✅',reprovacao:'⛔',compra:'🛒',cotacao:'📊',recebimento:'📥'};

let DADOS=[];
async function carregar(){
  el('count').textContent='Carregando…'; el('lista').innerHTML='';
  try{
    DADOS=await (await fetch(SB+'/rest/v1/requisicoes?select=id,numero,titulo,loja,responsavel_nome,created_by,status,prioridade,created_at,updated_at,aprovador_nome,aprovador_at,total_estimado&order=created_at.desc&limit=150',{headers:H})).json();
  }catch(e){ el('count').textContent='Erro ao carregar.'; return; }
  render();
}
function renderKpis(list){
  const c={total:list.length,aguard:0,cot:0,aprov:0,ped:0,concl:0,neg:0,valor:0};
  list.forEach(r=>{ const s=r.status; c.valor+=Number(r.total_estimado)||0;
    if(['rascunho','enviada','em_analise'].includes(s))c.aguard++;
    else if(s==='em_cotacao')c.cot++;
    else if(['aprovada','parcialmente_aprovada'].includes(s))c.aprov++;
    else if(['compra_realizada','em_separacao','prestacao_pendente','em_auditoria'].includes(s))c.ped++;
    else if(s==='concluida')c.concl++;
    else if(['reprovada','cancelada'].includes(s))c.neg++;
  });
  const kpi=(cls,n,l)=>'<div class="kpi '+cls+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';
  el('kpis').innerHTML=kpi('v',c.total,'Total')+kpi('w',c.aguard,'Aguardando')+kpi('p',c.cot,'Em cotação')
    +kpi('o',c.aprov,'Aprovadas')+kpi('i',c.ped,'Em pedido')+kpi('v',c.concl,'Concluídas')
    +kpi('',brl(c.valor),'Estimado');
}
function render(){
  const fl=el('floja').value, q=norm(el('busca').value);
  const list=(DADOS||[]).filter(r=>{
    if(LOJA && (r.loja||'')!==LOJA) return false;   // trava por loja (usuário vê só a sua)
    if(MODE==='user' && SOLIC){ const who=norm((r.responsavel_nome||'')+' '+(r.created_by||'')); if(!who.includes(norm(SOLIC))) return false; }
    if(fl && (r.loja||'')!==fl) return false;
    if(q){ const hay=norm((r.titulo||'')+' '+(r.responsavel_nome||r.created_by||'')+' REQ-'+String(r.numero||'')); if(!hay.includes(q)) return false; }
    return true;
  });
  renderKpis(list);
  el('count').textContent=list.length+' requisiç'+(list.length===1?'ão':'ões');
  if(!list.length){ el('lista').innerHTML='<div class="rc"><div class="empty">'+((MODE==='user'&&SOLIC)?'Você ainda não tem requisições. Use <b>Nova Requisição</b> para criar a primeira.':'Nenhuma requisição encontrada.')+'</div></div>'; return; }
  el('lista').innerHTML=list.map(cardHtml).join('');
}
function stepperHtml(status){
  const cur=stageOf(status);
  if(cur<0){ // reprovada/cancelada
    const isRep=cur===-1;
    return '<div class="steps"><div class="step done"><div class="dot">📤</div><div class="lb">Enviada</div></div>'
      +'<div class="step bad"><div class="dot">'+(isRep?'⛔':'🚫')+'</div><div class="lb">'+(isRep?'Reprovada':'Cancelada')+'</div></div></div>';
  }
  return '<div class="steps">'+STEPS.map((s,i)=>{
    const cls=i<cur?'done':(i===cur?'cur':'');
    return '<div class="step '+cls+'"><div class="dot">'+(i<cur?'✓':s.ic)+'</div><div class="lb">'+s.lb+'</div></div>';
  }).join('')+'</div>';
}
function cardHtml(r){
  const num='REQ-'+String(r.numero||0).padStart(4,'0');
  const flow=/flow/i.test(r.loja||'');
  const p=PILL[r.status]||PILL.rascunho;
  const solic=esc(r.responsavel_nome||r.created_by||'—');
  const aprov=r.aprovador_nome?('· ✅ '+esc(r.aprovador_nome)+(r.aprovador_at?' em '+dt(r.aprovador_at):'')):'';
  return '<div class="rc" data-id="'+r.id+'">'
    +'<div class="rc-h" onclick="tglTl(\''+r.id+'\')">'
      +'<div style="flex:1;min-width:0">'
        +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="num">'+num+'</span>'
          +'<span class="chip loja'+(flow?' flow':'')+'">'+esc(r.loja||'—')+'</span></div>'
        +'<div class="ti">'+esc(r.titulo||'Requisição')+'</div>'
        +'<div class="meta">👤 '+solic+' · 📅 '+dt(r.created_at)+' '+aprov+'</div>'
      +'</div>'
      +'<div class="st"><span class="pill" style="color:'+p.c+';background:'+p.b+'">'+p.l+'</span></div>'
    +'</div>'
    +stepperHtml(r.status)
    +'<div class="acts">'
      +'<a class="lnk" href="requisicao-editar.html?id='+r.id+'" target="_blank" rel="noreferrer" style="color:var(--info)">✏️ Editar / reenviar</a>'
      +'<a class="lnk" href="requisicao.html?id='+r.id+'" target="_blank" rel="noreferrer">📄 Ver requisição</a>'
      +'<span class="toggle" onclick="tglEst(\''+r.id+'\')">💰 Estimativa</span>'
      +'<span class="toggle" onclick="tglTl(\''+r.id+'\')">🕘 Histórico</span>'
    +'</div>'
    +'<div class="tl" id="est-'+r.id+'"><h4>Análise da estimativa</h4><div class="estb">Carregando…</div></div>'
    +'<div class="tl" id="tl-'+r.id+'"><h4>Linha do tempo</h4><div class="evs">Carregando…</div></div>'
  +'</div>';
}
const brl=n=>'R$ '+(Number(n)||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
async function tglTl(id){
  const box=el('tl-'+id); if(!box) return;
  const open=box.classList.toggle('show');
  if(open && !box.dataset.loaded){
    box.dataset.loaded='1';
    try{
      const evs=await (await fetch(SB+'/rest/v1/req_timeline?requisicao_id=eq.'+id+'&order=created_at.asc&select=tipo,descricao,usuario,created_at',{headers:H})).json();
      const wrap=box.querySelector('.evs');
      if(!evs||!evs.length){ wrap.innerHTML='<div class="ev"><div class="ic">•</div><div><div class="d">Sem eventos registrados ainda.</div></div></div>'; return; }
      wrap.innerHTML=evs.map(e=>'<div class="ev"><div class="ic">'+(EVIC[e.tipo]||'•')+'</div><div><div class="d">'+esc(e.descricao||e.tipo)+'</div><div class="w">'+(e.usuario?esc(e.usuario)+' · ':'')+dt(e.created_at)+'</div></div></div>').join('');
    }catch(err){ box.querySelector('.evs').innerHTML='<div class="ev"><div class="ic">⚠️</div><div class="d">Não consegui carregar o histórico.</div></div>'; }
  }
}
async function tglEst(id){
  const box=el('est-'+id); if(!box) return;
  const open=box.classList.toggle('show');
  if(open && !box.dataset.loaded){
    box.dataset.loaded='1';
    const wrap=box.querySelector('.estb');
    try{
      const its=await (await fetch(SB+'/rest/v1/requisicao_itens?requisicao_id=eq.'+id+'&select=produto_nome,quantidade,unidade,preco_referencia',{headers:H})).json();
      if(!its||!its.length){ wrap.innerHTML='<div class="ev"><div class="d">Sem itens.</div></div>'; return; }
      const rows=its.map(i=>({p:i.produto_nome,q:Number(i.quantidade)||0,un:i.unidade||'',pu:Number(i.preco_referencia)||0,st:(Number(i.quantidade)||0)*(Number(i.preco_referencia)||0)}));
      const total=rows.reduce((s,r)=>s+r.st,0);
      const semPreco=rows.filter(r=>!r.pu).length;
      rows.sort((a,b)=>b.st-a.st);
      const topPct=total>0?Math.round(rows[0].st/total*100):0;
      let avisos='';
      if(topPct>=50) avisos+='⚠️ 1 item concentra '+topPct+'% do valor: <b>'+esc(rows[0].p)+'</b> ('+rows[0].q+' '+esc(rows[0].un)+'). Confira se a quantidade está certa.<br>';
      if(semPreco>0) avisos+='⚠️ '+semPreco+' de '+rows.length+' itens estão <b>sem preço</b> — o real tende a ser maior que o estimado.';
      const linhas=rows.slice(0,10).map(r=>{ const pc=total>0?r.st/total*100:0;
        return '<tr><td>'+esc(r.p)+(r.pu?'':' <span style="color:var(--warn)">· sem preço</span>')+'<div class="bar" style="width:'+Math.max(2,pc).toFixed(0)+'%;opacity:'+(r.pu?1:.25)+'"></div></td>'
          +'<td class="pc">'+r.q+' '+esc(r.un)+'</td><td class="n">'+brl(r.st)+'</td><td class="pc">'+pc.toFixed(0)+'%</td></tr>'; }).join('');
      wrap.innerHTML='<div class="esth"><span class="tot">'+brl(total)+'</span><span style="color:var(--muted);font-size:12px">'+rows.length+' itens · '+(rows.length>10?'top 10 por valor':'todos')+'</span></div>'
        +(avisos?'<div class="warnbox">'+avisos+'</div>':'')
        +'<table class="etbl">'+linhas+'</table>';
    }catch(err){ wrap.innerHTML='<div class="ev"><div class="ic">⚠️</div><div class="d">Não consegui calcular a estimativa.</div></div>'; }
  }
}
if(MODE==='user' && SOLIC){
  el('titulo').textContent='Minhas Requisições';
  el('eyebrow').textContent='Compras · '+SOLIC;
  el('busca').placeholder='Buscar nas suas requisições…';
}
el('floja').addEventListener('change',render);
el('busca').addEventListener('input',render);
el('reload').addEventListener('click',carregar);
carregar();
</script>
</body>
</html>
