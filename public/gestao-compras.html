<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gestão de Compras — Amore</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bordo:#8B1212;--bordo2:#6B1212;--bg:#f4f5f7;--card:#fff;--border:#e5e7eb;--muted:#6b7280;--ok:#15803D;--wait:#0369A1;--flow:#2E7D34}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:#1f2937;padding:16px}
  .wrap{max-width:1040px;margin:0 auto}
  .hdr{background:linear-gradient(135deg,var(--bordo2),#8a2a2a);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hdr .ic{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:24px}
  .hdr h1{font-size:20px;font-weight:800}.hdr .sub{font-size:12.5px;opacity:.9;margin-top:2px}
  .hdr button{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;font:inherit;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .kpi .n{font-size:24px;font-weight:800}.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .lojas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .lj{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px}
  .lj .nm{font-weight:700;font-size:13px}.lj .v{font-size:15px;font-weight:800;color:var(--bordo);margin-top:3px}.lj .c{font-size:11px;color:var(--muted)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .bar select,.bar input{padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:#fff;font:inherit;font-size:13px}
  .bar input{flex:1;min-width:180px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:#fff}
  td{padding:10px 12px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .forn{font-weight:700}.sub2{font-size:11px;color:var(--muted)}
  .tot{font-weight:800;color:var(--bordo);white-space:nowrap}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill.lj-flow{background:#e6f4e6;color:var(--flow)}.pill.lj-amore{background:#fde8ea;color:var(--bordo)}
  .st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .st.ok{background:#DCFCE7;color:var(--ok)}.st.wait{background:#FFEDD5;color:#C2410C}.st.warn{background:#FEF3C7;color:#B45309}.st.enc{background:#E5E7EB;color:#374151}
  .ab{background:var(--bordo);color:#fff;border-radius:9px;padding:7px 12px;text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap}
  .msg{text-align:center;padding:50px 20px;color:var(--muted)}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin:16px 0}
  @media(max-width:640px){.hide-m{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="ic">📦</div>
    <div><h1>Gestão de Compras</h1><div class="sub">Todos os pedidos de compra — por loja, fornecedor e status</div></div>
    <button onclick="load()">↻ Atualizar</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="lojas" id="lojas"></div>
  <div class="bar">
    <select id="fLoja" onchange="render()"><option value="">Todas as lojas</option></select>
    <select id="fStatus" onchange="render()"><option value="">Todos os status</option><option value="aguardando">Aguardando</option><option value="parcial">Parcial</option><option value="concluido">Concluído</option><option value="encerrado">Encerrado</option></select>
    <input id="fBusca" placeholder="Buscar fornecedor ou item..." oninput="render()">
  </div>
  <div class="card"><div id="tabela"><div class="msg">Carregando pedidos…</div></div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:ANON,Authorization:'Bearer '+ANON};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fD=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s};
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const r3=n=>Math.round((Number(n)||0)*1000)/1000;
// entregue de um produto (soma das entregas do ciclo)
function entregueDe(p,produto){const n=nrm(produto);return (p.entregas||[]).reduce((s,e)=>s+(e.itens||[]).filter(i=>nrm(i.produto)===n).reduce((a,i)=>a+(Number(i.qtd)||0),0),0)}
// status do ciclo do pedido + valores
function cicloDe(v){
  const itens=(v.itens||[]);
  let vEnt=0,vPend=0,pendTotal=0,entTotal=0;
  itens.forEach(it=>{const ped=Number(it.qtd)||0;const ent=entregueDe(v,it.produto);const pend=Math.max(0,r3(ped-ent));const preco=Number(it.preco)||0;vEnt+=Math.min(ent,ped)*preco;vPend+=pend*preco;pendTotal+=pend;entTotal+=ent;});
  let st;
  if(v.fechamento&&v.fechamento.fechado) st=v.fechamento.tipo==='concluido'?'concluido':'encerrado';
  else if(entTotal>0&&pendTotal>0.0001) st='parcial';
  else if(entTotal>0) st='recebido';
  else st='aguardando';
  return {vEnt:r3(vEnt),vPend:r3(vPend),st};
}
const ST_META={concluido:{l:'🟢 Concluído',c:'ok'},recebido:{l:'🟢 Recebido',c:'ok'},parcial:{l:'🟡 Parcial',c:'warn'},aguardando:{l:'🟠 Aguardando',c:'wait'},encerrado:{l:'⚫ Encerrado',c:'enc'}};
let PED=[];
async function load(){
  document.getElementById('tabela').innerHTML='<div class="msg">Carregando pedidos…</div>';
  let rows=[];
  try{ rows=await (await fetch(SB+'/rest/v1/app_config?select=chave,valor&chave=like.pedido_*&limit=2000',{headers:H})).json(); }catch(e){}
  PED=(rows||[]).map(r=>{const v=r.valor||{};const itens=(v.itens||[]).filter(i=>!/^desconto$|^frete|^adicional/i.test(i.produto||''));
    const c=cicloDe(v);
    return {chave:r.chave, fornecedor:v.fornecedor||'—', loja:v.loja||'—', data:v.janela_entrega||v.data||null, em:v.em||null, numero:v.numero||'',
      n:itens.length, itensTxt:itens.map(i=>i.produto).join(' | ').toLowerCase(), total:Number(v.total)||0,
      vEnt:c.vEnt, vPend:c.vPend, st:c.st, receberde:v.recebimento_responsavel||''};
  }).sort((a,b)=>(b.em||'')<(a.em||'')?-1:1);
  const lojas=[...new Set(PED.map(p=>p.loja))].sort();
  const sel=document.getElementById('fLoja');sel.length=1;lojas.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;sel.appendChild(o);});
  render();
}
function render(){
  const fl=document.getElementById('fLoja').value, fs=document.getElementById('fStatus').value, fb=(document.getElementById('fBusca').value||'').toLowerCase();
  let list=PED.filter(p=>(!fl||p.loja===fl)&&(!fs||(fs==='concluido'?(p.st==='concluido'||p.st==='recebido'):p.st===fs))&&(!fb||p.fornecedor.toLowerCase().includes(fb)||p.itensTxt.includes(fb)));
  // KPIs
  const tot=list.reduce((s,p)=>s+p.total,0), tEnt=list.reduce((s,p)=>s+p.vEnt,0), tPend=list.reduce((s,p)=>s+p.vPend,0);
  document.getElementById('kpis').innerHTML=
    kpi(list.length,'Pedidos')+kpi(brl(tot),'Valor pedido')+kpi(brl(tEnt),'Valor entregue')+kpi(brl(tPend),'A entregar');
  // por loja (sempre sobre tudo) — pedido / entregue
  const byL={};PED.forEach(p=>{(byL[p.loja]=byL[p.loja]||{n:0,t:0,e:0}); byL[p.loja].n++; byL[p.loja].t+=p.total; byL[p.loja].e+=p.vEnt;});
  document.getElementById('lojas').innerHTML=Object.keys(byL).sort().map(l=>`<div class="lj"><div class="nm">${esc(l)}</div><div class="v">${brl(byL[l].e)}</div><div class="c">entregue · de ${brl(byL[l].t)} · ${byL[l].n} ped.</div></div>`).join('');
  if(!list.length){document.getElementById('tabela').innerHTML='<div class="msg">Nenhum pedido encontrado.</div>';document.getElementById('foot').textContent='';return;}
  const isFlow=l=>/flow/i.test(l);
  const rows=list.map(p=>{const m=ST_META[p.st]||ST_META.aguardando;return `<tr>
    <td class="hide-m">${fD(p.data)}</td>
    <td><span class="pill ${isFlow(p.loja)?'lj-flow':'lj-amore'}">${esc(p.loja)}</span></td>
    <td><div class="forn">${esc(p.fornecedor)}</div>${p.numero?`<div class="sub2">${esc(p.numero)}</div>`:''}${p.receberde?`<div class="sub2">recebe: ${esc(p.receberde)}</div>`:''}</td>
    <td class="tot">${brl(p.total)}</td>
    <td style="color:#15803D;font-weight:700;white-space:nowrap">${brl(p.vEnt)}</td>
    <td style="color:${p.vPend>0?'#B91C1C':'#9ca3af'};font-weight:700;white-space:nowrap">${brl(p.vPend)}</td>
    <td><span class="st ${m.c}">${m.l}</span></td>
    <td><a class="ab" href="/relatorio-ciclo.html?d=${(p.data||'').slice(0,10)}${p.loja?'&loja='+encodeURIComponent(p.loja):''}" target="_blank">ciclo</a></td>
  </tr>`}).join('');
  document.getElementById('tabela').innerHTML=`<table><thead><tr><th class="hide-m">Data</th><th>Loja</th><th>Fornecedor</th><th>Pedido</th><th>Entregue</th><th>A entregar</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById('foot').textContent=`${list.length} pedido(s) · pedido ${brl(tot)} · entregue ${brl(tEnt)} · a entregar ${brl(tPend)}`;
}
function kpi(n,l){return `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`;}
load();
</script>
</body>
</html>
