<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Pedido de Compra — Amore</title>
<style>
:root{--vinho:#8B1212;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;--ok:#15803D;--warn:#B45309;--shadow:0 1px 2px rgba(80,20,25,.05),0 8px 24px -12px rgba(80,20,25,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px 60px}
header.top{border-bottom:2px solid var(--vinho);padding-bottom:14px;margin-bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho);font-weight:700}
h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.meta div{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.meta .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.meta .v{font-weight:600;font-size:14px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:480px}
thead th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border)}tbody tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap}.prod{font-weight:600}.un{color:var(--muted);font-size:11px}
tfoot td{padding:12px;font-weight:800;font-size:15px;border-top:2px solid var(--border)}tfoot .tl{color:var(--vinho)}
.canc{margin-top:14px;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 10%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--border));color:var(--warn);font-size:13px;font-weight:600}
.foot{margin-top:22px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
.recbox{margin-top:18px;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.recbox b{font-size:14px}.recbox p{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
.recbox input,.recbox textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font:inherit;margin-bottom:8px;box-sizing:border-box}
.rbtns{display:flex;gap:8px;flex-wrap:wrap}.rb{border:none;border-radius:9px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer;color:#fff}
.rb.ok{background:var(--ok)}.rb.warn{background:var(--warn)}.rb.crit{background:var(--vinho)}.rb:disabled{opacity:.5;cursor:default}
.recdone{margin-top:18px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--ok) 12%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--border));color:var(--ok);font-size:14px;font-weight:600}
.recdone .robs{font-weight:400;color:var(--text);margin-top:4px;font-size:12.5px}
.recdone .nfinfo{font-weight:400;color:var(--text);margin-top:6px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 14px}
.recdone .nfinfo b{color:var(--vinho)}
.vernota{display:inline-flex;align-items:center;gap:6px;margin-top:10px;text-decoration:none;background:var(--vinho);color:#fff;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ranx{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:2px 0 10px}
.ranx input{margin-top:5px}
.rest{margin-top:8px;font-size:12.5px;font-weight:400;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:8px 11px}
@media print{.btn,.recbox{display:none}body{background:#fff}.tw{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Carregando pedido…</div></div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const q=new URLSearchParams(location.search); const P=(q.get('p')||'').trim();
const LOGO_FLOW='<svg viewBox="0 0 300 60" xmlns="http://www.w3.org/2000/svg" style="height:30px;width:auto" role="img" aria-label="Flow"><text x="0" y="48" font-family="system-ui,Segoe UI,sans-serif" font-weight="800" font-size="52" letter-spacing="-2" fill="#2E7D34">FLO</text><path d="M120 12 C144 12 136 48 160 48 C184 48 176 12 200 12 C224 12 216 48 240 48 C264 48 268 14 280 14" fill="none" stroke="#2E7D34" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const qf=v=>Number.isInteger(Number(v))?String(v):Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:3});
const fD=s=>{if(!s)return '';const p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s};
const fmtDT=s=>{if(!s)return '';const dt=new Date(s);return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
const NOTIFICAR=['5581992573535','5581994135602']; // comprador (Esdras) + gestor (Wagner)
function recebimentoHTML(d){
  if(d.recebimento){const r=d.recebimento;const nf=r.nota||{};
    const nfLinha=(nf.numero||nf.valor!=null||nf.data)?'<div class="nfinfo">'+(nf.numero?'<span>NF <b>'+esc(nf.numero)+'</b></span>':'')+(nf.valor!=null?'<span>Valor da nota <b>'+brl(nf.valor)+'</b></span>':'')+(nf.data?'<span>Emissão <b>'+fD(nf.data)+'</b></span>':'')+'</div>':'';
    const estoque=r.estoque?'<div class="rest">📦 Estoque: '+(r.estoque.entradas||0)+' item(ns) deram entrada'+((r.estoque.naoCadastrados&&r.estoque.naoCadastrados.length)?' · ⚠ '+r.estoque.naoCadastrados.length+' sem cadastro: '+r.estoque.naoCadastrados.slice(0,6).map(esc).join(', '):'')+'</div>':'';
    return '<div class="recdone">✅ <b>Recebimento confirmado</b> — '+esc(r.status)+' · por '+esc(r.por||'—')+' em '+fmtDT(r.em)+nfLinha+(r.obs?'<div class="robs">Obs: '+esc(r.obs)+'</div>':'')+estoque+(r.anexo_url?'<div><a class="vernota" href="'+esc(r.anexo_url)+'" target="_blank" rel="noreferrer">📎 Ver nota fiscal</a></div>':'')+'</div>';}
  return '<div class="recbox"><b>📦 Confirmar recebimento</b><p>Conferente: confira os itens (quantidade, validade, estado), informe os dados da nota fiscal e anexe a NF para auditoria. O comprador e o gestor são avisados automaticamente.</p>'
    +'<input id="rpor" placeholder="Seu nome (conferente)" />'
    +'<div class="rgrid"><input id="rnf" placeholder="Nº da nota fiscal" /><input id="rval" inputmode="decimal" placeholder="Valor da nota (R$)" /><input id="rdata" type="date" title="Data de emissão da nota" /></div>'
    +'<label class="ranx">📎 Anexar nota fiscal (foto ou PDF)<input id="ranx" type="file" accept="image/*,application/pdf" /></label>'
    +'<textarea id="robs" rows="2" placeholder="Observação / divergência (opcional)"></textarea>'
    +'<div class="rbtns"><button class="rb ok" onclick="confirmarReceb(\'Recebido integral\')">✅ Recebido integral</button><button class="rb warn" onclick="confirmarReceb(\'Recebido parcial\')">🟠 Recebido parcial</button><button class="rb crit" onclick="confirmarReceb(\'Com divergência\')">⚠️ Com divergência</button></div></div>';
}
function parseBRL(s){ s=String(s||'').trim(); if(!s)return null; if(s.indexOf(',')>=0)return Number(s.replace(/\./g,'').replace(',','.'))||null; return Number(s)||null; }
async function confirmarReceb(status){
  const p=window.__ped; if(!p)return; const d=p.d;
  const val=function(id){return ((document.getElementById(id)||{}).value||'').trim();};
  const por=val('rpor'), obs=val('robs'), nf=val('rnf'), dataNota=val('rdata')||null, valorNota=parseBRL(val('rval'));
  if((status==='Com divergência'||status==='Recebido parcial')&&!obs){ alert('Descreva a divergência/pendência na observação.'); return; }
  document.querySelectorAll('.rb').forEach(function(b){b.disabled=true;b.textContent='Enviando…';});
  // anexo da NF (bucket público 'anexos')
  var anexo_url=null; var fe=document.getElementById('ranx'); var file=fe&&fe.files&&fe.files[0];
  if(file){ try{ var ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,''); var path='recebimentos/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
    var up=await fetch(SB+'/storage/v1/object/anexos/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':file.type||'application/octet-stream'},body:file});
    if(up.ok) anexo_url=SB+'/storage/v1/object/public/anexos/'+path; }catch(e){} }
  d.recebimento={status:status,por:por,obs:obs,em:new Date().toISOString(),nota:{numero:nf||null,valor:valorNota,data:dataNota},anexo_url:anexo_url};
  // entrada automática no estoque (só no recebimento integral) — casa produtos e dá entrada
  if(status==='Recebido integral'){ try{ var er=await fetch('/api/recebimento-estoque',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chave:p.chave,nf:nf,por:por})}); var ej=await er.json().catch(function(){return null;}); if(ej&&ej.ok) d.recebimento.estoque={entradas:ej.entradas,naoCadastrados:ej.naoCadastrados||[]}; }catch(e){} }
  try{ await fetch(SB+'/rest/v1/app_config?chave=eq.'+encodeURIComponent(p.chave),{method:'PATCH',headers:Object.assign({},H,{'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({valor:d})}); }catch(e){}
  var est=d.recebimento.estoque;
  const msg='✅ *Recebimento confirmado*\n'+(d.fornecedor||'')+' — '+(d.loja||'')+'\nRecebido em '+fmtDT(d.recebimento.em)+(por?' por '+por:'')+'\nStatus: *'+status+'*'+(nf?'\nNF nº '+nf:'')+'\nValor da nota: '+brl(valorNota!=null?valorNota:(d.total||0))+' · '+(d.itens||[]).length+' itens'+(obs?'\n📝 Obs: '+obs:'')+(est?'\n📦 Estoque: '+(est.entradas||0)+' item(ns) deram entrada'+((est.naoCadastrados||[]).length?' · '+est.naoCadastrados.length+' sem cadastro':''):'')+(anexo_url?'\n📎 NF: '+anexo_url:'');
  for(const f of NOTIFICAR){ try{ await fetch('/api/evolution-send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:f,message:msg})}); }catch(e){} }
  run();
}

async function run(){
  if(!P){ document.getElementById('app').innerHTML='<div class="msg">Link inválido — falta o identificador do pedido.</div>'; return; }
  const chave = P.startsWith('pedido_')?P:('pedido_'+P);
  const row=(await (await fetch(SB+'/rest/v1/app_config?select=valor&chave=eq.'+encodeURIComponent(chave),{headers:H})).json())[0];
  if(!row){ document.getElementById('app').innerHTML='<div class="msg">Pedido não encontrado.</div>'; return; }
  const d=row.valor;
  const flow=/flow/i.test(d.loja||''); const MARCA=flow?'Flow':'Amore';
  if(flow){ document.documentElement.style.setProperty('--vinho','#2E7D34'); document.title='Pedido de Compra — Flow'; }
  const rows=(d.itens||[]).map((i,n)=>'<tr><td class="num">'+(n+1)+'</td><td class="prod">'+esc(i.produto)+'</td><td class="num">'+qf(i.qtd)+' <span class="un">'+esc(i.un||'')+'</span></td><td class="num">'+brl(i.preco)+'</td><td class="num">'+brl(i.subtotal!=null?i.subtotal:(i.preco*i.qtd))+'</td></tr>').join('');
  const total=d.total!=null?d.total:(d.itens||[]).reduce((s,i)=>s+(i.subtotal!=null?i.subtotal:i.preco*i.qtd),0);
  document.getElementById('app').innerHTML=
   '<header class="top"><div>'+(flow?'<div style="margin-bottom:6px">'+LOGO_FLOW+'</div>':'')+'<div class="eyebrow">'+MARCA+' · Pedido de Compra</div><h1>'+esc(d.fornecedor||'Fornecedor')+'</h1><div class="sub">'+esc(d.loja||'')+' · '+fD(d.data)+(d.pagamento?' · '+esc(d.pagamento):'')+'</div></div><button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button></header>'
   +'<div class="meta">'
     +(d.cliente?'<div><div class="l">Cliente</div><div class="v">'+esc(d.cliente)+'</div></div>':'')
     +'<div><div class="l">Itens</div><div class="v">'+(d.itens||[]).length+'</div></div>'
     +((d.janela_entrega||d.data)?'<div><div class="l">Entrega</div><div class="v">'+fD(d.janela_entrega||d.data)+'</div></div>':'')
     +(d.horario_recebimento?'<div><div class="l">Horário de recebimento</div><div class="v">'+esc(d.horario_recebimento)+'</div></div>':'')
     +(d.recebimento_responsavel?'<div><div class="l">Recebimento</div><div class="v">'+esc(d.recebimento_responsavel)+'</div></div>':'')
     +'<div><div class="l">Total</div><div class="v" style="color:var(--vinho)">'+brl(total)+'</div></div>'
   +'</div>'
   +'<div class="tw"><table><thead><tr><th class="num">#</th><th>Produto</th><th class="num">Qtd</th><th class="num">Valor unit.</th><th class="num">Subtotal</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td colspan="4" class="num tl">VALOR TOTAL</td><td class="num tl">'+brl(total)+'</td></tr></tfoot></table></div>'
   +((d.cancelados&&d.cancelados.length)?'<div class="canc">⚠️ Item(ns) CANCELADO(S) — não incluído(s): '+d.cancelados.map(esc).join(', ')+'</div>':'')
   +recebimentoHTML(d)
   +'<div class="foot">Pedido gerado pelo Painel Amore. Confira quantidades, validade e estado no recebimento. Qualquer divergência, sinalizar ao comprador.</div>';
  window.__ped={chave:chave,d:d};
  document.title='Pedido '+(d.fornecedor||'')+' — '+(d.loja||'');
}
run().catch(function(){document.getElementById('app').innerHTML='<div class="msg">Erro ao carregar o pedido.</div>';});
</script>
</body>
</html>
