<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Relatório de Recebimento — Ciclo de Compras — Amore</title>
<style>
:root{--vinho:#8B1212;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--shadow:0 1px 2px rgba(80,20,25,.05),0 8px 24px -12px rgba(80,20,25,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 60px}
header.top{border-bottom:2px solid var(--vinho);padding-bottom:14px;margin-bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho);font-weight:700}
h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
h2{font-size:16.5px;margin:26px 0 10px;color:var(--vinho);display:flex;align-items:center;gap:8px}h2 .h2s{font-size:12px;font-weight:500;color:var(--muted)}
.ia{background:color-mix(in srgb,var(--vinho) 6%,var(--card));border:1px solid var(--border);border-left:4px solid var(--vinho);border-radius:12px;padding:14px 16px;font-size:14px;margin:14px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi.ok{border-left:4px solid var(--ok)}.kpi.warn{border-left:4px solid var(--warn)}.kpi.bad{border-left:4px solid var(--bad)}
.kpi .kn{font-size:21px;font-weight:800}.kpi .ks{font-size:12px;font-weight:600;color:var(--muted)}.kpi .kl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:8px 11px;border-bottom:1px solid var(--border)}tbody tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap}.prod{font-weight:600}.mut{color:var(--muted)}.mc{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.b-ok{background:#DCFCE7;color:#15803D}.b-no{background:#FEE2E2;color:#B91C1C}.b-warn{background:#FEF3C7;color:#B45309}
@media(prefers-color-scheme:dark){.b-ok{background:#0f2e1b;color:#4ade80}.b-no{background:#3a1414;color:#f87171}.b-warn{background:#33270a;color:#fbbf24}}
.empty{padding:16px;color:var(--muted);font-size:12.5px;border:1px dashed var(--border);border-radius:10px}
.lojahd{font-size:11px;font-weight:800;color:#fff;background:var(--vinho);border-radius:8px;padding:3px 10px}
.foot{margin-top:26px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:680px){
  .tw{overflow:visible;border:none;box-shadow:none;background:transparent}
  table{min-width:0;font-size:13px}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  tbody tr{display:block;background:var(--card);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:4px 12px;margin-bottom:10px}
  tbody td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border);text-align:right;white-space:normal}
  tbody tr td:last-child{border-bottom:none}
  tbody td::before{content:attr(data-label);color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;text-align:left}
  tbody td:not([data-label])::before{content:""}
  td.prod{display:block;text-align:left;font-size:14.5px;font-weight:800;border-bottom:2px solid var(--vinho);padding:7px 0 6px}
  td.prod::before{display:none}
}
@media print{.btn{display:none}body{background:#fff}.tw,.kpi{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Consolidando a conferência por loja…</div></div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const q=new URLSearchParams(location.search);
const canon=l=>({'Amore Costa Dourada':'Amore CD','Flow Paiva':'Flow CD'})[l]||l;
const LOJA=canon((q.get('loja')||'').trim());
function hojeRecife(){const l=new Date(Date.now()-3*3600*1000);return l.toISOString().slice(0,10)}
const D=(q.get('d')||q.get('data')||hojeRecife()).slice(0,10);
const g=async p=>{try{return await (await fetch(SB+'/rest/v1/'+p,{headers:H})).json()}catch(e){return []}};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const dDMY=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s};
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const r3=n=>Math.round((Number(n)||0)*1000)/1000;
const OCOR={produto_diferente:'Produto diferente',quantidade_divergente:'Quantidade divergente',valor_divergente:'Valor divergente',produto_faltando:'Produto faltando',produto_faturado_nao_entregue:'Faturado, não entregue',produto_excedente:'Excedente',embalagem_danificada:'Embalagem danificada',produto_avariado:'Avariado',validade_curta:'Validade curta',produto_vencido:'Vencido',qualidade_fora_padrao:'Qualidade fora do padrão',peso_divergente:'Peso divergente',outro:'Outro'};
const ocorL=v=>OCOR[v]||v;
function entregueDe(p,produto){const n=nrm(produto);return (p.entregas||[]).reduce((s,e)=>s+(e.itens||[]).filter(i=>nrm(i.produto)===n).reduce((a,i)=>a+(Number(i.qtd)||0),0),0)}

async function run(){
  const dataFmt=dDMY(D);
  const [pedRows, estRows, obsRows]=await Promise.all([
    g('app_config?chave=like.pedido_*&select=chave,valor'),
    g('produtos?select=loja,nome,estoque_atual&ativo=eq.true&limit=8000'),
    g('app_config?chave=eq.ciclo_rel_obs&select=valor'),
  ]);
  const pedidos=(Array.isArray(pedRows)?pedRows:[]).map(r=>({chave:r.chave,...(r.valor||{})})).filter(p=>(!LOJA||canon(p.loja)===LOJA));
  const estM={}; (Array.isArray(estRows)?estRows:[]).forEach(p=>{estM[canon(p.loja)+'|'+nrm(p.nome)]=Number(p.estoque_atual)||0});
  const estoqueDe=(loja,prod)=>estM[canon(loja)+'|'+nrm(prod)];
  const obsMap=(obsRows&&obsRows[0]&&obsRows[0].valor)||{}; const obsTxt=obsMap[(LOJA||'Todas')+'|'+D]||'';

  const abertos=pedidos.filter(p=>!(p.fechamento&&p.fechamento.fechado));
  // agrupa por loja → produtos (pedido × chegou × falta) + estoque
  const lojas={};
  abertos.forEach(p=>{const L=p.loja||'—'; if(!lojas[L])lojas[L]={}; (p.itens||[]).forEach(it=>{const k=nrm(it.produto); if(!lojas[L][k])lojas[L][k]={produto:it.produto,un:it.un||'',pedido:0,chegou:0}; lojas[L][k].pedido+=Number(it.qtd)||0; lojas[L][k].chegou+=entregueDe(p,it.produto);});});
  // desvios em aberto
  const desvios=[]; abertos.forEach(p=>(p.entregas||[]).forEach(e=>(e.itens||[]).forEach(i=>{if(i.desvio&&i.desvio.tipo)desvios.push({produto:i.produto,tipo:i.desvio.tipo,descricao:i.desvio.descricao||'',fornecedor:p.fornecedor,loja:p.loja});})));

  let totPed=0,totCheg=0,totFalta=0,nFalta=0,nProd=0;
  Object.values(lojas).forEach(prods=>Object.values(prods).forEach(r=>{const f=Math.max(0,r3(r.pedido-r.chegou)); totPed++; totCheg+=(r.chegou>0?1:0); totFalta+=f; nProd++; if(f>0.0001)nFalta++;}));

  const tabela=(cols,rows,vazio)=>rows.length?`<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${vazio}</div>`;
  const kchip=(l,v,cls,sub)=>`<div class="kpi ${cls||''}"><div class="kn">${v}</div><div class="kl">${l}</div>${sub?`<div class="ks">${sub}</div>`:''}</div>`;

  const lojasOrden=Object.keys(lojas).sort();
  const secoes=lojasOrden.map(L=>{
    const prods=Object.values(lojas[L]).map(r=>({...r,pedido:r3(r.pedido),chegou:r3(r.chegou),falta:Math.max(0,r3(r.pedido-r.chegou))})).sort((a,b)=>b.falta-a.falta);
    const rows=prods.map(r=>{const est=estoqueDe(L,r.produto); const un=esc(r.un);
      return `<tr><td class="prod">${esc(r.produto)}</td><td class="num" data-label="Estoque">${est==null?'—':`${r3(est)} ${un}`}</td><td class="num" data-label="Pedido">${r.pedido} ${un}</td><td class="num" data-label="Chegou">${r.chegou} ${un}</td><td class="num" data-label="Falta">${r.falta>0.0001?`<b style="color:var(--bad)">${r.falta} ${un}</b>`:'<span class="badge b-ok">0</span>'}</td></tr>`;
    });
    const faltaL=prods.reduce((s,r)=>s+r.falta,0);
    return `<h2>🏪 ${esc(L)} <span class="h2s">· ${prods.length} produto(s)${faltaL>0.0001?' · há itens a entregar':' · tudo entregue'}</span></h2>`+tabela([{h:'Produto'},{h:'Estoque',num:1},{h:'Pedido',num:1},{h:'Chegou',num:1},{h:'Falta',num:1}],rows,'Sem itens em aberto nesta loja.');
  }).join('');

  const resumo=`Conferência de ${dataFmt}${LOJA?` (${esc(LOJA)})`:' · todas as lojas'}: <b>${nProd} produto(s)</b> em pedidos abertos, <b style="color:var(--bad)">${nFalta} ainda com falta</b> de entrega. Confira loja por loja abaixo — estoque, quanto foi pedido, quanto chegou e o que falta.`;

  document.getElementById('app').innerHTML=
    `<header class="top"><div><div class="eyebrow">Painel Amore · Ciclo de Compras</div><h1>Conferência de Recebimento — Loja por Loja</h1><div class="sub">${dataFmt}${LOJA?` · ${esc(LOJA)}`:' · Todas as lojas'}</div></div><button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button></header>`
   +`<div class="ia">📦 <b>Resumo:</b> ${resumo}</div>`
   +(obsTxt?`<div class="ia" style="border-left-color:#0369A1">📝 <b>Observações do comprador:</b> ${esc(obsTxt)}</div>`:'')
   +`<div class="kpis">`
   +kchip('Produtos em aberto',nProd,'ok')
   +kchip('Com falta de entrega',nFalta,nFalta?'bad':'ok')
   +kchip('Lojas',lojasOrden.length,'ok')
   +kchip('Desvios',desvios.length,desvios.length?'bad':'ok')
   +`</div>`
   +(secoes||`<div class="empty">Nenhum pedido em aberto para conferir.</div>`)
   +(desvios.length?`<h2>⚠️ Desvios / ocorrências</h2>`+tabela([{h:'Produto'},{h:'Ocorrência'},{h:'Loja'},{h:'Fornecedor'},{h:'Descrição'}],desvios.map(d=>`<tr><td class="prod">${esc(d.produto)}</td><td data-label="Ocorrência"><span class="badge b-no">${esc(ocorL(d.tipo))}</span></td><td data-label="Loja">${esc(d.loja||'')}</td><td data-label="Fornecedor">${esc(d.fornecedor||'—')}</td><td data-label="Descrição">${esc(d.descricao||'—')}</td></tr>`),'Nenhum desvio.'):'')
   +`<div class="foot"><b>Conferência de Recebimento — Ciclo de Compras.</b> Loja por loja: estoque atual, quanto foi pedido, quanto chegou e o que falta entregar (pedidos em aberto). No painel (Ciclo de Compras → Conferência por Loja) o comprador edita e atualiza estes valores. Painel Amore · gerado ${new Date().toLocaleString('pt-BR')}</div>`;
}
run().catch(function(e){document.getElementById('app').innerHTML='<div class="msg">Erro ao gerar a conferência: '+esc(e&&e.message||e)+'</div>';});
</script>
</body>
</html>
