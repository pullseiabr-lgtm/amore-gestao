<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Relatório Diário — Compras & Estoque — Amore</title>
<style>
:root{--vinho:#8B1212;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--shadow:0 1px 2px rgba(80,20,25,.05),0 8px 24px -12px rgba(80,20,25,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 60px}
header.top{border-bottom:2px solid var(--vinho);padding-bottom:14px;margin-bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho);font-weight:700}
h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
h2{font-size:16.5px;margin:26px 0 10px;color:var(--vinho)}h2 .h2s{font-size:12px;font-weight:500;color:var(--muted)}
.ia{background:color-mix(in srgb,var(--vinho) 6%,var(--card));border:1px solid var(--border);border-left:4px solid var(--vinho);border-radius:12px;padding:14px 16px;font-size:14px;margin:14px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi.ok{border-left:4px solid var(--ok)}.kpi.warn{border-left:4px solid var(--warn)}.kpi.bad{border-left:4px solid var(--bad)}
.kpi .kn{font-size:21px;font-weight:800}.kpi .ks{font-size:12px;font-weight:600;color:var(--muted)}.kpi .kl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:8px 11px;border-bottom:1px solid var(--border)}tbody tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap}.prod{font-weight:600}.mut{color:var(--muted)}.mc{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.b-ok{background:#DCFCE7;color:#15803D}.b-no{background:#FEE2E2;color:#B91C1C}.b-warn{background:#FEF3C7;color:#B45309}.b-info{background:#E0F2FE;color:#0369A1}
@media(prefers-color-scheme:dark){.b-ok{background:#0f2e1b;color:#4ade80}.b-no{background:#3a1414;color:#f87171}.b-warn{background:#33270a;color:#fbbf24}.b-info{background:#0b2a3a;color:#7dd3fc}}
.empty{padding:16px;color:var(--muted);font-size:12.5px;border:1px dashed var(--border);border-radius:10px}
.sub3{font-size:13.5px;font-weight:700;margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}.chip{font-size:11.5px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 11px}.chip b{color:var(--vinho)}
.foot{margin-top:26px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:680px){
  .tw{overflow:visible;border:none;box-shadow:none;background:transparent}
  table{min-width:0;font-size:13px}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  tbody tr{display:block;background:var(--card);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:4px 12px;margin-bottom:10px}
  tbody td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border);text-align:right;white-space:normal}
  tbody tr td:last-child{border-bottom:none}
  tbody td::before{content:attr(data-label);color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;text-align:left}
  tbody td:not([data-label])::before{content:""}
  td.prod{display:block;text-align:left;font-size:14.5px;font-weight:800;border-bottom:2px solid var(--vinho);padding:7px 0 6px}
  td.prod::before{display:none}
}
@media print{.btn{display:none}body{background:#fff}.tw,.kpi{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Consolidando o dia…</div></div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const q=new URLSearchParams(location.search);
const canon=l=>({'Amore Costa Dourada':'Amore CD','Flow Paiva':'Flow CD'})[l]||l;
const LOJA=canon((q.get('loja')||'').trim());
// data (default hoje em America/Recife)
function hojeRecife(){const l=new Date(Date.now()-3*3600*1000);return l.toISOString().slice(0,10)}
const D=(q.get('d')||q.get('data')||hojeRecife()).slice(0,10);
const g=async p=>{try{return await (await fetch(SB+'/rest/v1/'+p,{headers:H})).json()}catch(e){return []}};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const parseO=o=>{try{const v=JSON.parse(o||'{}');return v&&typeof v==='object'?v:{}}catch(e){return {}}};
const dDMY=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s};
const diaDe=iso=>{if(!iso)return '';const d=new Date(new Date(iso).getTime()-3*3600*1000);return d.toISOString().slice(0,10)};
const horaDe=iso=>{if(!iso)return '';const d=new Date(new Date(iso).getTime()-3*3600*1000);return d.toISOString().slice(11,16)};
const inicioISO=D+'T00:00:00-03:00', fimISO=(()=>{const d=new Date(D+'T00:00:00-03:00');d.setDate(d.getDate()+1);return d.toISOString()})();
const lojaEq=col=>LOJA?`&${col}=eq.`+encodeURIComponent(LOJA):'';

async function run(){
  const dataFmt=dDMY(D);
  // ── coletas ──
  const reqs=await g(`requisicoes?select=id,numero,titulo,loja,responsavel_nome,status,created_at${lojaEq('loja')}&created_at=gte.${encodeURIComponent(inicioISO)}&created_at=lt.${encodeURIComponent(fimISO)}`);
  // cotações (para pendentes e economia) — dos reqs recentes
  const reqsRec=await g(`requisicoes?select=id,numero,loja${lojaEq('loja')}&order=numero.desc&limit=60`);
  const reqIds=(reqsRec||[]).map(r=>r.id);
  let cots=[],itens=[],ci=[];
  if(reqIds.length){
    cots=await g(`requisicao_cotacoes?select=id,requisicao_id,fornecedor_nome,status,total,created_at,updated_at,observacoes&requisicao_id=in.(${reqIds.join(',')})`);
    itens=await g(`requisicao_itens?select=id,requisicao_id,produto_nome,quantidade&requisicao_id=in.(${reqIds.join(',')})`);
    const cotIds=(cots||[]).map(c=>c.id);
    if(cotIds.length) ci=await g(`requisicao_cotacao_itens?select=cotacao_id,item_id,preco_unitario,disponivel&cotacao_id=in.(${cotIds.join(',')})`);
  }
  // pedidos (app_config)
  const pedRows=await g('app_config?chave=like.pedido_*&select=chave,valor');
  const pedidos=(pedRows||[]).map(r=>({chave:r.chave,...(r.valor||{})})).filter(p=>(!LOJA||canon(p.loja)===LOJA));
  const pedHoje=pedidos.filter(p=>(p.data||diaDe(p.em))===D);
  const recHoje=pedidos.filter(p=>p.recebimento&&diaDe(p.recebimento.em)===D);
  // movimentações do dia
  const movs=await g(`estoque_movimentacoes?select=tipo,produto_id,produto_nome,quantidade,unidade,loja,setor,motivo,created_by,created_at${lojaEq('loja')}&created_at=gte.${encodeURIComponent(inicioISO)}&created_at=lt.${encodeURIComponent(fimISO)}&order=created_at.desc`);
  // produtos (críticos + mapa de custo p/ valorar saídas)
  const prods=await g(`produtos?select=id,nome,loja,unidade,estoque_atual,estoque_minimo,ultimo_preco_compra&ativo=eq.true${lojaEq('loja')}&limit=5000`);
  const custoById={}; (prods||[]).forEach(p=>{if(p.id)custoById[p.id]=Number(p.ultimo_preco_compra)||0});
  const valorMov=m=>(custoById[m.produto_id]||0)*(Number(m.quantidade)||0);
  const criticos=(prods||[]).filter(p=>Number(p.estoque_minimo)>0 && Number(p.estoque_atual)<=Number(p.estoque_minimo)).sort((a,b)=>(a.estoque_atual/(a.estoque_minimo||1))-(b.estoque_atual/(b.estoque_minimo||1)));
  // cotações pendentes (portal cot_tok)
  const tokRows=await g('app_config?chave=like.cot_tok:*&select=valor');
  const toks=(tokRows||[]).map(r=>r.valor||{}).filter(t=>t&&t.fornecedor_nome&&!['respondido','cancelado'].includes(t.status));

  // ── cálculos ──
  const valorComprado=pedHoje.reduce((s,p)=>s+(Number(p.total)||0),0);
  // economia potencial das cotações respondidas hoje (menor vs 2º menor, cap 3x)
  const ciByItem={}; ci.forEach(r=>{const p=Number(r.preco_unitario)||0; if(r.disponivel!==false&&p>0)(ciByItem[r.item_id]=ciByItem[r.item_id]||[]).push(p)});
  const itById={}; itens.forEach(i=>itById[i.id]=i);
  let economia=0, itensComparados=0;
  Object.entries(ciByItem).forEach(([iid,arr])=>{const it=itById[iid]; if(!it||arr.length<2)return; const s=arr.slice().sort((a,b)=>a-b); const menor=s[0],seg=s[1]; if(seg<=menor*3){economia+=(seg-menor)*(it.quantidade||0); itensComparados++;}});
  const respHoje=(cots||[]).filter(c=>diaDe(c.updated_at||c.created_at)===D && (ci.some(r=>r.cotacao_id===c.id && r.disponivel!==false && Number(r.preco_unitario)>0)));
  const nfHoje=recHoje.length; // proxy: recebimentos confirmados hoje
  const criadasHoje=(reqs||[]).length;
  const entradas=movs.filter(m=>m.tipo==='entrada'), saidas=movs.filter(m=>m.tipo==='saida'), perdas=movs.filter(m=>m.tipo==='perda'), transf=movs.filter(m=>m.tipo==='transferencia');

  // melhor fornecedor do dia (mais itens campeões nas cotações respondidas hoje) — simplificado: fornecedor com mais pedidos hoje por valor
  const fornDia={}; pedHoje.forEach(p=>{fornDia[p.fornecedor]=(fornDia[p.fornecedor]||0)+(Number(p.total)||0)});
  const melhorForn=Object.entries(fornDia).sort((a,b)=>b[1]-a[1])[0];
  const tokMaisAntiga=toks.slice().sort((a,b)=>String(a.enviado_em||'').localeCompare(String(b.enviado_em||'')))[0];

  // ── resumo textual (regras) ──
  const resumo=`No dia ${dataFmt}${LOJA?` (${LOJA})`:''} foram gerados <b>${pedHoje.length} pedido(s)</b> de compra, totalizando <b>${brl(valorComprado)}</b>`+
    (economia>0?`, com economia potencial de <b>${brl(economia)}</b> nas cotações comparadas`:'')+
    `. ${criadasHoje} requisição(ões) criada(s), ${respHoje.length} cotação(ões) respondida(s) e <b>${recHoje.length} recebimento(s)</b> confirmado(s). `+
    `Estoque: ${entradas.length} entrada(s), ${saidas.length} saída(s)${perdas.length?`, ${perdas.length} perda(s)`:''}. `+
    (criticos.length?`<b style="color:var(--bad)">${criticos.length} produto(s) abaixo do mínimo</b> exigindo reposição. `:'Nenhum produto abaixo do mínimo. ')+
    (toks.length?`${toks.length} cotação(ões) ainda pendente(s) de fornecedor.`:'Sem cotações pendentes.');

  // ── render helpers ──
  const kchip=(l,v,cls,sub)=>`<div class="kpi ${cls||''}"><div class="kn">${v}</div><div class="kl">${l}</div>${sub?`<div class="ks">${sub}</div>`:''}</div>`;
  const tabela=(cols,rows,vazio)=>rows.length?`<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${vazio}</div>`;

  // 2. Compras do dia (itens)
  const linhasCompra=[];
  pedHoje.forEach(p=>(p.itens||[]).forEach(it=>linhasCompra.push(
    `<tr><td class="prod">${esc(it.produto)}</td><td class="num" data-label="Qtd">${it.qtd} ${esc(it.un||'')}</td><td data-label="Fornecedor">${esc(p.fornecedor)}</td><td class="num" data-label="Unit.">${brl(it.preco)}</td><td class="num" data-label="Total">${brl(it.subtotal!=null?it.subtotal:(it.qtd*it.preco))}</td></tr>`)));
  // 5. Recebimentos
  const linhasReceb=recHoje.map(p=>`<tr><td class="prod">${esc(p.fornecedor)}<span class="mc">${p.loja}</span></td><td class="num" data-label="Valor">${brl(p.total)}</td><td data-label="Recebido por">${esc(p.recebimento.por||p.recebimento_responsavel||'—')}</td><td data-label="Hora">${horaDe(p.recebimento.em)}</td><td data-label="Status">${(p.recebimento.status||'').includes('integral')?'<span class="badge b-ok">✓ integral</span>':'<span class="badge b-warn">'+esc(p.recebimento.status||'recebido')+'</span>'}</td></tr>`);
  // 4. Cotações pendentes
  const linhasPend=toks.slice().sort((a,b)=>String(a.enviado_em||'').localeCompare(String(b.enviado_em||''))).map(t=>{const dias=t.enviado_em?Math.floor((Date.now()-new Date(t.enviado_em).getTime())/86400000):null; const alerta=dias!=null&&dias>=2; return `<tr><td class="prod">${esc(t.fornecedor_nome)}</td><td data-label="Enviado">${t.enviado_em?dDMY(t.enviado_em):'—'}</td><td class="num" data-label="Aguardando">${dias!=null?dias+'d':'—'}</td><td data-label="Status">${alerta?'<span class="badge b-no">atrasado</span>':(t.status==='aberto'?'<span class="badge b-info">abriu, sem responder</span>':'<span class="badge b-warn">aguardando</span>')}</td></tr>`});
  // 9. Movimentações — saídas/perdas com destaque + consumo por setor + entradas
  const saidasEperdas=movs.filter(m=>m.tipo==='saida'||m.tipo==='perda');
  const valorSaidas=saidas.reduce((s,m)=>s+valorMov(m),0), valorPerdas=perdas.reduce((s,m)=>s+valorMov(m),0);
  const saidaRow=m=>{const v=valorMov(m); return `<tr><td class="prod">${esc(m.produto_nome)}</td><td class="num" data-label="Qtd">${m.quantidade} ${esc(m.unidade||'')}</td><td data-label="Tipo">${m.tipo==='perda'?'<span class="badge b-no">perda</span>':'<span class="badge b-info">saída</span>'}</td><td data-label="Setor">${esc(m.setor||'—')}</td><td data-label="Motivo">${esc(m.motivo||'—')}</td><td class="num" data-label="Valor">${v>0?brl(v):'—'}</td><td data-label="Por">${esc(m.created_by||'—')}</td><td data-label="Hora">${horaDe(m.created_at)}</td></tr>`;};
  const entradaRow=m=>`<tr><td class="prod">${esc(m.produto_nome)}</td><td class="num" data-label="Qtd">${m.quantidade} ${esc(m.unidade||'')}</td><td data-label="Motivo">${esc(m.motivo||'—')}</td><td data-label="Por">${esc(m.created_by||'—')}</td><td data-label="Hora">${horaDe(m.created_at)}</td></tr>`;
  const consumo={}; saidas.forEach(m=>{const k=m.setor||'sem setor';consumo[k]=(consumo[k]||0)+1});
  const consumoChips=Object.entries(consumo).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span class="chip">${esc(k)}: <b>${n}</b></span>`).join('');
  // 10. Produtos críticos
  const linhasCrit=criticos.slice(0,40).map(p=>{const cons=0; const cobertura=Number(p.estoque_minimo)>0?(Number(p.estoque_atual)/Number(p.estoque_minimo)):1; return `<tr><td class="prod">${esc(p.nome)}${LOJA?'':`<span class="mc">${esc(p.loja)}</span>`}</td><td class="num" data-label="Atual">${p.estoque_atual} ${esc(p.unidade||'')}</td><td class="num" data-label="Mínimo">${p.estoque_minimo}</td><td data-label="Situação">${p.estoque_atual<=0?'<span class="badge b-no">zerado</span>':cobertura<=0.5?'<span class="badge b-no">crítico</span>':'<span class="badge b-warn">baixo</span>'}</td></tr>`});

  document.getElementById('app').innerHTML=
   `<header class="top"><div><div class="eyebrow">Painel Amore · Relatório Diário</div><h1>Compras, Cotações, Recebimentos & Estoque</h1><div class="sub">${dataFmt}${LOJA?` · ${esc(LOJA)}`:' · Todas as lojas'}</div></div><button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button></header>`
   +`<div class="ia">🧠 <b>Resumo do dia:</b> ${resumo}</div>`
   +`<h2>1. Resumo Executivo</h2><div class="kpis">`
   +kchip('Requisições criadas',criadasHoje)
   +kchip('Cotações respondidas',respHoje.length)
   +kchip('Pedidos gerados',pedHoje.length)
   +kchip('Recebimentos',recHoje.length,'ok')
   +kchip('Valor comprado',brl(valorComprado),'',`${pedHoje.length} pedido(s)`)
   +kchip('Economia (cotações)',economia>0?brl(economia):'—','ok',`${itensComparados} itens comparados`)
   +kchip('Produtos críticos',criticos.length,criticos.length?'bad':'ok','abaixo do mínimo')
   +kchip('Cotações pendentes',toks.length,toks.length?'warn':'ok')
   +(melhorForn?kchip('Fornecedor do dia',esc(melhorForn[0]),'',brl(melhorForn[1])):'')
   +(tokMaisAntiga?kchip('Cotação + antiga pendente',esc(tokMaisAntiga.fornecedor_nome),'warn',tokMaisAntiga.enviado_em?dDMY(tokMaisAntiga.enviado_em):''):'')
   +`</div>`
   +`<h2>2. Compras do dia <span class="h2s">— itens comprados</span></h2>`+tabela([{h:'Produto'},{h:'Qtd',num:1},{h:'Fornecedor'},{h:'Unit.',num:1},{h:'Total',num:1}],linhasCompra,'Nenhuma compra registrada neste dia.')
   +(linhasCompra.length?`<div style="text-align:right;font-weight:800;margin-top:8px;font-size:15px">Total de compras: <span style="color:var(--vinho)">${brl(valorComprado)}</span></div>`:'')
   +`<h2>5. Recebimentos do dia</h2>`+tabela([{h:'Fornecedor'},{h:'Valor',num:1},{h:'Recebido por'},{h:'Hora'},{h:'Status'}],linhasReceb,'Nenhum recebimento confirmado neste dia.')
   +`<h2>4. Cotações pendentes <span class="h2s">— aguardando fornecedor</span></h2>`+tabela([{h:'Fornecedor'},{h:'Enviado'},{h:'Aguardando',num:1},{h:'Status'}],linhasPend,'Sem cotações pendentes.')
   +`<h2>9. Movimentações de estoque</h2><div class="kpis">`
   +kchip('Entradas',entradas.length,'ok')+kchip('Saídas',saidas.length)+kchip('Valor saídas',brl(valorSaidas),'',`${saidas.length} saída(s)`)+kchip('Perdas',perdas.length,perdas.length?'bad':'')+kchip('Valor perdas',valorPerdas>0?brl(valorPerdas):'—',valorPerdas>0?'bad':'')+kchip('Transferências',transf.length)
   +`</div>`
   +`<div class="sub3">📤 Saídas & perdas do dia</div>`+tabela([{h:'Produto'},{h:'Qtd',num:1},{h:'Tipo'},{h:'Setor'},{h:'Motivo'},{h:'Valor',num:1},{h:'Por'},{h:'Hora'}],saidasEperdas.slice(0,80).map(saidaRow),'Nenhuma saída registrada neste dia.')
   +((valorSaidas+valorPerdas)>0?`<div style="text-align:right;font-weight:800;margin-top:6px;font-size:14px">Total de saídas: <span style="color:var(--vinho)">${brl(valorSaidas+valorPerdas)}</span>${valorPerdas>0?` <span style="font-weight:500;font-size:12px;color:var(--muted)">(perdas ${brl(valorPerdas)})</span>`:''}</div>`:'')
   +(consumoChips?`<div class="sub3">Consumo por setor</div><div class="chips">${consumoChips}</div>`:'')
   +`<div class="sub3">📥 Entradas do dia</div>`+tabela([{h:'Produto'},{h:'Qtd',num:1},{h:'Motivo'},{h:'Por'},{h:'Hora'}],entradas.slice(0,60).map(entradaRow),'Nenhuma entrada neste dia.')
   +`<h2>10. Produtos críticos <span class="h2s">— abaixo do mínimo</span></h2>`+tabela([{h:'Produto'},{h:'Atual',num:1},{h:'Mínimo',num:1},{h:'Situação'}],linhasCrit,'Nenhum produto abaixo do mínimo. 🎉')
   +(criticos.length>40?`<div class="mut" style="font-size:12px;margin-top:6px">…e mais ${criticos.length-40} item(ns). Veja todos no módulo Estoque.</div>`:'')
   +`<div class="foot"><b>Relatório Diário (Fase 1).</b> Consolidado automaticamente de requisições, cotações, pedidos, recebimentos e movimentações de estoque do dia. <b>Próximas fases:</b> comparativo detalhado de cotações, evolução de preços (gráficos 30/90/365 dias), conferência NF × pedido, ranking completo de fornecedores e resumo por IA generativa. Painel Amore · gerado ${new Date().toLocaleString('pt-BR')}</div>`;
}
run().catch(function(e){document.getElementById('app').innerHTML='<div class="msg">Erro ao gerar o relatório: '+esc(e&&e.message||e)+'</div>';});
</script>
</body>
</html>
