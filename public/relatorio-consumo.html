<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Consumo por Produto — Amore</title>
<style>
:root{--vinho:#8B1212;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;--ok:#15803D;--shadow:0 1px 2px rgba(80,20,25,.05),0 8px 24px -12px rgba(80,20,25,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 50px}
header{border-bottom:2px solid var(--vinho);padding-bottom:12px;margin-bottom:12px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho);font-weight:700}
h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
select,input[type=search],.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
input[type=search]{flex:1;min-width:180px;max-width:360px;font-weight:400;font-size:14px}
.btn{cursor:pointer}.btn.pri{background:var(--vinho);border-color:var(--vinho);color:#fff}
.chip{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
.kn{font-size:21px;font-weight:800}.kl{font-size:11.5px;color:var(--muted);text-transform:uppercase}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}.num{text-align:right;white-space:nowrap}
tr.it{cursor:pointer}tr.it:hover{background:color-mix(in srgb,var(--vinho) 4%,var(--card))}
.det{background:color-mix(in srgb,var(--vinho) 3%,var(--card));font-size:12.5px;padding:6px 12px 12px 28px!important}
.det table{font-size:12.5px}.det td,.det th{padding:4px 8px;position:static;background:none}
.mut{color:var(--muted)}.msg{padding:50px 0;text-align:center;color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:color-mix(in srgb,var(--vinho) 10%,var(--card));color:var(--vinho)}
.nop{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Consolidando as compras por produto…</div></div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const q=new URLSearchParams(location.search);
const canonLoja=l=>{const s=String(l||'').toLowerCase();if(s.includes('flow'))return 'Flow CD';if(s.includes('paiva'))return 'Amore Paiva';if(s.includes('costa')||s.includes(' cd')||s==='amore cd')return 'Amore CD';return l||'—'};
const LOJAS=['Todas','Amore Paiva','Amore CD','Flow CD'];
let F={loja:canonLoja(q.get('loja')||'Todas'),dias:parseInt(q.get('dias')||'90',10),busca:q.get('busca')||'',ped:true,cx:true,nf:true,ent:false,ord:'valor'};
if(!LOJAS.includes(F.loja))F.loja='Todas';
let ABERTO=null,RAW={ped:[],cx:[],nf:[],ent:null};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf=v=>Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const dmy=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const STOP=new Set(['de','da','do','com','sem','para','e','a','o','kg','kgs','g','gr','ml','l','lt','un','und','unid','cx','pct','pc','fd','fardo','caixa','pacote','unidade','unidades','litro']);
const isSize=t=>/^\d+([.,]\d+)?(kg|kgs|g|gr|mg|ml|l|lt|un|und|cx|pc|pct)$/.test(t);
const keyOf=s=>[...new Set(norm(s).split(' ').filter(t=>t.length>=2&&!STOP.has(t)&&!/^\d+$/.test(t)&&!isSize(t)))].sort().join(' ')||norm(s);
const UN={quilograma:'kg',kg:'kg',kgs:'kg','unidade(s)':'un',unidade:'un',un:'un',und:'un',unid:'un','caixa(s)':'cx',caixa:'cx',cx:'cx','pacote(s)':'pct',pacote:'pct',pct:'pct',fardo:'fardo',litro:'l',l:'l',lt:'l',g:'g'};
const unOf=u=>UN[String(u||'').toLowerCase().replace('(s)','').trim()]||UN[String(u||'').toLowerCase().trim()]||String(u||'un').toLowerCase().trim()||'un';
const get=async p=>{const r=await fetch(SB+'/rest/v1/'+p,{headers:H});if(!r.ok)throw new Error(p.split('?')[0]+' '+r.status);return r.json()};
const chunks=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
const iniISO=()=>F.dias>0?new Date(Date.now()-F.dias*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10):'2000-01-01';

async function loadBase(){
  const ini=iniISO();
  const [peds,cxs]=await Promise.all([
    get('pedidos_compra?select=id,numero,loja,fornecedor,status,created_at&status=neq.cancelada&created_at=gte.'+ini+'&limit=2000'),
    get('caixas?select=id,loja,titulo,data_ref&data_ref=gte.'+ini+'&limit=2000')]);
  const pm={};peds.forEach(p=>pm[p.id]=p);const cm={};cxs.forEach(c=>cm[c.id]=c);
  const ped=[];for(const ch of chunks(peds.map(p=>p.id),60)){(await get('pedido_compra_itens?select=*&pedido_id=in.('+ch.join(',')+')')).forEach(i=>{const p=pm[i.pedido_id];if(!p)return;
    const qtd=Number(i.qtd_pedida)||0,pr=i.preco==null?null:Number(i.preco);
    ped.push({o:'Pedido',nome:i.produto_nome,loja:canonLoja(p.loja),data:String(p.created_at).slice(0,10),forn:p.fornecedor,ref:p.numero||'Pedido',qtd,un:unOf(i.unidade),preco:pr,valor:pr==null?null:qtd*pr,rec:Number(i.qtd_recebida)||0})})}
  const cx=[];for(const ch of chunks(cxs.map(c=>c.id),60)){(await get('caixa_itens?select=*&caixa_id=in.('+ch.join(',')+')')).forEach(i=>{const c=cm[i.caixa_id];if(!c)return;
    if(['combustivel','pedagio'].includes(norm(i.categoria)))return;const qtd=Number(i.quantidade)||0,v=Number(i.valor)||0;
    cx.push({o:'Caixa',nome:i.descricao,loja:canonLoja(c.loja),data:String(i.data||c.data_ref||'').slice(0,10),forn:i.fornecedor,ref:c.titulo,cid:c.id,qtd,un:unOf(i.unidade),preco:qtd>0?v/qtd:null,valor:v,agreg:qtd<=0})})}
  let nfs=[];try{nfs=await get('nota_itens?select=*&data=gte.'+ini+'&limit=5000')}catch(e){}
  const nfCx=new Set(nfs.map(n=>n.caixa_id));
  const nf=nfs.map(n=>({o:'Nota anexa',nome:n.descricao,loja:canonLoja(n.loja),data:String(n.data||'').slice(0,10),forn:n.fornecedor,ref:(cm[n.caixa_id]&&cm[n.caixa_id].titulo)||'Nota',cid:n.caixa_id,doc:n.documento,qtd:Number(n.quantidade)||0,un:unOf(n.unidade),preco:n.preco_unit==null?null:Number(n.preco_unit),valor:Number(n.valor)||0}));
  RAW.ped=ped;RAW.cx=cx.filter(r=>!nfCx.has(r.cid));RAW.nf=nf;RAW.ent=null;
}
async function loadEnt(){
  if(RAW.ent)return;const ini=iniISO();const out=[];
  for(let off=0;;off+=1000){const d=await get('estoque_movimentacoes?select=produto_nome,loja,quantidade,unidade,created_at,nota_fiscal,motivo&tipo=eq.entrada&created_at=gte.'+ini+'&order=created_at.desc&limit=1000&offset='+off);d.forEach(m=>out.push({o:'Entrada estoque',nome:m.produto_nome,loja:canonLoja(m.loja),data:String(m.created_at).slice(0,10),forn:m.motivo||'',ref:m.nota_fiscal?('NF '+m.nota_fiscal):'Entrada',qtd:Number(m.quantidade)||0,un:unOf(m.unidade),preco:null,valor:null}));if(d.length<1000)break}
  RAW.ent=out;
}
function linhas(){
  const src=[...(F.ped?RAW.ped:[]),...(F.nf?RAW.nf:[]),...(F.cx?RAW.cx:[]),...(F.ent&&RAW.ent?RAW.ent:[])];
  const m={};
  src.forEach(r=>{if(F.loja!=='Todas'&&r.loja!==F.loja)return;if(F.busca&&!norm(r.nome).includes(norm(F.busca)))return;
    const k=keyOf(r.nome);const l=m[k]=m[k]||{k,nomes:{},ls:[]};l.nomes[r.nome]=(l.nomes[r.nome]||0)+1;l.ls.push(r)});
  return Object.values(m).map(l=>{
    l.nome=Object.entries(l.nomes).sort((a,b)=>b[1]-a[1])[0][0];
    l.ls.sort((a,b)=>String(b.data).localeCompare(String(a.data)));
    const u={};l.valor=0;l.semPreco=0;
    l.ls.forEach(r=>{const x=u[r.un]=u[r.un]||{q:0,qp:0,v:0};x.q+=r.qtd;if(r.valor!=null){l.valor+=r.valor;if(r.qtd>0){x.qp+=r.qtd;x.v+=r.valor}}else l.semPreco++});
    l.u=u;l.data=l.ls[0].data;
    const ult=l.ls.find(r=>r.preco!=null&&r.qtd>0);l.ult=ult||null;return l}).sort((a,b)=>F.ord==='nome'?a.nome.localeCompare(b.nome):F.ord==='data'?String(b.data).localeCompare(String(a.data)):b.valor-a.valor);
}
const qtdTxt=l=>Object.entries(l.u).filter(([,x])=>x.q>0).map(([u,x])=>nf(x.q)+' '+u).join(' + ')||'—';
const medTxt=l=>{const e=Object.entries(l.u).filter(([,x])=>x.qp>0);return e.length?e.map(([u,x])=>brl(x.v/x.qp)+'/'+u).join('<br>'):'<span class="nop">sem preço</span>'};
function render(){
  const ls=linhas();const tot=ls.reduce((s,l)=>s+l.valor,0);const comp=ls.reduce((s,l)=>s+l.ls.length,0);
  const sel=(id,opts,val,fn)=>`<select onchange="${fn}(this.value)">${opts.map(o=>`<option value="${o[0]}" ${String(o[0])===String(val)?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  let h=`<header><div class="eyebrow">Amore Food · Compras por produto</div><h1>Consumo por Produto${F.loja!=='Todas'?' — '+esc(F.loja):''}</h1><div class="sub">Cada produto comprado, um a um, com preço médio, último preço e data — a partir dos Pedidos de Compra e dos Caixas das prestações${F.ent?' e das Entradas de estoque':''}.</div></header>
  <div class="bar">${sel('l',LOJAS.map(x=>[x,x==='Todas'?'Todas as lojas':x]),F.loja,'setL')}${sel('d',[[30,'Últimos 30 dias'],[60,'Últimos 60 dias'],[90,'Últimos 90 dias'],[180,'Últimos 180 dias'],[365,'Último ano'],[0,'Tudo']],F.dias,'setD')}${sel('o',[['valor','Maior valor'],['nome','A–Z'],['data','Mais recente']],F.ord,'setO')}
  <input type="search" placeholder="Buscar produto (ex.: tilápia, linguado)…" value="${esc(F.busca)}" oninput="setB(this.value)" id="bs"></div>
  <div class="bar"><span class="mut" style="font-size:12px">Origem:</span><button class="chip ${F.ped?'on':''}" onclick="tgO('ped')">Pedidos de compra</button><button class="chip ${F.cx?'on':''}" onclick="tgO('cx')">Caixas / prestações</button><button class="chip ${F.nf?'on':''}" onclick="tgO('nf')">Notas dos anexos (itens)</button><button class="chip ${F.ent?'on':''}" onclick="tgO('ent')">Entradas de estoque (só qtd)</button>
  <span style="margin-left:auto"></span><button class="btn" onclick="csv()">⬇ CSV</button></div>
  <div class="kpis"><div class="kpi"><div class="kn">${ls.length}</div><div class="kl">Produtos</div></div><div class="kpi"><div class="kn">${comp}</div><div class="kl">Linhas de compra</div></div><div class="kpi"><div class="kn">${brl(tot)}</div><div class="kl">Valor com preço</div></div></div>`;
  if(!ls.length)h+='<div class="msg">Nenhum produto com esses filtros.</div>';
  else{h+='<div class="tw"><table><thead><tr><th>Produto</th><th>Quantidade</th><th>Preço médio</th><th>Último preço</th><th>Última compra</th><th>Compras</th><th class="num">Valor</th></tr></thead><tbody>';
    ls.forEach(l=>{const op=ABERTO===l.k;
      h+=`<tr class="it" data-k="${esc(l.k)}" onclick="tg(this.dataset.k)"><td><b>${op?'▾':'▸'} ${esc(l.nome)}</b></td><td>${qtdTxt(l)}</td><td>${medTxt(l)}</td><td>${l.ult?brl(l.ult.preco)+'/'+l.ult.un:'—'}</td><td>${dmy(l.data)}</td><td>${l.ls.length}x</td><td class="num"><b>${l.valor?brl(l.valor):'—'}</b></td></tr>`;
      if(op)h+=`<tr><td colspan="7" class="det"><table><thead><tr><th>Data</th><th>Loja</th><th>Origem</th><th>Fornecedor</th><th class="num">Qtd</th><th class="num">Preço unit.</th><th class="num">Total</th></tr></thead><tbody>${l.ls.map(r=>`<tr><td>${dmy(r.data)}</td><td>${esc(r.loja)}</td><td><span class="tag">${r.o}</span> ${r.cid?`<a href="caixa.html?id=${r.cid}" style="color:var(--vinho)">${esc(r.ref)}</a>`:esc(r.ref)}${r.nome!==l.nome?`<div class="mut">${esc(r.nome)}</div>`:''}</td><td>${esc(r.forn||'—')}</td><td class="num">${r.qtd?nf(r.qtd)+' '+r.un:'s/ qtd'}</td><td class="num">${r.preco!=null?brl(r.preco)+'/'+r.un:'<span class="nop">sem preço</span>'}</td><td class="num">${r.valor!=null?brl(r.valor):'—'}</td></tr>`).join('')}</tbody></table></td></tr>`});
    h+='</tbody></table></div>'}
  document.getElementById('app').innerHTML=h;
  if(F.busca){const i=document.getElementById('bs');i.focus();i.setSelectionRange(F.busca.length,F.busca.length)}
}
function csv(){const rows=[['Produto','Loja','Origem','Referência','Fornecedor','Data','Quantidade','Unidade','Preço unitário','Total']];
  linhas().forEach(l=>l.ls.forEach(r=>rows.push([r.nome,r.loja,r.o,r.ref,r.forn||'',dmy(r.data),String(r.qtd).replace('.',','),r.un,r.preco==null?'':r.preco.toFixed(2).replace('.',','),r.valor==null?'':r.valor.toFixed(2).replace('.',',')])));
  const t=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv;charset=utf-8'}));a.download='consumo-por-produto.csv';a.click()}
window.tg=k=>{ABERTO=ABERTO===k?null:k;render()};
window.setB=v=>{F.busca=v;ABERTO=null;render()};
window.setL=v=>{F.loja=v;ABERTO=null;render()};
window.setO=v=>{F.ord=v;render()};
window.setD=async v=>{F.dias=parseInt(v,10);await go()};
window.tgO=async k=>{F[k]=!F[k];if(k==='ent'&&F.ent){await withMsg(loadEnt)}render()};
async function withMsg(fn){document.getElementById('app').innerHTML='<div class="msg">Carregando…</div>';try{await fn()}catch(e){fail(e)}}
function fail(e){document.getElementById('app').innerHTML='<div class="msg">Erro ao carregar.<br><small>'+esc(String(e))+'</small></div>'}
async function go(){document.getElementById('app').innerHTML='<div class="msg">Consolidando as compras por produto…</div>';try{await loadBase();if(F.ent)await loadEnt();render()}catch(e){fail(e)}}
go();
</script>
</body>
</html>
