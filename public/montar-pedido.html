<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gestão da Lista de Compras</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--v:#2E7D34;--v2:#256A2A;--bg:#eef6ec;--card:#fff;--border:#d7e6d3;--muted:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:#1f2937;padding:14px}
  .wrap{max-width:1240px;margin:0 auto}
  .hdr{background:linear-gradient(135deg,var(--v2),#6DC06A);color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hdr h1{font-size:19px;font-weight:800}.hdr .sub{font-size:12px;opacity:.92}
  .hdr .lojasel{margin-left:auto;display:flex;gap:8px;align-items:center}
  .hdr select{border:none;border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;font-size:13px}
  .hdr button{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .kpi .n{font-size:21px;font-weight:800}.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase}
  .kpi.ok .n{color:#15803D}.kpi.wr .n{color:#B45309}.kpi.no .n{color:#DC2626}.kpi.tt .n{color:#0369A1}
  .alert{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .alert b{color:#B91C1C}.alert .items{font-size:12.5px;color:#7f1d1d;margin-top:6px;line-height:1.7}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .btn{border:none;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
  .btn-save{background:#0369A1;color:#fff}.btn-fire{background:var(--v);color:#fff}.btn-pdf{background:#fff;color:#374151;border:1px solid #cbd5e1}
  .btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
  .seg button{border:none;background:#fff;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer;color:#374151}
  .seg button.on{background:var(--v);color:#fff;font-weight:700}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12px;min-width:1120px}
  th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap;background:#f6faf5;position:sticky;top:0}
  td{padding:5px 6px;border-bottom:1px solid #f1f5f0;vertical-align:middle}
  tr.cat td{background:#eaf6e8;color:var(--v);font-weight:700;font-size:11px;text-transform:uppercase}
  input{width:100%;border:1px solid transparent;border-radius:7px;padding:6px 7px;font:inherit;font-size:12px;background:#f4f7f3}
  input:focus{outline:none;border-color:var(--v);background:#fff}
  .num{width:58px}.pri{width:78px}.wpp{width:118px}.val{width:90px}.cin{width:150px}
  .st{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .st.ok{background:#DCFCE7;color:#15803D}.st.wr{background:#FEF3C7;color:#B45309}.st.no{background:#FEE2E2;color:#DC2626}
  .q{color:#9ca3af;font-size:10px}
  .msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-size:13px;display:none}
  .msg.ok{background:#DCFCE7;color:#15803D;display:block}.msg.err{background:#FEE2E2;color:#DC2626;display:block}
  .prog{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px;font-size:12.5px;display:none}
  .prog .ln{padding:3px 0;border-bottom:1px solid #f1f5f0}
  .foot{color:var(--muted);font-size:11px;margin:12px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div><h1>🛒 Gestão da Lista de Compras</h1><div class="sub">Requisição × pedidos da semana — o que já comprou e o que falta</div></div>
    <div class="lojasel">
      <select id="loja" onchange="trocaLoja()">
        <option value="Flow CD">Flow CD</option>
        <option value="Amore CD">Amore CD</option>
        <option value="Amore Paiva">Amore Paiva</option>
      </select>
      <select id="periodo" onchange="load()" title="Período dos pedidos considerados">
        <option value="7">📅 Semana (7 dias)</option>
        <option value="15">Últimos 15 dias</option>
        <option value="30">Últimos 30 dias</option>
        <option value="req">Desde a requisição</option>
        <option value="0">Todos os pedidos</option>
      </select>
      <button onclick="load()">↻ Atualizar</button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="alert" id="alert" style="display:none"></div>
  <div class="bar">
    <span class="seg" id="seg">
      <button data-f="" class="on" onclick="setF('')">Todos</button>
      <button data-f="no" onclick="setF('no')">❌ Faltando</button>
      <button data-f="parcial" onclick="setF('parcial')">🟠 Parcial</button>
      <button data-f="ok" onclick="setF('ok')">✅ Comprados</button>
    </span>
    <button class="btn btn-save" onclick="salvar()">💾 Salvar / dar baixa</button>
    <button class="btn" style="background:#15803D;color:#fff" onclick="confirmarTodas()">✅ Confirmar todas</button>
    <button class="btn btn-pdf" onclick="gerarPDF()">📄 Gerar PDF</button>
    <button class="btn btn-fire" onclick="disparar()">📲 Disparar faltantes</button>
    <button class="btn" style="background:#6b1212;color:#fff" onclick="fecharRequisicao()">🔒 Fechar requisição</button>
    <button class="btn" style="background:#fff;color:#374151;border:1px solid #cbd5e1" onclick="verPedidos()">🧾 Pedidos da semana</button>
    <button class="btn" style="background:#fff;color:#374151;border:1px solid #cbd5e1" onclick="verBaixadas()">📁 Requisições baixadas</button>
  </div>
  <div class="card" id="mainCard"><table><thead><tr>
    <th>Produto solicitado</th><th>Qtd solic.</th><th>Comprado</th><th>Falta</th><th>Status ✔</th><th>Valor unit.</th><th>Valor total</th><th>Fornecedor</th>
    <th>Entrega</th><th>Data pedido</th><th>Pedido</th>
  </tr></thead><tbody id="tb"><tr><td colspan="9" style="padding:20px;text-align:center;color:#6b7280">Carregando…</td></tr></tbody></table></div>
  <div class="card" id="baixadasBox" style="display:none;margin-top:12px"></div>
  <div class="card" id="pedidosBox" style="display:none;margin-top:12px"></div>
  <div class="msg" id="msg"></div><div class="prog" id="prog"></div><div class="foot" id="foot"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'};
const SUF={'Flow CD':'flow','Amore CD':'amore_cd','Amore Paiva':'amore_paiva'};
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const STOP=new Set(['de','do','da','com','sem','em','kg','g','l','ml','un','und','unidade','unidades','pct','pacote','pacotes','caixa','cx','bandeja','fardo','fardos','rolo','balde','saco','sacos','tipo','para','no','na','e','garrafa','garrafas','grades']);
const toks=s=>norm(s).split(' ').filter(w=>w.length>=3&&!STOP.has(w)&&!/^\d+$/.test(w));
const nb=n=>Number(String(n).replace(',','.'))||0;
const brl=n=>'R$ '+nb(n).toFixed(2).replace('.',',');
const dmy=s=>{if(!s)return '';const p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(s);};
const diasAtras=s=>{if(!s)return null;const d=new Date(String(s).slice(0,10));if(isNaN(d))return null;return Math.floor((Date.now()-d.getTime())/864e5);};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nomeLoja=l=>({'Amore CD':'Amore Costa Dourada','Amore Paiva':'Amore Paiva','Flow CD':'Flow Costa Dourada'})[l]||l;
function show(m,ok){const e=el('msg');e.textContent=m;e.className='msg '+(ok?'ok':'err');}
function lojaMatch(pedLoja,sel){pedLoja=pedLoja||'';if(sel==='Flow CD')return /flow/i.test(pedLoja);if(sel==='Amore CD')return pedLoja==='Amore CD'||/amore costa dourada/i.test(pedLoja);if(sel==='Amore Paiva')return pedLoja==='Amore Paiva';return false;}
let LOJA='Flow CD',SOLIC=[],OVER={},COMPRADOS=[],TOTALPED=0,FILTRO='',ROWS=[],REQNUM=null,REQID='',REQIDS=[],REQINFO='',REQDATE='',OVKEY='',VIEW='gestao',PERLABEL='',NPED=0,PEDLIST=[];
// chave semanal (ISO week) — baixas valem por semana e renovam sozinhas na semana seguinte
function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));const wk=Math.ceil(((d-y0)/864e5+1)/7);return d.getUTCFullYear()+'w'+String(wk).padStart(2,'0');}

function trocaLoja(){LOJA=el('loja').value;load();}
try{const pp=localStorage.getItem('gestao_periodo');if(pp&&el('periodo'))el('periodo').value=pp;}catch(e){}
async function load(){
  const suf=SUF[LOJA];let ped=[],ov={},solItens=[];
  REQNUM=null;REQID='';REQIDS=[];REQINFO='';VIEW='gestao';
  { const mc=el('mainCard'),bb=el('baixadasBox'),pb=el('pedidosBox'); if(mc)mc.style.display=''; if(bb)bb.style.display='none'; if(pb)pb.style.display='none'; }
  // FONTE = TODAS as requisições ABERTAS da loja (status≠concluida) consolidadas — a semana inteira,
  // não só a mais recente. Itens repetidos entre requisições são somados.
  try{
    const rs=await (await fetch(SB+'/rest/v1/requisicoes?loja=eq.'+encodeURIComponent(LOJA)+'&status=neq.concluida&order=numero.asc&select=id,numero,responsavel_nome,created_at',{headers:H})).json();
    if(rs&&rs.length){
      REQIDS=rs.map(r=>r.id); REQID=rs[0].id; REQNUM=rs[rs.length-1].numero;
      REQDATE=String(rs[0].created_at||'').slice(0,10); // a mais antiga aberta = início da semana de compras
      const nums=rs.map(r=>'REQ-'+String(r.numero).padStart(4,'0'));
      REQINFO=(rs.length>1?rs.length+' requisições abertas: ':'')+nums.join(', ')+(rs.length===1&&rs[0].responsavel_nome?' · '+rs[0].responsavel_nome:'');
      const idIn='('+rs.map(r=>r.id).join(',')+')';
      const its=await (await fetch(SB+'/rest/v1/requisicao_itens?requisicao_id=in.'+idIn+'&select=produto_nome,categoria,quantidade,unidade&limit=5000',{headers:H})).json();
      // consolida por nome de produto (soma quantidades quando repetido)
      const acc={};
      for(const i of (its||[])){const k=norm(i.produto_nome);if(!k)continue;
        if(!acc[k]){acc[k]={produto:i.produto_nome,qtd:Number(i.quantidade)||0,un:i.unidade,categoria:i.categoria};}
        else{acc[k].qtd+=Number(i.quantidade)||0; if(!acc[k].categoria&&i.categoria)acc[k].categoria=i.categoria; if(!acc[k].un&&i.unidade)acc[k].un=i.unidade;}
      }
      solItens=Object.values(acc);
    }
  }catch(e){}
  // fallback: solicitação antiga (app_config) se a loja ainda não tiver requisição
  if(!solItens.length){ try{ const sol=((await (await fetch(SB+'/rest/v1/app_config?chave=eq.compras_solicitacao_'+suf+'&select=valor',{headers:H})).json())[0]||{}).valor||{}; solItens=sol.itens||[]; }catch(e){} }
  SOLIC=solItens;
  // overrides por SEMANA (loja+semana ISO) — as baixas valem a semana toda e renovam sozinhas na próxima
  OVKEY='compras_overrides_'+suf+'_'+isoWeek(new Date());
  try{ped=await (await fetch(SB+'/rest/v1/app_config?select=chave,valor&chave=like.pedido_*&limit=2000',{headers:H})).json();}catch(e){}
  try{ov=((await (await fetch(SB+'/rest/v1/app_config?chave=eq.'+OVKEY+'&select=valor',{headers:H})).json())[0]||{}).valor||{};}catch(e){}
  OVER=ov.map||{};
  // Período dos pedidos considerados — padrão: últimos 7 dias (a semana). Assim TODOS os pedidos da semana
  // aparecem juntos (o novo soma aos anteriores), em vez de só os da data da requisição.
  const perv=(el('periodo')&&el('periodo').value)||'7';
  let CORTE;
  if(perv==='req'){ CORTE=REQDATE||new Date().toISOString().slice(0,10); }
  else if(perv==='0'){ CORTE='0000-00-00'; }
  else { const d=new Date(); d.setDate(d.getDate()-Number(perv)); CORTE=d.toISOString().slice(0,10); }
  PERLABEL=perv==='req'?('desde a requisição ('+dmy(CORTE)+')'):perv==='0'?'todos os pedidos':('desde '+dmy(CORTE));
  try{localStorage.setItem('gestao_periodo',perv);}catch(e){}
  const pedData=r=>String((r.valor&&(r.valor.em||r.valor.data))||'').slice(0,10);
  const doL=(ped||[]).filter(r=>r.valor&&lojaMatch(r.valor.loja,LOJA)&&pedData(r)>=CORTE);
  TOTALPED=doL.reduce((s,r)=>s+(Number(r.valor.total)||0),0);NPED=doL.length;
  COMPRADOS=[];for(const r of doL)for(const it of (r.valor.itens||[])){if(/^desconto$|^frete|^adicional/i.test(it.produto||''))continue;COMPRADOS.push({fornecedor:r.valor.fornecedor,produto:it.produto,qtd:it.qtd,un:it.un,subtotal:Number(it.subtotal)||0,preco:Number(it.preco)||0,entrega:r.valor.janela_entrega||r.valor.data||'',dataPedido:r.valor.em||r.valor.data||'',comprador:r.valor.created_by||'',chave:r.chave,recebido:!!r.valor.recebimento,norm:norm(it.produto)});}
  // lista de pedidos do período (para a aba "Pedidos da semana")
  PEDLIST=doL.map(r=>({chave:r.chave,forn:r.valor.fornecedor||'—',em:pedData(r),total:Number(r.valor.total)||0,nItens:(r.valor.itens||[]).filter(it=>!/^desconto$|^frete|^adicional/i.test(it.produto||'')).length,recebido:!!r.valor.recebimento,itens:(r.valor.itens||[]),link:'pedido.html?p='+String(r.chave).replace(/^pedido_/,'')})).sort((a,b)=>a.em<b.em?1:-1);
  compute();render();
}
function matchOne(prod){const st=toks(prod);if(!st.length)return{status:'no'};const main=st.slice().sort((a,b)=>b.length-a.length)[0];let best=null,bs=0,qsum=0,vsum=0,forns=new Set();for(const c of COMPRADOS){if(!c.norm.includes(main))continue;let sc=0;for(const t of st)if(c.norm.includes(t))sc++;if(sc>0){qsum+=Number(c.qtd)||0;vsum+=c.subtotal;forns.add(c.fornecedor);}if(sc>bs){bs=sc;best=c;}}if(!best)return{status:'no'};return{status:bs>=st.length?'ok':'wr',best,qsum,vsum,forns:[...forns]};}
function compute(){ROWS=SOLIC.map(si=>{const m=matchOne(si.produto);const o=OVER[norm(si.produto)]||{};const b=m.best||{};return {...si,m,
  _key:norm(si.produto),_op:si.produto,_oq:si.qtd,_ou:si.un,
  produto:(o.produto!=null?o.produto:si.produto),qtd:(o.qtd!=null?o.qtd:si.qtd),un:(o.un!=null?o.un:si.un),
  qComprada:(o.qComprada!=null?o.qComprada:(m.qsum?m.qsum:'')),
  manual:(typeof o.comprado==='boolean'?o.comprado:undefined),
  forn:(o.forn!=null?o.forn:(m.forns&&m.forns.length?m.forns.join(', '):'')),
  wpp:o.whatsapp||'',
  vUnit:(o.vUnit!=null?o.vUnit:(b.preco?String(b.preco).replace('.',','):'')),
  vTotal:(o.vTotal!=null?o.vTotal:(m.vsum?m.vsum.toFixed(2).replace('.',','):'')),
  entrega:(o.entrega!=null?o.entrega:(b.entrega?dmy(b.entrega):'')),
  dataPed:(o.dataPed!=null?o.dataPed:(b.dataPedido?dmy(b.dataPedido):'')),
  diasPed:diasAtras(b.dataPedido),
  link:(b.chave?('pedido.html?p='+String(b.chave).replace(/^pedido_/,'')):''),
  recebido:!!b.recebido, comprador:b.comprador||''
};});}
function eff(r){
  if(r.manual===false)return 'no';
  const qs=nb(r.qtd),qc=nb(r.qComprada);
  if(qc<=0)return (r.manual===true)?'ok':(r.m.status==='no'?'no':(r.m.status||'no'));
  if(qs>0&&qc<qs)return 'parcial';   // comprou menos que o solicitado = PARCIAL (mesmo confirmado)
  return 'ok';
}
function falta(r){const f=nb(r.qtd)-nb(r.qComprada);return f>0?f:0;}
function compEm(r){return r.compradoEm!=null?r.compradoEm:(r.m.forns?r.m.forns.join(', '):'');}
function valorC(r){return r.valor!=null&&r.valor!==''?nb(r.valor):(r.m.vsum||0);}
function setF(f){FILTRO=f;[...document.querySelectorAll('#seg button')].forEach(b=>b.classList.toggle('on',b.dataset.f===f));render();}
function render(){
  const sub=document.querySelector('.hdr .sub'); if(sub) sub.textContent=(REQINFO?'Requisição ativa: '+REQINFO:'Sem requisição para esta loja')+' × '+NPED+' pedido(s) '+(PERLABEL||'')+' — o que já comprou e o que falta';
  const nOk=ROWS.filter(r=>eff(r)==='ok').length,nWr=ROWS.filter(r=>eff(r)==='parcial').length,nNo=ROWS.filter(r=>eff(r)==='no').length;
  el('kpis').innerHTML=`<div class="kpi"><div class="n">${ROWS.length}</div><div class="l">Solicitados</div></div><div class="kpi ok"><div class="n">${nOk}</div><div class="l">Comprados</div></div><div class="kpi wr"><div class="n">${nWr}</div><div class="l">🟠 Parcial</div></div><div class="kpi no"><div class="n">${nNo}</div><div class="l">Faltando</div></div><div class="kpi tt"><div class="n">${brl(TOTALPED)}</div><div class="l">Comprado · ${NPED} pedido(s)</div></div>`;
  const falt=ROWS.filter(r=>eff(r)==='no');
  el('alert').style.display=falt.length?'block':'none';
  el('alert').innerHTML=`<b>⚠️ Faltando comprar: ${falt.length} item(ns)</b><div class="items">${falt.map(r=>`${esc(r.produto)} <span style="opacity:.7">(${esc(r.qtd)} ${esc(r.un)})</span>`).join(' · ')}</div>`;
  const list=ROWS.filter(r=>!FILTRO||eff(r)===FILTRO);
  // agrupa por categoria (uma categoria = um bloco só), mantendo a ordem de 1ª aparição
  const catOrder=[]; ROWS.forEach(r=>{const c=r.categoria||'—'; if(!catOrder.includes(c))catOrder.push(c);});
  list.sort((a,b)=>(catOrder.indexOf(a.categoria||'—')-catOrder.indexOf(b.categoria||'—')));
  const badge=s=>s==='ok'?'<span class="st ok">✅ Comprado</span>':s==='parcial'?'<span class="st wr">🟠 Parcial</span>':s==='wr'?'<span class="st wr">⚠️ Verificar</span>':'<span class="st no">❌ Faltando</span>';
  let cur='',html='';
  const inp=(gi,k,val,ph,cls)=>`<input class="${cls||''}" value="${esc(val)}" onchange="ov(${gi},'${k}',this.value)" placeholder="${ph||''}">`;
  for(const r of list){const gi=ROWS.indexOf(r);
    if((r.categoria||'')!==cur){cur=r.categoria||'';html+=`<tr class="cat"><td colspan="11">${esc(cur||'—')}</td></tr>`;}
    const conf=r.recebido?' <span class="st ok" style="font-size:9px;padding:1px 6px">✓ conf.</span>':'';
    const oldTag=(r.diasPed!=null&&r.diasPed>7)?`<span title="pedido com ${r.diasPed} dias — pode ser antigo" style="color:#B45309">⏳</span> `:'';
    const f=falta(r);
    html+=`<tr>
      <td><input value="${esc(r.produto)}" onchange="ov(${gi},'produto',this.value)" placeholder="produto" style="width:100%"></td>
      <td class="q"><input value="${esc(r.qtd)}" onchange="ov(${gi},'qtd',this.value)" style="width:44px"> <input value="${esc(r.un)}" onchange="ov(${gi},'un',this.value)" placeholder="un" style="width:64px"></td>
      <td class="q"><input value="${esc(r.qComprada)}" onchange="ov(${gi},'qComprada',this.value)" placeholder="0" style="width:52px" title="Quantidade já comprada"></td>
      <td class="q" style="font-weight:800;color:${f>0?'#DC2626':'#15803D'}">${nb(r.qComprada)>0||r.manual!=null?f:''}</td>
      <td style="white-space:nowrap"><label style="cursor:pointer;display:inline-flex;align-items:center;gap:5px"><input type="checkbox" ${eff(r)==='ok'?'checked':''} onchange="setComprado(${gi},this.checked)" title="Confirmar compra / dar baixa">${badge(eff(r))}</label>${conf}${r.manual!=null?' <span class="q">(man.)</span>':''}</td>
      <td>${inp(gi,'vUnit',r.vUnit,'0,00','pri')}</td>
      <td>${inp(gi,'vTotal',r.vTotal,'0,00','val')}</td>
      <td>${inp(gi,'forn',r.forn,'fornecedor','cin')}${eff(r)==='no'?inp(gi,'wpp',r.wpp,'WhatsApp','wpp'):''}</td>
      <td>${inp(gi,'entrega',r.entrega,'dd/mm/aaaa','pri')}</td>
      <td>${oldTag}${inp(gi,'dataPed',r.dataPed,'dd/mm/aaaa','pri')}</td>
      <td>${r.link?`<a href="${r.link}" target="_blank" style="color:var(--v);font-weight:700">ver</a>`:''}</td>
    </tr>`;}
  el('tb').innerHTML=html||'<tr><td colspan="11" style="padding:20px;text-align:center;color:#6b7280">Nenhum item neste filtro.</td></tr>';
  const prontos=new Set(ROWS.filter(r=>eff(r)!=='ok'&&(r.wpp||'').replace(/\D/g,'').length>=10&&r.forn.trim()).map(r=>r.forn.trim().toLowerCase()));
  el('foot').textContent=`${REQINFO?REQINFO+' · ':''}${LOJA} · ${ROWS.length} solicitados · ${nNo} faltando · ${NPED} pedido(s) ${PERLABEL||''} · total comprado ${brl(TOTALPED)} · ${prontos.size} fornecedor(es) p/ disparo`;
}
function ov(i,k,v){ROWS[i][k]=v; if(k==='vUnit'||k==='qComprada'){ const r=ROWS[i]; const t=nb(r.vUnit)*nb(r.qComprada); r.vTotal=t?String(t.toFixed(2)).replace('.',','):''; render(); } }
function setComprado(i,checked){const r=ROWS[i];if(checked){r.manual=true;if(r.qComprada===''||nb(r.qComprada)<nb(r.qtd))r.qComprada=r.qtd;const t=nb(r.vUnit)*nb(r.qComprada);if(t)r.vTotal=String(t.toFixed(2)).replace('.',',');}else{r.manual=undefined;}render();}
async function salvar(silent){const map={};for(const r of ROWS){const o={};if(r.produto!==r._op)o.produto=r.produto;if(String(r.qtd)!==String(r._oq))o.qtd=r.qtd;if(r.un!==r._ou)o.un=r.un;if(r.qComprada!==''&&String(r.qComprada)!==String(r.m.qsum||''))o.qComprada=r.qComprada;if((r.forn||'')!=='')o.forn=r.forn;if(r.wpp)o.whatsapp=r.wpp;if((r.vUnit||'')!=='')o.vUnit=r.vUnit;if((r.vTotal||'')!=='')o.vTotal=r.vTotal;if((r.entrega||'')!=='')o.entrega=r.entrega;if((r.dataPed||'')!=='')o.dataPed=r.dataPed;if(typeof r.manual==='boolean')o.comprado=r.manual;if(Object.keys(o).length)map[r._key||norm(r.produto)]=o;}
  const chave=OVKEY||('compras_overrides_'+SUF[LOJA]);
  try{let ex=await fetch(SB+'/rest/v1/app_config?chave=eq.'+chave+'&select=chave',{headers:H}).then(r=>r.json());const body={valor:{map,updated_at:new Date().toISOString()}};let r;
    if(ex&&ex.length)r=await fetch(SB+'/rest/v1/app_config?chave=eq.'+chave,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(body)});
    else r=await fetch(SB+'/rest/v1/app_config',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates'},body:JSON.stringify({chave,...body})});
    if(r.ok){ if(!silent){ setF('no'); show('✅ Salvo e baixado. Mostrando o que ainda falta comprar.',true); } } else if(!silent){ show('Falha ao salvar ('+r.status+').',false); } return r.ok; }catch(e){ if(!silent)show('Falha ao salvar.',false); return false; }
}
async function confirmarTodas(){
  const alvo=ROWS.filter(r=>eff(r)!=='no').length;
  if(!alvo){show('Nenhuma compra para confirmar (nada casou com os pedidos).',false);return;}
  if(!confirm(`Confirmar / dar baixa em ${alvo} item(ns) já comprado(s)?`))return;
  ROWS.forEach(r=>{ if(r.m.status!=='no') r.manual=true; });
  const ok=await salvar(true); render(); show(ok?`✅ ${alvo} compra(s) confirmada(s) e baixada(s).`:'Falha ao salvar.',ok);
}
async function fecharRequisicao(){
  if(!REQIDS.length){show('Não há requisição aberta para fechar.',false);return;}
  const pend=ROWS.filter(r=>eff(r)==='no'||eff(r)==='parcial').length;
  const quantas=REQIDS.length>1?`as ${REQIDS.length} requisições abertas`:`a requisição ${REQINFO}`;
  if(!confirm(`Fechar e baixar ${quantas} desta loja?`+(pend?`\n\n⚠️ Ainda há ${pend} item(ns) faltando/parcial.`:'\n\nTodos os itens foram comprados. 🎉')))return;
  await salvar(true);
  try{const idIn='('+REQIDS.join(',')+')';
    const r=await fetch(SB+'/rest/v1/requisicoes?id=in.'+idIn,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({status:'concluida'})});
    if(r.ok){show('🔒 Requisição(ões) baixada(s). Atualizando…',true);setTimeout(load,700);}else show('Falha ao fechar ('+r.status+').',false);
  }catch(e){show('Falha ao fechar a requisição.',false);}
}
function verPedidos(){
  const mc=el('mainCard'),bb=el('baixadasBox'),pb=el('pedidosBox');
  VIEW=VIEW==='pedidos'?'gestao':'pedidos';
  bb.style.display='none';
  if(VIEW==='gestao'){pb.style.display='none';mc.style.display='';return;}
  const stTag=r=>r.recebido?'<span class="st ok">✓ recebido</span>':'<span class="st wr">🟠 em aberto</span>';
  const linhas=PEDLIST.map((p,i)=>{
    const its=(p.itens||[]).filter(it=>!/^desconto$|^frete|^adicional/i.test(it.produto||''))
      .map(it=>`<div style="padding:2px 0;border-bottom:1px dashed #eef2ee">• ${esc(it.qtd||'')} ${esc(it.un||'')} — <b>${esc(it.produto)}</b>${it.subtotal?` <span class="q">(${brl(it.subtotal)})</span>`:''}</div>`).join('');
    return `<tr>
      <td style="font-weight:700">${esc(p.forn)}</td>
      <td class="q">${dmy(p.em)}</td>
      <td class="q" style="text-align:center">${p.nItens}</td>
      <td style="font-weight:700;color:var(--v)">${brl(p.total)}</td>
      <td>${stTag(p)}</td>
      <td><a href="${p.link}" target="_blank" style="color:var(--v);font-weight:700">abrir</a></td>
      <td><button class="btn" style="padding:4px 9px;background:#fff;color:#374151;border:1px solid #cbd5e1" onclick="var d=document.getElementById('pdit${i}');d.style.display=d.style.display==='none'?'':'none'">itens ▾</button></td>
    </tr>
    <tr id="pdit${i}" style="display:none"><td colspan="7" style="background:#f6faf5;font-size:11.5px">${its||'<span class=q>sem itens</span>'}</td></tr>`;
  }).join('')||'<tr><td colspan="7" style="padding:16px;text-align:center;color:#6b7280">Nenhum pedido no período selecionado.</td></tr>';
  const totRec=PEDLIST.filter(p=>p.recebido).length,totAb=PEDLIST.length-totRec;
  pb.innerHTML=`<div style="padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px"><b>🧾 Pedidos ${esc(PERLABEL||'')}</b> · ${PEDLIST.length} pedido(s) · <span style="color:#B45309">${totAb} em aberto</span> · <span style="color:#15803D">${totRec} recebido(s)</span> · total ${brl(TOTALPED)}</div>
  <table style="min-width:640px"><thead><tr><th>Fornecedor</th><th>Data</th><th>Itens</th><th>Valor</th><th>Status</th><th>Pedido</th><th></th></tr></thead><tbody>${linhas}</tbody></table>`;
  mc.style.display='none';pb.style.display='';el('foot').textContent=LOJA+' · '+PEDLIST.length+' pedido(s) '+(PERLABEL||'');
}
async function verBaixadas(){
  const mc=el('mainCard'),bb=el('baixadasBox'),pb=el('pedidosBox'); if(pb)pb.style.display='none';
  VIEW=VIEW==='baixadas'?'gestao':'baixadas';
  if(VIEW==='gestao'){bb.style.display='none';mc.style.display='';return;}
  let rows=[];try{rows=await (await fetch(SB+'/rest/v1/requisicoes?loja=eq.'+encodeURIComponent(LOJA)+'&status=eq.concluida&order=numero.desc&select=id,numero,responsavel_nome,created_at,updated_at',{headers:H})).json();}catch(e){}
  const body=(rows||[]).map(q=>`<tr><td style="font-weight:700;color:var(--v)">REQ-${String(q.numero).padStart(4,'0')}</td><td>${esc(q.responsavel_nome||'—')}</td><td class="q">${dmy(q.created_at)}</td><td class="q">${dmy(q.updated_at)}</td><td><a href="requisicao.html?id=${q.id}" target="_blank" style="color:var(--v);font-weight:700">ver</a></td><td><button class="btn" style="padding:4px 10px;background:#fff;color:#374151;border:1px solid #cbd5e1" onclick="reabrir('${q.id}')">↩︎ Reabrir</button></td></tr>`).join('')||'<tr><td colspan="6" style="padding:16px;text-align:center;color:#6b7280">Nenhuma requisição baixada nesta loja.</td></tr>';
  bb.innerHTML=`<table style="min-width:0"><thead><tr><th>Requisição</th><th>Solicitante</th><th>Criada</th><th>Baixada</th><th>Ver</th><th></th></tr></thead><tbody>${body}</tbody></table>`;
  mc.style.display='none';bb.style.display='';el('foot').textContent=LOJA+' · '+(rows||[]).length+' requisição(ões) baixada(s)';
}
async function reabrir(id){ if(!confirm('Reabrir esta requisição? Ela volta para a gestão ativa.'))return; try{await fetch(SB+'/rest/v1/requisicoes?id=eq.'+id,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({status:'enviada'})});}catch(e){} VIEW='gestao'; load(); }
function gerarPDF(){
  try{const J=window.jspdf&&window.jspdf.jsPDF;if(!J){show('PDF carregando, tente de novo.',false);return;}
    const doc=new J({orientation:'landscape',unit:'pt',format:'a4'});
    doc.setFontSize(14);doc.setTextColor(46,125,52);doc.text('Lista de Compras — '+nomeLoja(LOJA),40,36);
    doc.setFontSize(9);doc.setTextColor(120);doc.text('Gerado em '+new Date().toLocaleString('pt-BR')+'  ·  Total comprado no período: '+brl(TOTALPED),40,50);
    const stTxt=s=>s==='ok'?'Comprado':s==='wr'?'Verificar':'Faltando';
    const list=ROWS.filter(r=>!FILTRO||eff(r)===FILTRO);
    const body=list.map(r=>[r.produto||'',((r.qtd||'')+' '+(r.un||'')).trim(),stTxt(eff(r)),r.forn||'',r.vTotal?('R$ '+r.vTotal):'',r.dataPed||'']);
    doc.autoTable({head:[['Produto','Qtd','Status','Fornecedor','Valor total','Data pedido']],body,startY:64,styles:{fontSize:8,cellPadding:3,overflow:'linebreak'},headStyles:{fillColor:[46,125,52],textColor:255},columnStyles:{0:{cellWidth:200}},didParseCell:d=>{if(d.section==='body'&&d.column.index===2){const t=d.cell.raw;if(t==='Faltando')d.cell.styles.textColor=[220,38,38];else if(t==='Comprado')d.cell.styles.textColor=[21,128,61];else if(t==='Verificar')d.cell.styles.textColor=[180,83,9];}}});
    doc.save('lista-compras-'+SUF[LOJA]+'-'+new Date().toISOString().slice(0,10)+'.pdf');
    show('✅ PDF gerado (veja os downloads).',true);
  }catch(e){show('Erro no PDF: '+e.message,false);}
}
async function disparar(){
  const alvos=ROWS.filter(r=>eff(r)!=='ok'&&r.forn.trim()&&(r.wpp||'').replace(/\D/g,'').length>=10);
  const g={};for(const r of alvos){const w=r.wpp.replace(/\D/g,'');const key=r.forn.trim()+'|'+w;(g[key]=g[key]||{forn:r.forn.trim(),wpp:w,itens:[]}).itens.push(r);}
  const gs=Object.values(g);
  if(!gs.length){show('Preencha fornecedor + WhatsApp nos itens faltantes.',false);return;}
  if(!confirm(`Disparar ${gs.length} pedido(s) pela ${nomeLoja(LOJA)}?`))return;
  await salvar();const P=el('prog');P.style.display='block';P.innerHTML='<b>Disparando…</b>';let ok=0,fail=0,prev=-1;
  for(let i=0;i<gs.length;i++){const x=gs[i];let fone=x.wpp;if(fone.length<=11)fone='55'+fone;
    const linhas=x.itens.map(it=>`• ${it.qtd||''} ${it.un||''} — *${it.produto}*`+(String(it.vUnit||'').trim()?` — ${brl(it.vUnit)}`:'')).join('\n');
    const msg=`Olá, ${x.forn}! 👋 Aqui é da *${nomeLoja(LOJA)}*.\n\nSegue nosso *pedido de compra*:\n${linhas}\n\nObrigado! 💚`;
    try{const r=await fetch('/api/evolution-send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:fone,message:msg})});
      if(r.ok){ok++;P.innerHTML+=`<div class="ln">✅ ${esc(x.forn)} (${x.itens.length} itens)</div>`;}else{fail++;P.innerHTML+=`<div class="ln">❌ ${esc(x.forn)} — HTTP ${r.status}</div>`;}}
    catch(e){fail++;P.innerHTML+=`<div class="ln">❌ ${esc(x.forn)} — rede</div>`;}
    if(i<gs.length-1){let d;do{d=rnd(4,9);}while(d===prev);prev=d;P.innerHTML+=`<div class="ln" style="color:#6b7280">aguardando ${d}s…</div>`;await sleep(d*1000);}
  }
  P.innerHTML+=`<div class="ln"><b>Fim — ${ok} enviado(s), ${fail} falha(s).</b></div>`;show(`Disparo: ${ok} enviado(s), ${fail} falha(s).`,fail===0);
}
(function(){const p=(new URLSearchParams(location.search).get('loja')||'').toLowerCase();const map={'flow':'Flow CD','flow-cd':'Flow CD','flow_cd':'Flow CD','amore-cd':'Amore CD','amore_cd':'Amore CD','amore-paiva':'Amore Paiva','amore_paiva':'Amore Paiva'};const v=map[p];if(v){LOJA=v;const s=el('loja');if(s)s.value=v;}})();
load();
</script>
