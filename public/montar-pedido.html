<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gestão da Lista de Compras</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--v:#2E7D34;--v2:#256A2A;--bg:#eef6ec;--card:#fff;--border:#d7e6d3;--muted:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:#1f2937;padding:14px}
  .wrap{max-width:1240px;margin:0 auto}
  .hdr{background:linear-gradient(135deg,var(--v2),#6DC06A);color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hdr h1{font-size:19px;font-weight:800}.hdr .sub{font-size:12px;opacity:.92}
  .hdr .lojasel{margin-left:auto;display:flex;gap:8px;align-items:center}
  .hdr select{border:none;border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;font-size:13px}
  .hdr button{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .kpi .n{font-size:21px;font-weight:800}.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase}
  .kpi.ok .n{color:#15803D}.kpi.wr .n{color:#B45309}.kpi.no .n{color:#DC2626}.kpi.tt .n{color:#0369A1}
  .alert{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .alert b{color:#B91C1C}.alert .items{font-size:12.5px;color:#7f1d1d;margin-top:6px;line-height:1.7}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .btn{border:none;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
  .btn-save{background:#0369A1;color:#fff}.btn-fire{background:var(--v);color:#fff}.btn-pdf{background:#fff;color:#374151;border:1px solid #cbd5e1}
  .btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
  .seg button{border:none;background:#fff;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer;color:#374151}
  .seg button.on{background:var(--v);color:#fff;font-weight:700}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12px;min-width:1120px}
  th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap;background:#f6faf5;position:sticky;top:0}
  td{padding:5px 6px;border-bottom:1px solid #f1f5f0;vertical-align:middle}
  tr.cat td{background:#eaf6e8;color:var(--v);font-weight:700;font-size:11px;text-transform:uppercase}
  input{width:100%;border:1px solid transparent;border-radius:7px;padding:6px 7px;font:inherit;font-size:12px;background:#f4f7f3}
  input:focus{outline:none;border-color:var(--v);background:#fff}
  .num{width:58px}.pri{width:78px}.wpp{width:118px}.val{width:90px}.cin{width:150px}
  .st{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .st.ok{background:#DCFCE7;color:#15803D}.st.wr{background:#FEF3C7;color:#B45309}.st.no{background:#FEE2E2;color:#DC2626}
  .q{color:#9ca3af;font-size:10px}
  .msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-size:13px;display:none}
  .msg.ok{background:#DCFCE7;color:#15803D;display:block}.msg.err{background:#FEE2E2;color:#DC2626;display:block}
  .prog{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px;font-size:12.5px;display:none}
  .prog .ln{padding:3px 0;border-bottom:1px solid #f1f5f0}
  .foot{color:var(--muted);font-size:11px;margin:12px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div><h1>🛒 Gestão da Lista de Compras</h1><div class="sub">Requisição × pedidos da semana — o que já comprou e o que falta</div></div>
    <div class="lojasel">
      <select id="loja" onchange="trocaLoja()">
        <option value="Flow CD">Flow CD</option>
        <option value="Amore CD">Amore CD</option>
        <option value="Amore Paiva">Amore Paiva</option>
      </select>
      <select id="periodo" onchange="onPeriodo()" title="Período dos pedidos considerados">
        <option value="1">Hoje (1 dia)</option>
        <option value="2">Últimos 2 dias</option>
        <option value="3">Últimos 3 dias</option>
        <option value="7">📅 Semana (7 dias)</option>
        <option value="15">Últimos 15 dias</option>
        <option value="30">Últimos 30 dias</option>
        <option value="req">Desde a requisição</option>
        <option value="0">Todos os pedidos</option>
        <option value="custom">🗓️ Personalizado (intervalo)</option>
      </select>
      <span id="rangeBox" style="display:none;gap:6px;align-items:center">
        <input type="date" id="dtDe" onchange="load()" style="border:none;border-radius:8px;padding:7px 9px;font:inherit;font-size:12px">
        <span style="color:#fff;font-size:12px">até</span>
        <input type="date" id="dtAte" onchange="load()" style="border:none;border-radius:8px;padding:7px 9px;font:inherit;font-size:12px">
      </span>
      <button onclick="load()">↻ Atualizar</button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="alert" id="alert" style="display:none"></div>
  <div class="bar" id="barAcoes">
    <span class="seg" id="seg">
      <button data-f="" class="on" onclick="setF('')">Todos</button>
      <button data-f="no" onclick="setF('no')">❌ Faltando</button>
      <button data-f="parcial" onclick="setF('parcial')">🟠 Parcial</button>
      <button data-f="ok" onclick="setF('ok')">✅ Comprados</button>
    </span>
    <button class="btn btn-save" onclick="salvar()">💾 Salvar / dar baixa</button>
    <button class="btn" style="background:#0369A1;color:#fff;font-weight:800" onclick="gerarPedidos()" title="Cria o pedido de compra dos itens marcados (🛒) e envia para o menu Pedidos, onde você confere e clica em Enviar">🧾 Gerar Pedido de Compra</button>
    <button class="btn" style="background:#7C3AED;color:#fff;font-weight:800" onclick="gerarCotacao()" title="Cria uma cotação com os itens marcados (🛒) e envia para o módulo Cotação, para pedir preço aos fornecedores">📋 Gerar Cotação</button>
    <button class="btn" style="background:#15803D;color:#fff" onclick="confirmarTodas()">✅ Confirmar todas</button>
    <button class="btn btn-pdf" onclick="gerarPDF()">📄 Gerar PDF</button>
    <button class="btn btn-fire" onclick="disparar()">📲 Disparar faltantes</button>
    <button class="btn" style="background:#6b1212;color:#fff" onclick="fecharRequisicao()">🔒 Fechar requisição</button>
    <button class="btn" style="background:#fff;color:#374151;border:1px solid #cbd5e1" onclick="verPedidos()">🧾 Pedidos da semana</button>
    <button class="btn" style="background:#15803D;color:#fff;font-weight:800" onclick="verCotacoes()" title="Cotações respondidas pelos fornecedores (com preços) para analisar e gerar o pedido, e as que ainda aguardam resposta">📥 Cotações Recebidas</button>
    <button class="btn" style="background:#fff;color:#374151;border:1px solid #cbd5e1" onclick="verBaixadas()">📁 Requisições baixadas</button>
    <button class="btn" style="background:#C4161C;color:#fff;font-weight:800" onclick="window.open('relatorio-compras-diario.html','_blank')" title="Relatório diário de compras por loja (comprado × falta) com disparo para os gerentes">📊 Relatório Diário</button>
  </div>
  <div class="bar" id="barFiltros" style="gap:8px">
    <input id="fReq" oninput="setBusca()" placeholder="🔎 Nº Requisição (REQ-0125 ou 125)" style="border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:inherit;font-size:12.5px;min-width:220px">
    <input id="fForn" oninput="setBusca()" placeholder="🏢 Fornecedor" style="border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:inherit;font-size:12.5px;min-width:150px">
    <input id="fProd" oninput="setBusca()" placeholder="📦 Produto" style="border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:inherit;font-size:12.5px;min-width:150px">
    <button class="btn" style="background:#fff;color:#374151;border:1px solid #cbd5e1" onclick="limparBusca()">✕ Limpar filtros</button>
    <span id="filtroInfo" style="font-size:12px;color:var(--muted)"></span>
  </div>
  <div class="card" id="mainCard"><table><thead><tr>
    <th style="width:30px" title="Marcar para gerar o pedido de compra">🛒</th>
    <th>Produto solicitado</th><th title="Requisição de compra de origem e o dia em que foi gerada">Requisição · Dia</th><th>Qtd solic.</th><th>Comprado</th><th title="Solicitado − Comprado (ainda falta comprar)">Falta comprar</th><th title="Quantidade já recebida/conferida — vem do Recebimento (entrou no estoque)">Entregue</th><th title="Comprado que ainda não chegou (Comprado − Entregue)">Pendente entrega</th><th>Status ✔</th><th>Valor unit.</th><th>Valor total</th><th>Fornecedor</th>
    <th>Entrega</th><th>Data pedido</th><th>Pedido</th><th style="width:150px">Ações</th>
  </tr></thead><tbody id="tb"><tr><td colspan="16" style="padding:20px;text-align:center;color:#6b7280">Carregando…</td></tr></tbody></table></div>
  <div class="card" id="baixadasBox" style="display:none;margin-top:12px"></div>
  <div class="card" id="pedidosBox" style="display:none;margin-top:12px"></div>
  <div class="card" id="cotacoesBox" style="display:none;margin-top:12px"></div>
  <div class="card" id="cotAnaliseBox" style="display:none;margin-top:12px"></div>
  <div class="msg" id="msg"></div><div class="prog" id="prog"></div><div class="foot" id="foot"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'};
const SUF={'Flow CD':'flow','Amore CD':'amore_cd','Amore Paiva':'amore_paiva'};
const el=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const STOP=new Set(['de','do','da','com','sem','em','kg','g','l','ml','un','und','unidade','unidades','pct','pacote','pacotes','caixa','cx','bandeja','fardo','fardos','rolo','balde','saco','sacos','tipo','para','no','na','e','garrafa','garrafas','grades']);
const toks=s=>norm(s).split(' ').filter(w=>w.length>=3&&!STOP.has(w)&&!/^\d+$/.test(w));
const nb=n=>Number(String(n).replace(',','.'))||0;
const brl=n=>'R$ '+nb(n).toFixed(2).replace('.',',');
const dmy=s=>{if(!s)return '';const p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(s);};
const diasAtras=s=>{if(!s)return null;const d=new Date(String(s).slice(0,10));if(isNaN(d))return null;return Math.floor((Date.now()-d.getTime())/864e5);};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nomeLoja=l=>({'Amore CD':'Amore Costa Dourada','Amore Paiva':'Amore Paiva','Flow CD':'Flow Costa Dourada'})[l]||l;
function show(m,ok){const e=el('msg');e.textContent=m;e.className='msg '+(ok?'ok':'err');}
function lojaMatch(pedLoja,sel){pedLoja=pedLoja||'';if(sel==='Flow CD')return /flow/i.test(pedLoja);if(sel==='Amore CD')return pedLoja==='Amore CD'||/amore costa dourada/i.test(pedLoja);if(sel==='Amore Paiva')return pedLoja==='Amore Paiva';return false;}
let LOJA='Flow CD',SOLIC=[],OVER={},COMPRADOS=[],RECEBIDOS=[],ESTQ={},REL={},TOTALPED=0,FILTRO='',ROWS=[],REQNUM=null,REQID='',REQIDS=[],REQINFO='',REQDATE='',OVKEY='',VIEW='gestao',PERLABEL='',NPED=0,PEDLIST=[],SHOWEXCL=false,FREQ='',FFORN='',FPROD='';
// chave semanal (ISO week) — baixas valem por semana e renovam sozinhas na semana seguinte
function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));const wk=Math.ceil(((d-y0)/864e5+1)/7);return d.getUTCFullYear()+'w'+String(wk).padStart(2,'0');}

function trocaLoja(){LOJA=el('loja').value;load();}
function onPeriodo(){const c=el('periodo').value==='custom';const rb=el('rangeBox');if(rb)rb.style.display=c?'inline-flex':'none';
  if(c){const de=el('dtDe'),ate=el('dtAte');const hoje=new Date().toISOString().slice(0,10);if(ate&&!ate.value)ate.value=hoje;if(de&&!de.value){const d=new Date();d.setDate(d.getDate()-2);de.value=d.toISOString().slice(0,10);}}
  load();}
try{const pp=localStorage.getItem('gestao_periodo');if(pp&&el('periodo')){el('periodo').value=pp;if(pp==='custom'&&el('rangeBox'))el('rangeBox').style.display='inline-flex';}}catch(e){}
async function load(){
  const suf=SUF[LOJA];let ped=[],ov={},solItens=[];
  REQNUM=null;REQID='';REQIDS=[];REQINFO='';VIEW='gestao';
  { const mc=el('mainCard'),bb=el('baixadasBox'),pb=el('pedidosBox'),cb=el('cotacoesBox'); if(mc)mc.style.display=''; if(bb)bb.style.display='none'; if(pb)pb.style.display='none'; if(cb)cb.style.display='none'; gestChrome(true); }
  // FONTE = TODAS as requisições ABERTAS da loja (status≠concluida) consolidadas — a semana inteira,
  // não só a mais recente. Itens repetidos entre requisições são somados.
  try{
    const rs=await (await fetch(SB+'/rest/v1/requisicoes?loja=eq.'+encodeURIComponent(LOJA)+'&status=neq.concluida&order=numero.asc&select=id,numero,responsavel_nome,created_at',{headers:H})).json();
    if(rs&&rs.length){
      REQIDS=rs.map(r=>r.id); REQID=rs[0].id; REQNUM=rs[rs.length-1].numero;
      REQDATE=String(rs[0].created_at||'').slice(0,10); // a mais antiga aberta = início da semana de compras
      const nums=rs.map(r=>'REQ-'+String(r.numero).padStart(4,'0'));
      REQINFO=(rs.length>1?rs.length+' requisições abertas: ':'')+nums.join(', ')+(rs.length===1&&rs[0].responsavel_nome?' · '+rs[0].responsavel_nome:'');
      const reqMap={}; rs.forEach(r=>{reqMap[r.id]={num:r.numero,dt:String(r.created_at||'').slice(0,10)};});
      const idIn='('+rs.map(r=>r.id).join(',')+')';
      const its=await (await fetch(SB+'/rest/v1/requisicao_itens?requisicao_id=in.'+idIn+'&select=id,produto_nome,categoria,quantidade,unidade,requisicao_id&limit=5000',{headers:H})).json();
      // consolida por nome de produto (soma quantidades quando repetido) + guarda de qual requisição veio
      const acc={};
      for(const i of (its||[])){const k=norm(i.produto_nome);if(!k)continue;const qi=Number(i.quantidade)||0;
        if(!acc[k]){acc[k]={produto:i.produto_nome,qtd:qi,un:i.unidade,categoria:i.categoria,reqs:{},reqQtd:{},reqItemId:i.id,reqIdPrimary:i.requisicao_id,itemIds:[i.id]};}
        else{acc[k].qtd+=qi; acc[k].itemIds.push(i.id); if(!acc[k].categoria&&i.categoria)acc[k].categoria=i.categoria; if(!acc[k].un&&i.unidade)acc[k].un=i.unidade;}
        const rm=reqMap[i.requisicao_id]; if(rm){acc[k].reqs[rm.num]=rm.dt; acc[k].reqQtd[rm.num]=(acc[k].reqQtd[rm.num]||0)+qi;}
      }
      // rastreabilidade: nº da requisição de compra + dia em que foi gerada
      Object.values(acc).forEach(a=>{const nums=Object.keys(a.reqs).sort((x,y)=>Number(x)-Number(y));a.reqNum=nums.map(n=>'REQ-'+String(n).padStart(4,'0')).join(', ');a.reqDia=nums.map(n=>dmy(a.reqs[n])).join(', ');});
      solItens=Object.values(acc);
      // COMPRADO/RECEBIDO PRECISO (relacional): soma qtd_pedida/qtd_recebida dos pedido_compra_itens
      // ligados aos itens destas requisições (por requisicao_item_id). É a fonte autoritativa do "já comprado".
      REL={};
      try{
        const allIds=[]; solItens.forEach(s=>{(s.itemIds||[]).forEach(id=>allIds.push(id));});
        if(allIds.length){
          const pci=await (await fetch(SB+'/rest/v1/pedido_compra_itens?requisicao_item_id=in.('+allIds.join(',')+')&select=requisicao_item_id,qtd_pedida,qtd_recebida&limit=8000',{headers:H})).json();
          for(const it of (pci||[])){const id=it.requisicao_item_id;if(!id)continue;if(!REL[id])REL[id]={c:0,r:0};REL[id].c+=Number(it.qtd_pedida)||0;REL[id].r+=Number(it.qtd_recebida)||0;}
        }
      }catch(e){}
    }
  }catch(e){}
  // fallback: solicitação antiga (app_config) se a loja ainda não tiver requisição
  if(!solItens.length){ try{ const sol=((await (await fetch(SB+'/rest/v1/app_config?chave=eq.compras_solicitacao_'+suf+'&select=valor',{headers:H})).json())[0]||{}).valor||{}; solItens=sol.itens||[]; }catch(e){} }
  SOLIC=solItens;
  // overrides por SEMANA (loja+semana ISO) — as baixas valem a semana toda e renovam sozinhas na próxima
  OVKEY='compras_overrides_'+suf+'_'+isoWeek(new Date());
  try{ped=await (await fetch(SB+'/rest/v1/app_config?select=chave,valor&chave=like.pedido_*&limit=2000',{headers:H})).json();}catch(e){}
  try{ov=((await (await fetch(SB+'/rest/v1/app_config?chave=eq.'+OVKEY+'&select=valor',{headers:H})).json())[0]||{}).valor||{};}catch(e){}
  OVER=ov.map||{};
  // Período dos pedidos considerados — padrão: últimos 7 dias (a semana). Assim TODOS os pedidos da semana
  // aparecem juntos (o novo soma aos anteriores), em vez de só os da data da requisição.
  const perv=(el('periodo')&&el('periodo').value)||'7';
  let CORTE,CORTEFIM='9999-99-99';
  if(perv==='req'){ CORTE=REQDATE||new Date().toISOString().slice(0,10); }
  else if(perv==='0'){ CORTE='0000-00-00'; }
  else if(perv==='custom'){
    CORTE=(el('dtDe')&&el('dtDe').value)||'0000-00-00';
    CORTEFIM=(el('dtAte')&&el('dtAte').value)||'9999-99-99';
    if(CORTE>CORTEFIM){const t=CORTE;CORTE=CORTEFIM;CORTEFIM=t;} // troca se inverteu
  }
  else { const n=Number(perv); const d=new Date(); d.setDate(d.getDate()-(n-1)); CORTE=d.toISOString().slice(0,10); }
  PERLABEL=perv==='req'?('desde a requisição ('+dmy(CORTE)+')'):perv==='0'?'(todos os pedidos)':perv==='custom'?('de '+dmy(CORTE)+' a '+dmy(CORTEFIM)):('desde '+dmy(CORTE));
  try{localStorage.setItem('gestao_periodo',perv);}catch(e){}
  const pedData=r=>String((r.valor&&(r.valor.em||r.valor.data))||'').slice(0,10);
  const doL=(ped||[]).filter(r=>{if(!r.valor||!lojaMatch(r.valor.loja,LOJA))return false;const pd=pedData(r);return pd>=CORTE&&pd<=CORTEFIM;});
  TOTALPED=doL.reduce((s,r)=>s+(Number(r.valor.total)||0),0);NPED=doL.length;
  COMPRADOS=[];for(const r of doL)for(const it of (r.valor.itens||[])){if(/^desconto$|^frete|^adicional/i.test(it.produto||''))continue;COMPRADOS.push({fornecedor:r.valor.fornecedor,produto:it.produto,qtd:it.qtd,un:it.un,subtotal:Number(it.subtotal)||0,preco:Number(it.preco)||0,entrega:r.valor.janela_entrega||r.valor.data||'',dataPedido:r.valor.em||r.valor.data||'',comprador:r.valor.created_by||'',chave:r.chave,recebido:!!r.valor.recebimento,norm:norm(it.produto)});}
  // lista de pedidos do período (para a aba "Pedidos da semana")

    const valor={fornecedor:gr.forn,loja:LOJA,data:new Date().toISOString().slice(0,10),pagamento:'à vista',cliente:null,recebimento_responsavel:receb,itens:itensP,total,cancelados:[],em:new Date().toISOString(),created_by:'Cotação (melhores preços)',origem:'requisicao',numero_pedido:numPed,requisicao_id:A_REQ,requisicao_numero:A_NUM};
    let okBlob=false;
    try{const r=await fetch(SB+'/rest/v1/app_config',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates'},body:JSON.stringify({chave,valor})});okBlob=r.ok;if(r.ok)ok++;else fail++;}catch(e){fail++;}
    if(okBlob){try{
      const pcRes=await fetch(SB+'/rest/v1/pedidos_compra',{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({numero:numPed,requisicao_id:A_REQ,loja:LOJA,fornecedor:gr.forn,status:'aberto',origem:'requisicao',total,recebido_total:0,baixa_feita:false,app_config_chave:chave,observacoes:'Gerado da cotação (melhores preços)',criado_por:'Cotação'})});
      const pc=((await pcRes.json())||[])[0];
      if(pc&&pc.id){const pcItens=itensRows.map(ir=>({pedido_id:pc.id,requisicao_item_id:(ir.row&&ir.row.id)||null,produto_nome:ir.produto,unidade:ir.un||'',qtd_pedida:ir.qtd,qtd_recebida:0,preco:ir.preco||null}));
        await fetch(SB+'/rest/v1/pedido_compra_itens',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(pcItens)});}
    }catch(e){}}
  }
  if(ok>0){
    try{await fetch(SB+'/rest/v1/requisicoes?id=eq.'+A_REQ+'&status=in.(enviada,em_analise,aguardando_cotacao,em_cotacao,cotacao_recebida,parcialmente_aprovada,aprovada,em_separacao)',{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({status:'compra_realizada',pedido_numero:ultimoPed||null,pedido_gerado_em:new Date().toISOString(),pedido_status:'emitido'})});}catch(e){}
    const usadas=new Set(sel.map(it=>A_ESC[it.id]));
    for(const c of cots){try{await fetch(SB+'/rest/v1/requisicao_cotacoes?id=eq.'+c.id,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({status:usadas.has(c.id)?'aprovada':'rejeitada'})});}catch(e){}}
    el('cotAnaliseBox').style.display='none';await load();verPedidos();
    var abrirP="try{window.top.location.href='/?page=pedidos'}catch(_){window.open('/?page=pedidos','_blank')}";
    var pEl=el('msg');pEl.className='msg ok';pEl.innerHTML='✅ '+ok+' pedido(s) gerado(s) da cotação'+(fail?(' · '+fail+' falha(s)'):'')+'. Veja em "Pedidos da semana" e clique em 📲 Enviar. <button onclick="'+abrirP+'" style="margin-left:8px;padding:6px 12px;border:0;border-radius:8px;background:#0369A1;color:#fff;font-weight:700;cursor:pointer">▶ Módulo Pedidos</button>';
  } else { show('Não consegui gerar o pedido'+(fail?(' ('+fail+' falha(s))'):'')+'.',false); }
}
function gerarPDF(){
  try{const J=window.jspdf&&window.jspdf.jsPDF;if(!J){show('PDF carregando, tente de novo.',false);return;}
    const doc=new J({orientation:'landscape',unit:'pt',format:'a4'});
    doc.setFontSize(14);doc.setTextColor(46,125,52);doc.text('Lista de Compras — '+nomeLoja(LOJA),40,36);
    doc.setFontSize(9);doc.setTextColor(120);doc.text('Gerado em '+new Date().toLocaleString('pt-BR')+'  ·  Total comprado no período: '+brl(TOTALPED),40,50);
    const stTxt=s=>s==='ok'?'Comprado':s==='wr'?'Verificar':'Faltando';
    const list=ROWS.filter(r=>(!FILTRO||eff(r)===FILTRO)&&passaBusca(r));
    const body=list.map(r=>[r.produto||'',((r.reqNum||'')+(r.reqDia?(' · '+r.reqDia):'')).trim(),((r.qtd||'')+' '+(r.un||'')).trim(),stTxt(eff(r)),r.forn||'',r.vTotal?('R$ '+r.vTotal):'',r.dataPed||'']);
    doc.autoTable({head:[['Produto','Requisição · Dia','Qtd','Status','Fornecedor','Valor total','Data pedido']],body,startY:64,styles:{fontSize:8,cellPadding:3,overflow:'linebreak'},headStyles:{fillColor:[46,125,52],textColor:255},columnStyles:{0:{cellWidth:170},1:{cellWidth:105}},didParseCell:d=>{if(d.section==='body'&&d.column.index===3){const t=d.cell.raw;if(t==='Faltando')d.cell.styles.textColor=[220,38,38];else if(t==='Comprado')d.cell.styles.textColor=[21,128,61];else if(t==='Verificar')d.cell.styles.textColor=[180,83,9];}}});
    doc.save('lista-compras-'+SUF[LOJA]+'-'+new Date().toISOString().slice(0,10)+'.pdf');
    show('✅ PDF gerado (veja os downloads).',true);
  }catch(e){show('Erro no PDF: '+e.message,false);}

function slugP(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40)||'item';}
// GERAR PEDIDO DE COMPRA a partir dos itens marcados (🛒) da requisição — cria o registro
// pedido_ no app_config (mesmo formato do módulo Pedidos), agrupando por fornecedor. Não envia:
// o pedido aparece no menu "Pedidos de Compra" para conferência e disparo manual (botão Enviar).
async function gerarPedidos(){
  const sel=ROWS.filter(r=>r.pedir && (r.forn||'').trim());
  if(!sel.length){show('Marque os itens (🛒) e preencha o *Fornecedor* de cada um para gerar o pedido.',false);return;}
  const semForn=ROWS.filter(r=>r.pedir && !(r.forn||'').trim()).length;
  const g={};for(const r of sel){const k=(r.forn||'').trim();(g[k]=g[k]||{forn:k,itens:[]}).itens.push(r);}
  const grupos=Object.values(g);
  if(!confirm(`Gerar ${grupos.length} pedido(s) de compra pela ${nomeLoja(LOJA)} com ${sel.length} item(ns) marcado(s)?`+(semForn?`\n\n⚠️ ${semForn} item(ns) marcado(s) SEM fornecedor serão ignorados.`:'')+`\n\nOs pedidos vão para o menu "Pedidos de Compra", onde você confere e clica em Enviar.`))return;
  let receb=null;try{const rl=((await (await fetch(SB+'/rest/v1/app_config?chave=eq.recebimento_por_loja&select=valor',{headers:H})).json())[0]||{}).valor||{};receb=(rl[LOJA]||{}).nome||null;}catch(e){}
  // próximo nº de pedido (PED-#### sequencial) — maior existente + 1
  let seq=0; try{ const nums=await (await fetch(SB+'/rest/v1/pedidos_compra?select=numero&numero=not.is.null&limit=3000',{headers:H})).json(); for(const x of (nums||[])){const n=parseInt(String(x.numero).replace(/\D/g,''),10);if(!isNaN(n)&&n>seq)seq=n;} }catch(e){}
  let ok=0,fail=0,ultimoPed='';
  for(const gr of grupos){
    const itensRows=gr.itens.map(r=>{const q=nb(falta(r))>0?nb(falta(r)):nb(r.qtd);const qf=q||nb(r.qtd);const p=nb(r.vUnit);return{row:r,produto:r.produto,qtd:qf,un:r.un||'',preco:p||0,subtotal:(p*qf)||0};});
    const itens=itensRows.map(({produto,un,qtd,preco,subtotal})=>({produto,qtd,un,preco,subtotal}));
    const total=itens.reduce((s,it)=>s+(Number(it.subtotal)||0),0);
    seq++; const numPed='PED-'+String(seq).padStart(4,'0'); ultimoPed=numPed;
    const reqIdG=(gr.itens.find(r=>r.reqIdPrimary)||{}).reqIdPrimary||null;
    const reqNumG=(()=>{const m=gr.itens.map(r=>String(r.reqNum||'')).join(',').match(/\d+/);return m?parseInt(m[0],10):null;})();
    const chave='pedido_'+slugP(gr.forn)+'_'+(SUF[LOJA]||'loja')+'_'+Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,4);
    const valor={fornecedor:gr.forn,loja:LOJA,data:new Date().toISOString().slice(0,10),pagamento:'à vista',cliente:null,recebimento_responsavel:receb,itens,total,cancelados:[],em:new Date().toISOString(),created_by:'Gestão da Lista de Compras',origem:'requisicao',numero_pedido:numPed,requisicao_id:reqIdG,requisicao_numero:reqNumG};
    let okBlob=false;
    try{const r=await fetch(SB+'/rest/v1/app_config',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates'},body:JSON.stringify({chave,valor})});okBlob=r.ok;if(r.ok)ok++;else fail++;}catch(e){fail++;}
    // Registro RELACIONAL (pedidos_compra + itens): faz o pedido aparecer no ciclo e alimentar "Comprado" com precisão
    if(okBlob){ try{
      const pcRes=await fetch(SB+'/rest/v1/pedidos_compra',{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({numero:numPed,requisicao_id:reqIdG,loja:LOJA,fornecedor:gr.forn,status:'aberto',origem:'requisicao',total,recebido_total:0,baixa_feita:false,app_config_chave:chave,observacoes:null,criado_por:'Gestão da Lista'})});
      const pc=((await pcRes.json())||[])[0];
      if(pc&&pc.id){ const pcItens=itensRows.map(ir=>({pedido_id:pc.id,requisicao_item_id:(ir.row&&ir.row.reqItemId)||null,produto_nome:ir.produto,unidade:ir.un||'',qtd_pedida:ir.qtd,qtd_recebida:0,preco:ir.preco||null}));
        await fetch(SB+'/rest/v1/pedido_compra_itens',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(pcItens)}); }
    }catch(e){} }
  }
  // Atualiza o STATUS das requisições cujos itens entraram no pedido → "compra_realizada"
  // (só a partir de estados pré-compra; não rebaixa recebimento/concluída).
  const reqNums=[...new Set(sel.flatMap(r=>String(r.reqNum||'').match(/\d+/g)||[]).map(n=>parseInt(n,10)).filter(Boolean))];
  if(ok>0 && reqNums.length){
    try{ await fetch(SB+'/rest/v1/requisicoes?loja=eq.'+encodeURIComponent(LOJA)+'&numero=in.('+reqNums.join(',')+')&status=in.(enviada,em_analise,aguardando_cotacao,em_cotacao,cotacao_recebida,parcialmente_aprovada,aprovada,em_separacao)',{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({status:'compra_realizada',pedido_numero:ultimoPed||null,pedido_gerado_em:new Date().toISOString(),pedido_status:'emitido'})}); }catch(e){}
  }
  ROWS.forEach(r=>{if(r.pedir)r.pedir=false;});
  if(ok>0){
    await load();                       // atualiza consolidação + lista de pedidos
    if(VIEW!=='pedidos') verPedidos();  // abre já a aba "Pedidos da semana" com os recém-gerados
    var abrirP="try{window.top.location.href='/?page=pedidos'}catch(_){window.open('/?page=pedidos','_blank')}";
    var pEl=el('msg'); pEl.className='msg ok';
    pEl.innerHTML='✅ '+ok+' pedido(s) gerado(s)'+(fail?(' · '+fail+' falha(s)'):'')+'. Veja abaixo em "Pedidos da semana" e clique em 📲 Enviar. '+
      '<button onclick="'+abrirP+'" style="margin-left:8px;padding:6px 12px;border:0;border-radius:8px;background:#0369A1;color:#fff;font-weight:700;cursor:pointer">▶ Módulo Pedidos</button>';
  } else { render(); show('Não consegui gerar o pedido'+(fail?(' ('+fail+' falha(s))'):'')+'.',false); }
}
// GERAR COTAÇÃO a partir dos itens marcados (🛒) — cria uma requisição status 'em_cotacao'
// com os itens, que aparece no módulo Cotação para enviar aos fornecedores e receber preços.
// Mesmo padrão do "Gerar Pedido", sem mexer no que já existe.
async function gerarCotacao(){
  const sel=ROWS.filter(r=>r.pedir);
  if(!sel.length){show('Marque os itens (🛒) que precisam de cotação e clique em "Gerar Cotação".',false);return;}
  if(!confirm(`Gerar uma COTAÇÃO pela ${nomeLoja(LOJA)} com ${sel.length} item(ns) marcado(s)?\n\nEla vai para o módulo "Cotação Inteligente", onde você envia aos fornecedores para receber os preços.`))return;
  try{
    const hj=new Date();
    const titulo='Cotação — '+nomeLoja(LOJA)+' — '+String(hj.getDate()).padStart(2,'0')+'/'+String(hj.getMonth()+1).padStart(2,'0');
    const reqBody={loja:LOJA,titulo,setor:null,responsavel_nome:'Gestão da Lista',prioridade:'media',data_necessidade:null,prazo_entrega:null,centro_custo:null,total_estimado:0,total_final:0,observacoes:'Gerada a partir da Gestão da Lista de Compras',status:'em_cotacao',aprovador_nome:null,aprovador_at:null,obs_aprovacao:null,credito_id:null,created_by:'Gestão da Lista'};
    const rr=await fetch(SB+'/rest/v1/requisicoes',{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(reqBody)});
    if(!rr.ok){show('Falha ao criar a cotação ('+rr.status+').',false);return;}
    const req=((await rr.json())||[])[0]||{}; const rid=req.id;
    if(!rid){show('Cotação criada, mas não retornou o id.',false);return;}
    const itens=sel.map(r=>({requisicao_id:rid,produto_nome:r.produto,categoria:r.categoria||null,quantidade:nb(r.qtd)||1,unidade:r.un||'Unidade(s)',preco_referencia:nb(r.vUnit)||null,preco_cotado:null,preco_final:null,fornecedor_nome:null,status:'pendente',observacoes:null,bloqueado:false,motivo_bloqueio:null,quantidade_aprovada:null}));
    await fetch(SB+'/rest/v1/requisicao_itens',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(itens)});
    try{await fetch(SB+'/rest/v1/req_timeline',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({requisicao_id:rid,tipo:'criacao',descricao:'Cotação criada pela Gestão da Lista de Compras ('+sel.length+' itens)',usuario:'Gestão da Lista',dados:null})});}catch(e){}
    ROWS.forEach(r=>{if(r.pedir)r.pedir=false;});render();
    if(VIEW!=='cotacoes') verCotacoes();   // abre já a aba "Cotações" com a recém-criada
    var numTxt='REQ-'+String(req.numero||'').padStart(4,'0');
    var abrir="try{window.top.location.href='/?page=cotacao&req="+rid+"'}catch(_){window.open('/?page=cotacao&req="+rid+"','_blank')}";
    var mEl=el('msg'); mEl.className='msg ok';
    mEl.innerHTML='✅ Cotação criada ('+numTxt+') com '+sel.length+' item(ns). Veja abaixo em "Cotações". '+
      '<button onclick="'+abrir+'" style="margin-left:8px;padding:7px 14px;border:0;border-radius:8px;background:#7C3AED;color:#fff;font-weight:800;cursor:pointer">▶ Escolher fornecedores e enviar</button>';
  }catch(e){show('Falha ao gerar a cotação: '+e.message,false);}
}
// Enviar um pedido específico (da aba "Pedidos da semana") ao fornecedor + recebedor,
// sem sair da Gestão. Resolve o WhatsApp do fornecedor no cadastro (whatsapp>telefone>contato_telefone).
async function enviarPedidoDaLista(chave){
  const p=(PEDLIST||[]).find(x=>x.chave===chave); if(!p){show('Pedido não encontrado.',false);return;}
  let ff='';
  try{
    const fs=await (await fetch(SB+'/rest/v1/fornecedores?nome=ilike.'+encodeURIComponent('%'+(p.forn||'')+'%')+'&select=nome,whatsapp,telefone,contato_telefone,loja&limit=15',{headers:H})).json();
    const pick=(fs||[]).find(x=>lojaMatch(x.loja,LOJA))||(fs||[])[0]||{};
    ff=((pick.whatsapp||pick.telefone||pick.contato_telefone||'')+'').replace(/\D/g,'');
  }catch(e){}
  if(!ff||ff.length<10){ ff=((prompt('WhatsApp do fornecedor "'+p.forn+'" (com DDD):')||'')+'').replace(/\D/g,''); }
  if(!ff||ff.length<10){ show('Sem WhatsApp do fornecedor — não enviei.',false); return; }
  let receb='';
  try{ const rl=((await (await fetch(SB+'/rest/v1/app_config?chave=eq.recebimento_por_loja&select=valor',{headers:H})).json())[0]||{}).valor||{}; receb=(((rl[LOJA]||{}).whatsapp||'')+'').replace(/\D/g,''); }catch(e){}
  const link='https://painel.amorefood.com.br/pedido.html?p='+String(chave).replace(/^pedido_/,'');
  const itensTxt=(p.itens||[]).filter(it=>!/^desconto$|^frete|^adicional/i.test(it.produto||'')).map(it=>'• '+(it.qtd||'')+' '+(it.un||'')+' — *'+it.produto+'*').join('\n');
  const msgF='Olá, '+p.forn+'! 👋 Aqui é da *'+nomeLoja(LOJA)+'*.\n\nSegue nosso *pedido de compra*:\n'+itensTxt+'\n💳 Pagamento: à vista\n\nDetalhes e confirmação no link:\n'+link+'\n\nObrigado! 💚';
  const msgR='📦 *Pedido a receber — '+nomeLoja(LOJA)+'*\nFornecedor: '+p.forn+' · '+brl(p.total)+'\n\nConfira na chegada (lista organizada):\n'+link+'\n— Compras';
  if(!confirm('Enviar o pedido de *'+p.forn+'* ('+brl(p.total)+') ao fornecedor'+(receb&&receb.length>=10?' e ao recebedor':'')+'?'))return;
  const snd=async(fone,msg)=>{try{const r=await fetch('/api/evolution-send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:(fone.length<=11?'55'+fone:fone),message:msg})});return r.ok;}catch(e){return false;}};
  let okc=0,alv=0; alv++; if(await snd(ff,msgF))okc++;
  if(receb&&receb.length>=10){ await sleep(3500); alv++; if(await snd(receb,msgR))okc++; }
  show('✅ Pedido de '+p.forn+' enviado ('+okc+'/'+alv+' destino(s)).',okc>0);
}
async function disparar(){
  const alvos=ROWS.filter(r=>eff(r)!=='ok'&&r.forn.trim()&&(r.wpp||'').replace(/\D/g,'').length>=10);
  const g={};for(const r of alvos){const w=r.wpp.replace(/\D/g,'');const key=r.forn.trim()+'|'+w;(g[key]=g[key]||{forn:r.forn.trim(),wpp:w,itens:[]}).itens.push(r);}
  const gs=Object.values(g);
  if(!gs.length){show('Preencha fornecedor + WhatsApp nos itens faltantes.',false);return;}
  if(!confirm(`Disparar ${gs.length} pedido(s) pela ${nomeLoja(LOJA)}?`))return;
  await salvar();const P=el('prog');P.style.display='block';P.innerHTML='<b>Disparando…</b>';let ok=0,fail=0,prev=-1;
  for(let i=0;i<gs.length;i++){const x=gs[i];let fone=x.wpp;if(fone.length<=11)fone='55'+fone;
    const linhas=x.itens.map(it=>`• ${it.qtd||''} ${it.un||''} — *${it.produto}*`+(String(it.vUnit||'').trim()?` — ${brl(it.vUnit)}`:'')).join('\n');
    const msg=`Olá, ${x.forn}! 👋 Aqui é da *${nomeLoja(LOJA)}*.\n\nSegue nosso *pedido de compra*:\n${linhas}\n\nObrigado! 💚`;
    try{const r=await fetch('/api/evolution-send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:fone,message:msg})});
      if(r.ok){ok++;P.innerHTML+=`<div class="ln">✅ ${esc(x.forn)} (${x.itens.length} itens)</div>`;}else{fail++;P.innerHTML+=`<div class="ln">❌ ${esc(x.forn)} — HTTP ${r.status}</div>`;}}
    catch(e){fail++;P.innerHTML+=`<div class="ln">❌ ${esc(x.forn)} — rede</div>`;}
    if(i<gs.length-1){let d;do{d=rnd(4,9);}while(d===prev);prev=d;P.innerHTML+=`<div class="ln" style="color:#6b7280">aguardando ${d}s…</div>`;await sleep(d*1000);}
  }
  P.innerHTML+=`<div class="ln"><b>Fim — ${ok} enviado(s), ${fail} falha(s).</b></div>`;show(`Disparo: ${ok} enviado(s), ${fail} falha(s).`,fail===0);
}
