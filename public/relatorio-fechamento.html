<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Fechamento de Caixas — Créditos — Amore</title>
<style>
:root{--vinho:#8B1212;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--roxo:#5B21B6;--azul:#1E40AF;--shadow:0 1px 2px rgba(80,20,25,.05),0 8px 24px -12px rgba(80,20,25,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 60px}
header.top{border-bottom:2px solid var(--vinho);padding-bottom:14px;margin-bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho);font-weight:700}
h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
h2{font-size:16.5px;margin:24px 0 4px;color:var(--vinho)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi.ok{border-left:4px solid var(--ok)}.kpi.warn{border-left:4px solid var(--warn)}.kpi.bad{border-left:4px solid var(--bad)}.kpi.roxo{border-left:4px solid var(--roxo)}.kpi.azul{border-left:4px solid var(--azul)}
.kpi .kn{font-size:20px;font-weight:800}.kpi .kl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}.kpi .ks{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:1px}
.lojacard{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin:14px 0}
.lojacard h3{margin:0 0 8px;font-size:17px;color:var(--vinho)}
.sub3{font-size:12.5px;font-weight:700;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid var(--border)}tbody tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap;font-weight:700}
.crd{display:inline-block;font-size:10.5px;font-weight:800;background:#F1F5F9;color:#334155;border:1px solid #E2E8F0;border-radius:20px;padding:2px 8px;white-space:nowrap}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.b-ok{background:#DCFCE7;color:#15803D}.b-no{background:#FEE2E2;color:#B91C1C}.b-warn{background:#FEF3C7;color:#B45309}.b-info{background:#E0F2FE;color:#0369A1}.b-roxo{background:#EDE9FE;color:#5B21B6}
@media(prefers-color-scheme:dark){.b-ok{background:#0f2e1b;color:#4ade80}.b-no{background:#3a1414;color:#f87171}.b-warn{background:#33270a;color:#fbbf24}.b-info{background:#0b2a3a;color:#7dd3fc}.b-roxo{background:#241a3a;color:#c4b5fd}.crd{background:#241d1f;color:#cbb6bb;border-color:#3a2f31}}
.empty{padding:12px;color:var(--muted);font-size:12.5px;border:1px dashed var(--border);border-radius:10px;margin:4px 0}
.foot{margin-top:26px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
.filtro{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
select{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;padding:7px 10px;font-size:13px}
@media(max-width:680px){
  table{min-width:0}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  tbody tr{display:block;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:4px 12px;margin-bottom:9px}
  tbody td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border);text-align:right;white-space:normal}
  tbody tr td:last-child{border-bottom:none}
  tbody td::before{content:attr(data-label);color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;text-align:left}
}
@media print{.btn,.filtro{display:none}body{background:#fff}.lojacard,.kpi{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Carregando fechamento…</div></div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const q=new URLSearchParams(location.search);
const canon=l=>({'Amore Costa Dourada':'Amore CD','Flow Paiva':'Flow CD'})[l]||l;
const LOJA=canon((q.get('loja')||'').trim());
const LOJAS=['Amore CD','Amore Paiva','Flow CD'];
const g=async p=>{try{return await (await fetch(SB+'/rest/v1/'+p,{headers:H})).json()}catch(e){return []}};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dDMY=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s};
const hojeRecife=()=>new Date(Date.now()-3*3600*1000).toLocaleDateString('pt-BR');
const FIN={compras_semana:'🛒 Compras da semana',logistica:'🚚 Logística',servico:'🔧 Prestação de serviço',outras:'🧾 Outras despesas',reembolso:'🔄 Reembolso'};
const finLabel=id=>FIN[id]||id||'—';
const STL={rascunho:'🟡 Rascunho',solicitado:'🔵 Solicitado',em_aprovacao:'🟠 Em aprovação',aprovado:'🟢 Aprovado',disponibilizado:'💰 Disponibilizado',em_prestacao:'🧾 Em prestação',em_analise:'🕓 Em análise',prestacao_pendente:'🔴 Prestação pendente',divergencia:'⚠️ Divergência',aguardando_devolucao:'🔄 Aguardando devolução',remanescente:'🔵 Remanescente',encerrado:'✅ Encerrado'};
const stLabel=s=>STL[s]||s;

// espelha dispSaldo do painel (crédito disponível gerado por um caixa)
function baseSaldo(c){
  if(['cancelado','excluido','reprovado','rascunho'].includes(c.status))return 0;
  const p=c.prestacao||{};
  if(c.estimativa_base&&c.estimativa_base.lancamento_direto&&['disponibilizado','em_prestacao'].includes(c.status))return Math.max(0,(c.valor_aprovado||0)-(c.total_gasto||0));
  if(c.status==='remanescente')return Number(p.remanescente!=null?p.remanescente:Math.abs(c.saldo||0))||0;
  if(c.status==='encerrado'&&p.destino==='devolucao')return Number(p.devolucao||0)||0;
  return 0;
}
const dispCred=c=>{const u=((c.prestacao&&c.prestacao.saldo_usos)||[]).reduce((s,x)=>s+(Number(x.valor)||0),0);return Math.round((baseSaldo(c)-u)*100)/100};
const rVal=c=>Number((c.prestacao||{}).reembolso||0);
const rPago=c=>(c.prestacao&&c.prestacao.reembolso_pago)||null;
const devVal=c=>Number((c.prestacao||{}).devolucao||Math.abs(c.saldo||0))||0;
const ABERTO=['solicitado','em_aprovacao','aprovado','disponibilizado','em_prestacao','em_analise','prestacao_pendente','divergencia'];

async function run(){
  const cred=await g('creditos?select=numero,unidade,status,valor_aprovado,total_gasto,saldo,prestacao,estimativa_base,solicitante_nome,finalidade,data_solicitacao,created_at&order=numero.desc&limit=5000');
  const ativos=(cred||[]).filter(c=>!['cancelado','excluido','reprovado'].includes(c.status)&&(!LOJA||c.unidade===LOJA));

  // totais gerais
  let T={aberto:0,analise:0,reemb:0,devol:0,disp:0,reembPagoV:0,reembPagoN:0};
  const lojas=LOJAS.filter(l=>!LOJA||l===LOJA);
  const dados=lojas.map(loja=>{
    const cs=ativos.filter(c=>c.unidade===loja);
    const analise=cs.filter(c=>c.status==='em_analise');
    const aberto=cs.filter(c=>ABERTO.includes(c.status));
    const reembPagar=cs.filter(c=>rVal(c)>0.005&&!rPago(c));
    const reembFeito=cs.filter(c=>rPago(c));
    const devolPend=cs.filter(c=>c.status==='aguardando_devolucao');
    const disp=cs.reduce((s,c)=>s+dispCred(c),0);
    const vReemb=reembPagar.reduce((s,c)=>s+rVal(c),0);
    const vDevol=devolPend.reduce((s,c)=>s+devVal(c),0);
    const vReembPago=reembFeito.reduce((s,c)=>s+((rPago(c)&&rPago(c).valor)||rVal(c)),0);
    T.aberto+=aberto.length;T.analise+=analise.length;T.reemb+=vReemb;T.devol+=vDevol;T.disp+=disp;T.reembPagoV+=vReembPago;T.reembPagoN+=reembFeito.length;
    return {loja,cs,analise,aberto,reembPagar,reembFeito,devolPend,disp,vReemb,vDevol,vReembPago,emAbertoValor:aberto.reduce((s,c)=>s+(c.valor_aprovado||0),0)};
  }).filter(d=>d.aberto.length||d.reembPagar.length||d.devolPend.length||d.reembFeito.length||d.disp>0.005);

  const kpi=(l,v,cls,sub)=>`<div class="kpi ${cls||''}"><div class="kn">${v}</div><div class="kl">${l}</div>${sub?`<div class="ks">${sub}</div>`:''}</div>`;
  const crd=n=>`<span class="crd">💳 CRD-${n}</span>`;

  const tblReemb=(arr,pago)=>`<div class="tw"><table><thead><tr><th>Caixa</th><th>Solicitante</th><th>Finalidade</th><th>${pago?'Pago':'Status'}</th><th class="num">Valor</th></tr></thead><tbody>${arr.map(c=>{
    const p=rPago(c);
    return `<tr><td data-label="Caixa">${crd(c.numero)}</td><td data-label="Solicitante">${esc(c.solicitante_nome)}</td><td data-label="Finalidade">${finLabel(c.finalidade)}</td><td data-label="${pago?'Pago':'Status'}">${pago?`<span class="badge b-ok">✅ ${dDMY(p&&p.em)}${p&&p.por?' · '+esc(p.por):''}</span>`:`<span class="badge ${c.status==='em_analise'?'b-warn':'b-roxo'}">${c.status==='em_analise'?'aguardando aprovação':stLabel(c.status)}</span>`}</td><td class="num" data-label="Valor" style="color:var(--roxo)">${brl((p&&p.valor)||rVal(c))}</td></tr>`;
  }).join('')}</tbody></table></div>`;

  const tblDevol=arr=>`<div class="tw"><table><thead><tr><th>Caixa</th><th>Solicitante</th><th>Finalidade</th><th class="num">A receber</th></tr></thead><tbody>${arr.map(c=>`<tr><td data-label="Caixa">${crd(c.numero)}</td><td data-label="Solicitante">${esc(c.solicitante_nome)}</td><td data-label="Finalidade">${finLabel(c.finalidade)}</td><td class="num" data-label="A receber" style="color:var(--ok)">${brl(devVal(c))}</td></tr>`).join('')}</tbody></table></div>`;

  const tblAberto=arr=>`<div class="tw"><table><thead><tr><th>Caixa</th><th>Solicitante</th><th>Status</th><th class="num">Crédito</th><th class="num">Gasto</th></tr></thead><tbody>${arr.map(c=>`<tr><td data-label="Caixa">${crd(c.numero)}</td><td data-label="Solicitante">${esc(c.solicitante_nome)}</td><td data-label="Status"><span class="badge b-info">${stLabel(c.status)}</span></td><td class="num" data-label="Crédito">${brl(c.valor_aprovado)}</td><td class="num" data-label="Gasto" style="color:var(--warn)">${brl(c.total_gasto)}</td></tr>`).join('')}</tbody></table></div>`;

  const secoes=dados.map(d=>`
    <div class="lojacard">
      <h3>🏬 ${esc(d.loja)}</h3>
      <div class="kpis">
        ${kpi('🏦 Crédito disponível',brl(d.disp),'ok','pronto p/ nova compra')}
        ${kpi('🔵 Crédito em aberto',brl(d.emAbertoValor),'azul',`${d.aberto.length} caixa(s) · ${d.analise.length} em análise`)}
        ${kpi('🔴 Reembolso a pagar',brl(d.vReemb),d.vReemb>0.005?'roxo':'',`${d.reembPagar.length} caixa(s)`)}
        ${kpi('💵 Devolução a receber',brl(d.vDevol),d.vDevol>0.005?'warn':'',`${d.devolPend.length} caixa(s)`)}
      </div>
      ${d.reembPagar.length?`<div class="sub3">🔴 Reembolso a pagar</div>${tblReemb(d.reembPagar,false)}`:''}
      ${d.devolPend.length?`<div class="sub3">💵 Devolução a receber</div>${tblDevol(d.devolPend)}`:''}
      ${d.reembFeito.length?`<div class="sub3">✅ Reembolsos pagos (ciclo fechado)</div>${tblReemb(d.reembFeito,true)}`:''}
      ${d.aberto.length?`<div class="sub3">🔵 Em aberto — aguardando prestação/aprovação</div>${tblAberto(d.aberto)}`:''}
      ${(!d.reembPagar.length&&!d.devolPend.length&&!d.reembFeito.length&&!d.aberto.length)?'<div class="empty">Sem pendências de fechamento nesta loja.</div>':''}
    </div>`).join('');

  document.getElementById('app').innerHTML=`
    <header class="top">
      <div>
        <div class="eyebrow">Amore · Créditos & Prestação</div>
        <h1>🔒 Fechamento de Caixas</h1>
        <div class="sub">${LOJA?esc(LOJA):'Todas as lojas'} · gerado em ${hojeRecife()}</div>
      </div>
      <a class="btn" href="https://painel.amorefood.com.br/?page=creditos" target="_blank">Abrir no painel →</a>
    </header>
    <div class="filtro">
      <label style="font-size:12px;color:var(--muted);font-weight:700">Loja:</label>
      <select onchange="var u=new URL(location.href);this.value?u.searchParams.set('loja',this.value):u.searchParams.delete('loja');location.href=u.toString()">
        <option value="">Todas as lojas</option>
        ${LOJAS.map(l=>`<option value="${l}" ${LOJA===l?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <h2>📊 Resumo geral</h2>
    <div class="kpis">
      ${kpi('📋 Caixas em aberto',T.aberto,'azul','aguardando prestação/aprovação')}
      ${kpi('🕓 Em análise (aprovação)',T.analise,T.analise>0?'warn':'','a aprovar por loja')}
      ${kpi('🔴 Reembolso a pagar',brl(T.reemb),T.reemb>0.005?'roxo':'','a devolver a quem gerou o caixa')}
      ${kpi('💵 Devolução a receber',brl(T.devol),T.devol>0.005?'warn':'','sobra a voltar ao caixa')}
      ${kpi('🏦 Crédito disponível',brl(T.disp),'ok','pronto p/ nova compra')}
      ${kpi('✅ Reembolsos pagos',brl(T.reembPagoV),'','ciclos fechados: '+T.reembPagoN)}
    </div>
    ${dados.length?secoes:'<div class="empty">Nenhum caixa em aberto para fechar.</div>'}
    <div class="foot">Relatório de conferência (somente leitura). O fechamento individual é feito no painel → Créditos & Prestação → aba <b>🔒 Fechamento</b>. Enviado automaticamente às segundas-feiras.</div>`;
}
run().catch(e=>{document.getElementById('app').innerHTML='<div class="msg">Falha ao carregar: '+esc(e&&e.message||e)+'</div>'});
</script>
</body>
</html>
