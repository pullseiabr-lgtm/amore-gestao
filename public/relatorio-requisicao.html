<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Requisição Inteligente de Compra × Estoque — Amore</title>
<style>
:root{--vinho:#8B1212;--bg:#faf7f6;--card:#fff;--text:#1c1517;--muted:#6f656a;--border:#ece4e5;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--shadow:0 1px 2px rgba(80,20,25,.05),0 8px 24px -12px rgba(80,20,25,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#151011;--card:#1e1719;--text:#f3ecee;--muted:#a79ca0;--border:#342a2c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 60px}
header.top{border-bottom:2px solid var(--vinho);padding-bottom:14px;margin-bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho);font-weight:700}
h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
h2{font-size:16.5px;margin:24px 0 10px;color:var(--vinho)}h2 .h2s{font-size:12px;font-weight:500;color:var(--muted)}
.ia{background:color-mix(in srgb,var(--vinho) 6%,var(--card));border:1px solid var(--border);border-left:4px solid var(--vinho);border-radius:12px;padding:14px 16px;font-size:14px;margin:14px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi.bad{border-left:4px solid var(--bad)}.kpi.warn{border-left:4px solid var(--warn)}.kpi.ok{border-left:4px solid var(--ok)}
.kpi .kn{font-size:21px;font-weight:800}.kpi .kl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}.kpi .ks{font-size:12px;font-weight:600;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid var(--border)}tbody tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap}.prod{font-weight:600}.mut{color:var(--muted)}.mc{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.p-crit{background:#FEE2E2;color:#B91C1C}.p-alta{background:#FFEDD5;color:#C2410C}.p-media{background:#FEF3C7;color:#B45309}.p-baixa{background:#DCFCE7;color:#15803D}
@media(prefers-color-scheme:dark){.p-crit{background:#3a1414;color:#f87171}.p-alta{background:#3a2410;color:#fb923c}.p-media{background:#33270a;color:#fbbf24}.p-baixa{background:#0f2e1b;color:#4ade80}}
.foot{margin-top:26px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:760px){
  .tw{overflow:visible;border:none;box-shadow:none;background:transparent}table{min-width:0;font-size:13px}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  tbody tr{display:block;background:var(--card);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:4px 12px;margin-bottom:10px}
  tbody td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border);text-align:right;white-space:normal}
  tbody tr td:last-child{border-bottom:none}
  tbody td::before{content:attr(data-label);color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;text-align:left}
  tbody td:not([data-label])::before{content:""}
  td.prod{display:block;text-align:left;font-size:14.5px;font-weight:800;border-bottom:2px solid var(--vinho);padding:7px 0 6px}td.prod::before{display:none}
}
@media print{.btn{display:none}body{background:#fff}.tw,.kpi{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Analisando estoque × consumo…</div></div>
<script>
const SB='https://xdwnsqkzgopymufsuccr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkd25zcWt6Z29weW11ZnN1Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjk5NjIsImV4cCI6MjA5Mzc0NTk2Mn0.WXT4cSJuTBMIYYinpfX76eTVPUeDT7qFtyLmhCh89zk';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const q=new URLSearchParams(location.search);
const canon=l=>({'Amore Costa Dourada':'Amore CD','Flow Paiva':'Amore Paiva'}[l]||l);
const LOJA=canon((q.get('loja')||'Amore Paiva').trim());
const g=async p=>{try{return await (await fetch(SB+'/rest/v1/'+p,{headers:H})).json()}catch(e){return []}};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf=v=>Number.isInteger(v)?String(v):(Math.round(v*100)/100).toLocaleString('pt-BR');
const hoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

async function run(){
  const prods=await g(`estoque_produtos?loja=eq.${encodeURIComponent(LOJA)}&ativo=eq.true&select=id,nome,nivel_atual,nivel_minimo,nivel_ideal,preco_unitario&limit=8000`);
  const ini30=new Date(Date.now()-30*864e5).toISOString();
  const movs=await g(`estoque_movimentacoes?loja=eq.${encodeURIComponent(LOJA)}&tipo=in.(saida,perda)&created_at=gte.${encodeURIComponent(ini30)}&select=produto_id,quantidade,created_at&limit=8000`);
  const cons30={}, cons7={}; const lim7=Date.now()-7*864e5;
  movs.forEach(m=>{const pid=m.produto_id,qq=Number(m.quantidade)||0;cons30[pid]=(cons30[pid]||0)+qq;if(new Date(m.created_at).getTime()>=lim7)cons7[pid]=(cons7[pid]||0)+qq;});

  const linhas=prods.map(p=>{
    const atual=Number(p.nivel_atual)||0, min=Number(p.nivel_minimo)||0, ideal=Number(p.nivel_ideal)||0, preco=Number(p.preco_unitario)||0;
    const cd=(cons30[p.id]||0)/30; const temCons=cd>0;
    const diasRest= atual<=0?0 : (temCons? atual/cd : Infinity);
    const necessSemana= temCons? cd*7 : 0;
    const seg=min;
    let sugerido= temCons? Math.max(0, Math.ceil(necessSemana+seg-atual)) : (atual<ideal? Math.max(0, Math.ceil(ideal-atual)) : (atual<min? Math.ceil(min-atual):0));
    let prio;
    if(atual<=0) prio='crit';
    else if(temCons && diasRest<2) prio='crit';
    else if(atual<min) prio='alta';
    else if(temCons && diasRest<7) prio='alta';
    else if(atual<ideal) prio='media';
    else prio='baixa';
    const precisa = sugerido>0 || atual<min || prio==='crit' || prio==='alta';
    // justificativa automática
    let jus;
    if(atual<=0) jus='Estoque zerado — reposição imediata.';
    else if(temCons && diasRest<2) jus=`Ruptura prevista em ~${nf(diasRest)} dia(s). Reposição imediata.`;
    else if(atual<min) jus='Abaixo do estoque mínimo — reposição recomendada.';
    else if(temCons && diasRest<7) jus=`Autonomia de ~${nf(diasRest)} dias — repor nesta semana.`;
    else if(atual<ideal) jus='Abaixo do ideal — recomposição planejada.';
    else jus='Estoque suficiente.';
    if(!temCons && precisa) jus+=' (sem histórico de consumo — base: mínimo/ideal, conferir contagem)';
    return {nome:p.nome,atual,min,ideal,preco,cd,diasRest,sugerido,prio,jus,temCons,precisa,valorEst:sugerido*preco};
  }).filter(l=>l.precisa);

  const ord={crit:0,alta:1,media:2,baixa:3};
  linhas.sort((a,b)=>ord[a.prio]-ord[b.prio] || (a.diasRest-b.diasRest));
  const nCrit=linhas.filter(l=>l.prio==='crit').length, nAlta=linhas.filter(l=>l.prio==='alta').length, nMed=linhas.filter(l=>l.prio==='media').length;
  const semCons=linhas.filter(l=>!l.temCons).length;
  const valorTotal=linhas.reduce((s,l)=>s+l.valorEst,0);

  const resumo= linhas.length
    ? `A análise do estoque × consumo (30 dias) da <b>${esc(LOJA)}</b> identificou <b>${linhas.length} produto(s)</b> que precisam de reposição: `+
      `${nCrit? `<b style="color:var(--bad)">${nCrit} crítico(s)</b>, `:''}${nAlta?`<b style="color:var(--warn)">${nAlta} alta(s)</b>, `:''}${nMed?`${nMed} média(s). `:''}`+
      `Valor estimado de compra: <b>${brl(valorTotal)}</b>${valorTotal===0?' (preços a definir na cotação)':''}. `+
      (semCons? `${semCons} item(ns) sem histórico de consumo — sugestão baseada no mínimo/ideal, conferir contagem física.`:'Sugestões baseadas no consumo real dos últimos 30 dias.')
    : `Nenhum produto abaixo da necessidade projetada na <b>${esc(LOJA)}</b>. Sem reposição recomendada neste momento. 🎉`;

  const pillTxt={crit:'🔴 Crítica',alta:'🟠 Alta',media:'🟡 Média',baixa:'🟢 Baixa'};
  const row=l=>`<tr>`+
    `<td class="prod">${esc(l.nome)}</td>`+
    `<td class="num" data-label="Atual">${nf(l.atual)}</td>`+
    `<td class="num" data-label="Mín / Ideal">${nf(l.min)} / ${nf(l.ideal)}</td>`+
    `<td class="num" data-label="Consumo/dia">${l.temCons?nf(l.cd):'—'}</td>`+
    `<td class="num" data-label="Dias autonomia">${l.atual<=0?'0':(l.temCons?nf(l.diasRest):'—')}</td>`+
    `<td class="num" data-label="Sugerido"><b>${nf(l.sugerido)}</b></td>`+
    `<td class="num" data-label="Valor est.">${l.valorEst>0?brl(l.valorEst):'—'}</td>`+
    `<td data-label="Prioridade"><span class="pill p-${l.prio}">${pillTxt[l.prio]}</span></td>`+
    `<td data-label="Justificativa"><span class="mut" style="font-size:11.5px">${esc(l.jus)}</span></td></tr>`;

  document.getElementById('app').innerHTML=
   `<header class="top"><div><div class="eyebrow">Painel Amore · Requisição Inteligente</div><h1>Requisição de Compra × Estoque</h1><div class="sub">${esc(LOJA)} · ${hoje}</div></div><button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button></header>`
   +`<div class="ia">🧠 <b>Diagnóstico:</b> ${resumo}</div>`
   +`<div class="kpis">`
   +`<div class="kpi bad"><div class="kn">${nCrit}</div><div class="kl">🔴 Críticos</div></div>`
   +`<div class="kpi warn"><div class="kn">${nAlta}</div><div class="kl">🟠 Alta</div></div>`
   +`<div class="kpi"><div class="kn">${nMed}</div><div class="kl">🟡 Média</div></div>`
   +`<div class="kpi"><div class="kn">${linhas.length}</div><div class="kl">Total a repor</div></div>`
   +`<div class="kpi ok"><div class="kn">${brl(valorTotal)}</div><div class="kl">Valor estimado</div></div>`
   +`<div class="kpi"><div class="kn">${semCons}</div><div class="kl">Sem consumo (conferir)</div></div>`
   +`</div>`
   +`<h2>Sugestão de compra por prioridade <span class="h2s">— estoque × consumo (30 dias)</span></h2>`
   +(linhas.length?`<div class="tw"><table><thead><tr><th>Produto</th><th class="num">Atual</th><th class="num">Mín / Ideal</th><th class="num">Cons/dia</th><th class="num">Dias auton.</th><th class="num">Sugerido</th><th class="num">Valor est.</th><th>Prioridade</th><th>Justificativa</th></tr></thead><tbody>${linhas.map(row).join('')}</tbody></table></div>`:`<div class="ia">Nenhuma reposição recomendada. 🎉</div>`)
   +`<div class="foot"><b>Metodologia (Fase 1):</b> consumo médio diário = saídas+perdas dos últimos 30 dias ÷ 30. Dias de autonomia = estoque atual ÷ consumo/dia. Quantidade sugerida = (consumo projetado da semana + estoque de segurança) − estoque atual. Prioridade: 🔴 zerado ou ruptura em &lt;2 dias · 🟠 abaixo do mínimo ou ruptura na semana · 🟡 abaixo do ideal · 🟢 preventiva. Itens sem histórico usam mínimo/ideal e pedem conferência. <b>Próximas fases:</b> descontar pedidos em aberto/em trânsito, solicitações da cozinha, sazonalidade, aprovação da gestão e envio automático à cotação. Painel Amore · ${new Date().toLocaleString('pt-BR')}</div>`;
}
run().catch(function(e){document.getElementById('app').innerHTML='<div class="msg">Erro ao gerar: '+esc(e&&e.message||e)+'</div>';});
</script>
</body>
</html>
